    return re.test(String(id || ''));
  }

  TV.ids = {
    randomHex,
    newId,
    newUnique,
    newNodeId: (exists) => newUnique('N', 4, exists),
    newTagId: (exists) => newUnique('T', 4, exists),
    newBehaviorItemId: (exists) => newUnique('H', 4, exists),
    newEventId: (exists) => newUnique('E', 6, exists),
    newBehaviorEventId: (exists) => newUnique('B', 6, exists),
    newChainId: (exists) => newUnique('C', 4, exists),
    newRuleId: (exists) => newUnique('R', 4, exists),
    newTextId: (exists) => newUnique('X', 4, exists),

<script>
/* js/core/parser.js */
/* TxtVein · 解析层（TxtVein-Lang）
 * 输入：wx1 > cy 35 < 咖啡
 * 输出：已绑定 ID 的 Event 草稿（可能多笔，链式转移会展开）。
 *
 * 这一层只做「文本 → 结构」，不落盘、不渲染。
 * 绑定失败绝不静默创建节点：唯一命中才 ok；多义给 candidates；未命中给 suggest。
 * 标签例外：标签是语义层，允许在 UI 明确提示后自动创建。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);
  const amount = TV.amount || (typeof require === 'function' ? require('./amount.js') : null);
  const date = TV.date || (typeof require === 'function' ? require('./date.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);

  function err(code, message, extra) {
    return Object.assign({ ok: false, code, error: message, message }, extra || {});
  }

  function isSignedNumber(s) {
    return /^[+-]\d{1,3}$/.test(s);
  }

  function looksLikeDateToken(s) {
    if (/^\d{6}$/.test(s) || /^\d{8}$/.test(s)) return true;
    if (/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(s)) return true;
    if (s === '0' || s === '1') return true;
    return isSignedNumber(s);
  }

  function stripDomainPrefix(token) {
    const m = S(token).match(/^([PFCHpfch]):(.*)$/);
    if (!m) return { domain: '', rest: token, explicit: false };
    return { domain: m[1].toUpperCase(), rest: m[2], explicit: true };
  }

  function tokenizeFlow(src) {
    let x = text.normalizeOperators(src);
    x = x.replace(/([^\s])#/g, '$1 #');
    x = x.replace(/\s*>\s*/g, ' > ');
    return x.trim().split(/[\s\u3000]+/).filter(Boolean);
  }

  function cleanTagName(raw) {
    return S(raw).trim().replace(/^#/, '').replace(/^-$/, '');
  }

  function ensureSystemNode(dict, which) {
    const id = which === 'gain' ? 'N_sys_gain' : 'N_sys_loss';
    if (dict.nodes[id]) return id;
    const isGain = which === 'gain';
    dict.nodes[id] = {
      zh_name: isGain ? '增益' : '损耗',
      en_name: isGain ? 'Gain' : 'Loss',
      zh_code: isGain ? 'gain' : 'loss',
      en_code: isGain ? 'gain' : 'loss',
      polarity: isGain ? 'B' : 'A',
      type: isGain ? '收入' : '费用',
      form: isGain ? 'outside' : 'steam',
      domain: 'P',
      parent_id: '',
      weight: 0,
      system: true,
      created_at: new Date().toISOString(),
    };
    return id;
  }

  function findPlanSignature(dict, plans, p) {
    return (plans || []).find((x) => x && x.status === 'active'
      && x.from === p.from && x.to === p.to
      && Number(x.amountCents) === Number(p.amountCents)
      && x.period === p.period && x.domain === p.domain);
  }

  /**
   * 解析一行录入。
   *
   * @param {string} raw
   * @param {object} dict  会被原地修改（自动标签、别名、计数器）
   * @param {object} opts  { now, domain, autoCreateTags, plans, legacySpace }
   * @returns {object} ok / events / plan / warning / candidates
   */
  function parseEntry(raw, dict, opts) {
    const o = opts || {};
    const now = o.now instanceof Date ? o.now : new Date();
    const autoCreateTags = o.autoCreateTags !== false;
    let src = text.normalizeOperators(text.normalize(raw)).trim();
    if (!src) return err('EMPTY', '先输入一笔，例如 wx > cy 35 < 咖啡');

    /* 1. 行首域标记：[P] 或 "P: "（注意 P:微信 不算行首域，它是节点前缀） */
    let lineDomain = '';
    let m = src.match(/^\[([PFCHpfch])\]\s*/);
    if (m) {
      lineDomain = m[1].toUpperCase();
      src = src.slice(m[0].length);
    } else if ((m = src.match(/^([PFCHpfch])\s*:\s+/))) {
      lineDomain = m[1].toUpperCase();
      src = src.slice(m[0].length);
    } else if ((m = src.match(/^([PFCHpfch])\s+/))) {
      lineDomain = m[1].toUpperCase();
      src = src.slice(m[0].length);
    }
    if (!src) return err('EMPTY', '只有域标记，没有内容');

    /* 2. 日期：行首 6/8 位、带分隔符日期、0/1/±N */
    let stamp = date.todayStamp(now);
    let dateResolved = null;
    const firstToken = src.split(/[\s\u3000]+/)[0] || '';
    if (looksLikeDateToken(firstToken)) {
      const r = date.resolveDateToken(firstToken, now);
      if (!r.ok) return err('INVALID_DATE', r.error, { token: firstToken });
      stamp = r.stamp;
      dateResolved = r;
      src = src.slice(firstToken.length).replace(/^[\s\u3000]+/, '');
      if (!src) return err('EMPTY', '只有日期，没有流水');
    }

    /* 3. 资金段 / 标签段：第一个 < 切开 */
    const lt = src.indexOf('<');
    const flowPart = lt >= 0 ? src.slice(0, lt) : src;
    const tagPart = lt >= 0 ? src.slice(lt + 1) : '';
    if (!flowPart.trim()) return err('MISSING_FLOW', '缺少转出与转入节点');

    /* 4. 词法：> 变成独立 token；# 前补空格 */
    const tokens = tokenizeFlow(flowPart);
    const nodes = [];
    const quantities = [];
    const inlineTags = [];
    let period = '';
    let separators = 0;
    let sawAmount = false;

    for (let i = 0; i < tokens.length; i += 1) {
      let tok = tokens[i];
      if (tok === '>') {
        if (!nodes.length) return err('MISSING_FROM', '> 左边缺转出节点');
        if (sawAmount) return err('MISSING_TO', '> 右边缺转入节点');
        separators += 1;
        continue;
      }
      if (/^\*[dmy]$/i.test(tok)) {
        period = tok.slice(1).toLowerCase();
        continue;
      }
      if (tok.startsWith('#')) {
        const name = cleanTagName(tok);
        if (name) inlineTags.push(name);
        continue;
      }
      const sp = amount.splitPeriod(tok);
      if (sp.period) {
        period = sp.period;
        tok = sp.token;
      }
      const q = amount.parseQuantity(tok);
      if (q.ok) {
        quantities.push(Object.assign({ raw: tok }, q));
        sawAmount = true;
        continue;
      }
      if (/^[+-]\d/.test(tok)) {
        return err('INVALID_AMOUNT', '金额必须大于 0：' + tok, { token: tok });
      }
      if (sawAmount) {
        return err('EXTRA_TOKEN', '金额之后还有认不出的内容：' + tok, { token: tok });
      }
      nodes.push(tok);
    }

    if (!nodes.length) return err('MISSING_FROM', '缺少转出节点');
    if (nodes.length === 1) {
      if (!quantities.length) {
        return err('INCOMPLETE_FROM', '只写了「' + nodes[0] + '」。补全为：' + nodes[0] + ' > 转入 金额', {
          draft: true, token: nodes[0],
        });
      }
      return err('MISSING_TO', '缺少转入节点，例如 ' + nodes[0] + ' > 餐饮 35', { token: nodes[0] });
    }
    if (separators > 0 && separators !== nodes.length - 1) {
      return err('OPERATOR_COUNT', '> 的数量与节点不匹配（' + nodes.length + ' 个节点需要 ' + (nodes.length - 1) + ' 个 >）');
    }
    if (!quantities.length) {
      return err('MISSING_AMOUNT', '包含 > 但缺少金额，例如 ' + nodes[0] + ' > ' + nodes[1] + ' 35');
    }

    const segments = nodes.length - 1;
    if (quantities.length !== 1 && quantities.length !== segments) {
      return err('AMOUNT_COUNT', '给了 ' + quantities.length + ' 个金额，但这条链有 ' + segments + ' 段');
    }
    const per = quantities.length === 1
      ? Array.from({ length: segments }, () => quantities[0])
      : quantities;
    const timeCount = per.filter((q) => q.unit === 'time').length;
    if (timeCount && timeCount !== per.length) {
      return err('MIXED_UNIT', '金额与时间不能混在同一条链里');
    }
    if (timeCount && segments > 1) {
      return err('TIME_CHAIN', '时间代币只支持单段转移');
    }
    if (timeCount && period) {
      return err('TIME_PLAN', '时间代币暂不支持周期规则');
    }
    for (const q of per) {
      if (q.unit === 'time' && !(q.minutes > 0)) return err('INVALID_AMOUNT', '时间必须大于 0');
      if (q.unit === 'money' && !(q.cents > 0)) return err('INVALID_AMOUNT', '金额必须大于 0');
    }

    /* 5. 节点绑定 */
    const lineDomainExplicit = !!lineDomain;
    const eventDomainGuess = lineDomain || o.domain || 'P';
    const binding = [];
    for (let i = 0; i < nodes.length; i += 1) {
      const token = nodes[i];
      const pref = stripDomainPrefix(token);
      if (pref.explicit && !pref.rest) return err('EMPTY_NODE', '域前缀后面缺节点：' + token);
      const ctxDomain = pref.domain || eventDomainGuess;
      const r = dictMod.resolveAlias(dict, pref.rest, { domain: ctxDomain, lang: o.lang || 'zh' });
      if (!r.ok) {
        if (r.code === 'AMBIGUOUS') {
          return err('AMBIGUOUS', r.error, {
            token: pref.rest,
            role: i === 0 ? 'from' : i === nodes.length - 1 ? 'to' : 'mid',
            tokenIndex: i,
            candidates: r.candidates,
          });
        }
        return err('UNBOUND_NODE', r.error, {
          token: pref.rest,
          role: i === 0 ? 'from' : i === nodes.length - 1 ? 'to' : 'mid',
          tokenIndex: i,
          suggest: {
            zh_name: pref.rest, zh_code: pref.rest,
            domain: ctxDomain, polarity: 'A',
          },
        });
      }
      if (pref.explicit && r.node.domain !== pref.domain) {
        return err('DOMAIN_MISMATCH', '节点「' + pref.rest + '」属于 ' + r.node.domain + ' 域，不是 ' + pref.domain + ' 域', {
          token: pref.rest,
        });
      }
      binding.push({
        role: i === 0 ? 'from' : i === nodes.length - 1 ? 'to' : 'mid',
        token: pref.rest,
        id: r.id,
        node: r.node,
        explicitDomain: pref.explicit,
        via: r.via,
        aliasAdded: !!r.aliasAdded,
        aliasKey: r.aliasKey || '',
        raw: token,
      });
      dictMod.bumpWeight(dict, r.id, 1);
    }

    const fromB = binding[0];
    const toB = binding[binding.length - 1];
    let eventDomain = lineDomain || fromB.node.domain;
    if (lineDomainExplicit && !fromB.explicitDomain && fromB.node.domain !== lineDomain) {
      return err('DOMAIN_MISMATCH', '当前域是 ' + lineDomain + '，但转出节点属于 ' + fromB.node.domain + ' 域；请写 ' + fromB.node.domain + ':' + fromB.token, { token: fromB.token });
    }
    const crossDomain = fromB.node.domain !== toB.node.domain;
    if (crossDomain && !binding.some((b) => b.explicitDomain)) {
      return err('CROSS_DOMAIN_PREFIX_REQUIRED', '跨域转移必须写明确接口前缀，例如 P:' + fromB.token + ' > C:' + toB.token, {
        token: toB.token,
        fromDomain: fromB.node.domain,
        toDomain: toB.node.domain,
      });
    }
    if (crossDomain && lineDomainExplicit && eventDomain !== fromB.node.domain && eventDomain !== toB.node.domain) {
      eventDomain = fromB.node.domain;
    }

    /* 6. 标签树：< 块间父子，块内空格同级 */
    const tagIds = [];
    const tagsCreated = [];
    let parentId = '';
    const blocks = tagPart
      ? tagPart.split('<').map((x) => x.trim()).filter(Boolean)
      : [];
    for (const block of blocks) {
      const names = block.split(/[\s\u3000]+/).filter(Boolean);
      let firstId = '';
      for (const rawName of names) {
        const name = cleanTagName(rawName);
        if (!name) continue;
        const r = dictMod.ensureTag(dict, name, {
          domain: eventDomain,
          parentId,
          lang: o.lang || 'zh',
        });
        if (!r.ok) {
          if (r.code === 'AMBIGUOUS') {
            return err('AMBIGUOUS', r.error, { token: name, role: 'tag', candidates: r.candidates });
          }
          if (!autoCreateTags) {
            return err('UNBOUND_TAG', r.error, { token: name, role: 'tag', suggestTag: name });
          }
          return err('TAG_CREATE_FAILED', r.error, { token: name });
        }
        if (!firstId) firstId = r.id;
        if (!tagIds.includes(r.id)) tagIds.push(r.id);
        if (r.created) tagsCreated.push({ id: r.id, name });
        dictMod.bumpWeight(dict, r.id, 1);
      }
      parentId = firstId || parentId;
    }
    for (const rawName of inlineTags) {
      const name = cleanTagName(rawName);
      if (!name) continue;
      const r = dictMod.ensureTag(dict, name, { domain: eventDomain, parentId: '', lang: o.lang || 'zh' });
      if (!r.ok) {
        if (r.code === 'AMBIGUOUS') {
          return err('AMBIGUOUS', r.error, { token: name, role: 'tag', candidates: r.candidates });
        }
        if (!autoCreateTags) return err('UNBOUND_TAG', r.error, { token: name, role: 'tag', suggestTag: name });
        return err('TAG_CREATE_FAILED', r.error, { token: name });
      }
      if (!tagIds.includes(r.id)) tagIds.push(r.id);
      if (r.created) tagsCreated.push({ id: r.id, name });
    }

    /* 7. 展开链式转移 */
    const chainId = segments > 1 ? dictMod.nextId(dict, 'chain') : '';
    const events = [];
    const pushEvent = (from, to, cents, minutes, extra) => {
      events.push(Object.assign({
        domain: eventDomain,
        date: stamp,
        from,
        to,
        amountCents: minutes > 0 ? 0 : cents,
        minutes: minutes || 0,
        tagIds: tagIds.slice(),
        chainId,
        raw: text.normalize(raw).trim(),
      }, extra || {}));
    };

    for (let i = 0; i < segments; i += 1) {
      pushEvent(binding[i].id, binding[i + 1].id, per[i].cents, per[i].minutes);
    }

    /* 多金额链：中间差额进入损益池，保证中间节点净变动为 0 */
    let lossCents = 0;
    let gainCents = 0;
    if (segments > 1 && quantities.length > 1) {
      for (let i = 1; i < segments; i += 1) {
        const delta = per[i - 1].cents - per[i].cents;
        if (delta > 0) {
          const lossId = ensureSystemNode(dict, 'loss');
          pushEvent(binding[i].id, lossId, delta, 0, { system: true, diff: 'loss' });
          lossCents += delta;
        } else if (delta < 0) {
          const gainId = ensureSystemNode(dict, 'gain');
          pushEvent(gainId, binding[i].id, -delta, 0, { system: true, diff: 'gain' });
          gainCents += -delta;
        }
      }
    }

    /* 8. 周期规则（当前这笔照常生成，同时挂一条计划） */
    events.forEach((e) => { e.crossDomain = crossDomain && !e.system; });
    let plan = null;
    if (period) {
      if (segments > 1) return err('PLAN_CHAIN', '周期规则只支持单段转移');
      const candidate = {
        status: 'active',
        start: stamp,
        lastRun: stamp,
        period,
        domain: eventDomain,
        from: fromB.id,
        to: toB.id,
        amountCents: per[0].cents,
        tagIds: tagIds.slice(),
        raw: text.normalize(raw).trim(),
        createdAt: new Date().toISOString(),
      };
      const same = findPlanSignature(dict, o.plans, candidate);
      plan = Object.assign({ id: same ? same.id : dictMod.nextId(dict, 'plan') }, candidate);
    }

    const fromLabel = dictMod.renderNode(dict, fromB.id, 'PLAIN', o.lang || 'zh');
    const toLabel = dictMod.renderNode(dict, toB.id, 'PLAIN', o.lang || 'zh');
    const tagLabels = tagIds.map((id) => dictMod.renderTag(dict, id, 'PLAIN', o.lang || 'zh'));
    const chainNodes = binding.map((b) => dictMod.renderNode(dict, b.id, 'PLAIN', o.lang || 'zh'));
    const qLabel = (q) => (q.minutes > 0 ? amount.formatTime(q.minutes) : amount.centsToDisplay(q.cents));

    const preview = {
      domain: eventDomain,
      date: stamp,
      from: fromB.id,
      to: toB.id,
      fromLabel,
      toLabel,
      amountCents: per[0].cents,
      minutes: per[0].minutes,
      amountLabel: qLabel(per[0]),
      amounts: per.map(qLabel),
      tagLabels,
      chainNodes,
      text: chainNodes.join(' > ') + ' ' + per.map(qLabel).join(' ')
        + (tagLabels.length ? ' < ' + tagLabels.join(' < ') : ''),
      crossDomain,
      lossCents,
      gainCents,
    };

    const warnings = [];
    if (separators === 0) warnings.push('兼容写法：省略了 >，已按「转出 转入 金额」解析');
    if (dateResolved && dateResolved.relative) warnings.push('相对日期 ' + raw.split(/\s/)[0] + ' 已固化为 ' + stamp);
    if (tagsCreated.length) warnings.push('新建标签：' + tagsCreated.map((x) => x.name).join('、'));
    if (crossDomain) warnings.push('跨域转移：' + fromB.node.domain + ' → ' + toB.node.domain);

    return {
      ok: true,
      kind: 'entry',
      events,
      plan,
      chainId,
      tagsCreated,
      binding,
      preview,
      warnings,
      domain: eventDomain,
      date: stamp,
      period,
      segments,
      crossDomain,
    };
  }

  /** 把一笔 Event 还原成可编辑的输入串（用简码，不用名字）。 */
  function entryTextForEvent(event, dict, opts) {
    const o = opts || {};
    const from = dict.nodes[event.from];
    const to = dict.nodes[event.to];
    const fCode = from ? dictMod.displayCode(dict, event.from, o.lang || 'zh') : event.from;
    const tCode = to ? dictMod.displayCode(dict, event.to, o.lang || 'zh') : event.to;
    const parts = [];
    const dom = event.domain || 'P';
    if (o.includeDomain !== false && dom !== 'P') parts.push(dom);
    if (o.includeDate !== false) parts.push(event.date);
    parts.push(fCode, '>', tCode);
    parts.push(event.minutes > 0 ? amount.formatTime(event.minutes) : String(event.amountCents));
    const tagNames = (event.tagIds || [])
      .map((id) => dict.tags[id])
      .filter(Boolean)
      .map((t) => t.zh_name || t.en_name);
    if (tagNames.length) parts.push('<', tagNames.join(' < '));
    return parts.join(' ');
  }

  TV.parser = {
    parseEntry,
    entryTextForEvent,
    tokenizeFlow,
    looksLikeDateToken,
    stripDomainPrefix,
    ensureSystemNode,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.parser;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* js/core/source.js */
/* TxtVein · 源码层（流水 / 字典）
 *
 * 事实层是后台 ID 图；编辑器文本是投影 + 手稿。
 * 一条源码行可以展开多条原子边：
 *   微信 > 晚餐 > 开心 120 1
 *     E_ 微信>晚餐 120
 *     B_ 晚餐>开心 1
 *
 * 字典分三段：
 *   [ACCOUNT] node ...   会计节点 N_
 *   [NOTE]    tag ...    备注标签 T_
 *   [BEHAVIOR] item ...  行为项 H_（身体/心理统一，树由字典定义）
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const dictMod = TV.dict;
  const amount = TV.amount;
  const dateMod = TV.date;
  const ids = TV.ids;

  const TAG_KINDS = ['plain', 'gain', 'suppress', 'time'];
  const SECTIONS = { account: 'account', note: 'note', behavior: 'behavior' };

  function diag(line, message, severity, col) {
    return { line: line, col: col || 0, message, severity: severity || 'error' };
  }

  function stripComment(line) {
    const s = S(line);
    const i = s.indexOf('//');
    return i >= 0 ? s.slice(0, i) : s;
  }

  function hasComment(line) {
    return S(line).indexOf('//') >= 0;
  }

  function formatYuanExact(cents) {
    const n = Math.round(Number(cents) || 0);
    const neg = n < 0;
    const a = Math.abs(n);
    let out = String(Math.floor(a / 100));
    const frac = a % 100;
    if (frac) out += '.' + String(frac).padStart(2, '0').replace(/0+$/, '');
    return (neg ? '-' : '') + out;
  }

  function codeSafe(s) {
    return S(s).replace(/\s+/g, '').replace(/[<>|#，,]/g, '');
  }

  function uniqueCode(base, used) {
    let code = codeSafe(base) || 'x';
    if (!used.has(code)) { used.add(code); return code; }
    for (let i = 2; i < 10000; i += 1) {
      const next = code + i;
      if (!used.has(next)) { used.add(next); return next; }
    }
    return code;
  }

  function sourceCodeMap(dict) {
    const out = new Map();
    ['nodes', 'tags', 'behaviors'].forEach((kind) => {
      const used = new Set();
      const groups = new Map();
      Object.keys(dict[kind] || {}).forEach((id) => {
        const x = dict[kind][id];
        const base = codeSafe(x.zh_code || x.en_code || id) || 'x';
        if (!groups.has(base)) groups.set(base, []);
        groups.get(base).push(id);
      });
      groups.forEach((arr, base) => {
        if (arr.length === 1) { out.set(arr[0], uniqueCode(base, used)); return; }
        arr.forEach((id, i) => out.set(id, uniqueCode(base + (i + 1), used)));
      });
    });
    return out;
  }

  function dictTail(weight, parent, system) {
    const parts = [];
    if (Number(weight)) parts.push(String(Number(weight)));
    if (parent && parent !== '-') parts.push('@' + parent);
    if (system) parts.push('system');
    return parts.length ? ' ' + parts.join(' ') : '';
  }

  function dictToSource(dict) {
    const codeMap = sourceCodeMap(dict);
    const lines = [];
    lines.push('// TxtVein 字典 · 三段：会计 / 备注 / 行为');
    lines.push('// 会计节点：域 大类 形态 中文码 英文码 中文名 | 英文名 [权重] [@父码] [system]');
    lines.push('// 备注标签：域 类型 中文码 英文码 中文名 | 英文名 [权重] [@父码]');
    lines.push('// 行为项：域 中文码 英文码 中文名 | 英文名 [权重] [@父码]');
    lines.push('// 权重=候选排序（越大越前）；@父码=树上一级；不写即根');
    lines.push('// 别名：alias 别名 -> N:节点码 / T:标签码 / H:行为码');
    lines.push('[会计]');
    Object.keys(dict.nodes || {}).map((id) => ({ id, n: dict.nodes[id] }))
      .sort((a, b) => (a.n.domain + a.n.type + (codeMap.get(a.id) || '')).localeCompare(b.n.domain + b.n.type + (codeMap.get(b.id) || '')))
      .forEach((x) => {
        const n = x.n;
        const zh = S(n.zh_name || n.en_name).replace(/\|/g, '/') || '-';
        const en = S(n.en_name || n.zh_name).replace(/\|/g, '/') || '-';
        const parent = n.parent_id && codeMap.has(n.parent_id) ? codeMap.get(n.parent_id) : '-';
        lines.push('node ' + [n.domain, n.type, n.form || 'fluid', codeMap.get(x.id) || 'n', n.en_code || '-', zh].join(' ')
          + ' | ' + en + dictTail(n.weight, parent, n.system));
      });
    lines.push('[备注]');
    Object.keys(dict.tags || {}).map((id) => ({ id, t: dict.tags[id] }))
      .sort((a, b) => (a.t.domain + (a.t.kind || '') + (codeMap.get(a.id) || '')).localeCompare(b.t.domain + (b.t.kind || '') + (codeMap.get(b.id) || '')))
      .forEach((x) => {
        const t = x.t;
        const zh = S(t.zh_name || t.en_name).replace(/\|/g, '/') || '-';
        const en = S(t.en_name || t.zh_name).replace(/\|/g, '/') || '-';
        const parent = t.parent_id && codeMap.has(t.parent_id) ? codeMap.get(t.parent_id) : '-';
        lines.push('tag ' + [t.domain, t.kind || 'plain', codeMap.get(x.id) || 't', t.en_code || '-', zh].join(' ')
          + ' | ' + en + dictTail(t.weight, parent, false));
      });
    lines.push('[行为]');
    Object.keys(dict.behaviors || {}).map((id) => ({ id, h: dict.behaviors[id] }))
      .sort((a, b) => (a.h.domain + (codeMap.get(a.id) || '')).localeCompare(b.h.domain + (codeMap.get(b.id) || '')))
      .forEach((x) => {
        const h = x.h;
        const zh = S(h.zh_name || h.en_name).replace(/\|/g, '/') || '-';
        const en = S(h.en_name || h.zh_name).replace(/\|/g, '/') || '-';
        const parent = h.parent_id && codeMap.has(h.parent_id) ? codeMap.get(h.parent_id) : '-';
        lines.push('item ' + [h.domain, codeMap.get(x.id) || 'h', h.en_code || '-', zh].join(' ')
          + ' | ' + en + dictTail(h.weight, parent, false));
      });
    const autoKeys = new Set();
    ['nodes', 'tags', 'behaviors'].forEach((kind) => {
      Object.keys(dict[kind] || {}).forEach((id) => {
        const x = dict[kind][id];
        [x.zh_name, x.en_name, x.zh_code, x.en_code, codeMap.get(id)].forEach((k) => k && autoKeys.add(k));
      });
    });
    Object.keys(dict.aliases || {}).forEach((key) => {
      const targets = (dict.aliases[key] || []).filter((id) => dict.nodes[id] || dict.tags[id] || dict.behaviors[id]);
      if (!targets.length) return;
      const toks = targets.map((id) => (dict.nodes[id] ? 'N:' : dict.tags[id] ? 'T:' : 'H:') + codeMap.get(id));
      if (targets.length === 1 && autoKeys.has(key)) return;
      lines.push('alias ' + key + ' -> ' + toks.join(', '));
    });
    return lines.join('\n') + '\n';
  }

  function domainPrefix(domain) {
    const d = String(domain || 'P').toUpperCase();
    return d === 'P' ? '' : d + ' ';
  }

  function normalizeDomainSyntax(text) {
    return S(text).replace(/\r\n?/g, '\n').split('\n').map((line) => (
      line.replace(/^(\s*)\[([PFCH])\]\s+/i, (m, sp, d) => (
        d.toUpperCase() === 'P' ? sp : sp + d.toUpperCase() + ' '
      )).replace(/^(\s*)P\s+/i, '$1')
    )).join('\n');
  }

  function ledgerToSource(dict, events, behaviors, notes) {
    const codeMap = sourceCodeMap(dict);
    const lines = [];
    lines.push('// TxtVein ledger source · 一行可展开多条原子边；日期 YYMMDD；// 注释');
    (events || []).forEach((e) => {
      const fn = dict.nodes[e.from];
      const tn = dict.nodes[e.to];
      const cross = fn && tn && fn.domain !== tn.domain;
      const from = (cross ? fn.domain + ':' : '') + (codeMap.get(e.from) || '?');
      const to = (cross ? tn.domain + ':' : '') + (codeMap.get(e.to) || '?');
      const amt = e.minutes > 0 ? amount.formatTime(e.minutes) : formatYuanExact(e.amountCents);
      const tags = (e.tagIds || []).map((id) => codeMap.get(id)).filter(Boolean).map((c) => ' < ' + c).join('');
      lines.push(domainPrefix(e.domain) + e.date + ' ' + from + ' > ' + to + ' ' + amt + tags);
    });
    (behaviors || []).forEach((b) => {
      const from = codeMap.get(b.from) || '?';
      const to = codeMap.get(b.to) || '?';
      const tags = (b.tagIds || []).map((id) => codeMap.get(id)).filter(Boolean).map((c) => ' < ' + c).join('');
      lines.push(domainPrefix(b.domain) + b.date + ' ' + from + ' > ' + to + ' ' + (b.weight || 1) + tags);
    });
    (notes || []).forEach((n) => {
      if (n.kind === 'comment' || n.kind === 'invalid') {
        lines.push(n.raw || '');
        return;
      }
      const amt = n.minutes > 0 ? amount.formatTime(n.minutes) : n.amountCents ? formatYuanExact(n.amountCents) : '';
      const cat = codeMap.get(n.categoryId) || '';
      const kws = (n.keywordIds || []).map((id) => codeMap.get(id)).filter(Boolean).join(' ');
      lines.push(domainPrefix(n.domain) + n.date + ' ' + (amt ? amt + ' ' : '') + '< ' + cat + (kws ? ' < ' + kws : ''));
    });
    return lines.join('\n') + '\n';
  }

  function parseNames(text) {
    const s = S(text);
    const i = s.indexOf('|');
    if (i < 0) return { left: s.trim(), right: '' };
    return { left: s.slice(0, i).trim(), right: s.slice(i + 1).trim() };
  }

  function parseTail(right) {
    const toks = S(right).split(/[\s\u3000]+/).filter(Boolean);
    let system = false;
    if (toks.length && toks[toks.length - 1] === 'system') { system = true; toks.pop(); }
    let parent = '-';
    let weight = '0';
    if (toks.length) {
      const last = toks[toks.length - 1];
      if (last.startsWith('@') && last.length > 1) {
        parent = toks.pop().slice(1);
        if (toks.length && /^-?\d+(?:\.\d+)?$/.test(toks[toks.length - 1])) weight = toks.pop();
      } else if (/^-?\d+(?:\.\d+)?$/.test(last)) {
        weight = toks.pop();
      } else if (toks.length >= 2 && /^-?\d+(?:\.\d+)?$/.test(toks[toks.length - 2])) {
        /* 兼容旧格式：| 英文名 权重 父码（无 @） */
        parent = toks.pop();
        weight = toks.pop();
      }
    }
    return { enName: toks.join(' '), weight, parent, system };
  }

  function compileDictSource(text, opts) {
    const o = opts || {};
    const now = o.now instanceof Date ? o.now : new Date();
    const diagnostics = [];
    const records = [];
    const aliases = [];
    const seen = { node: new Map(), tag: new Map(), item: new Map() };
    let section = 'account';
    const lines = S(text).replace(/\r\n?/g, '\n').split('\n');

    lines.forEach((raw, idx) => {
      const lineNo = idx + 1;
      const line = stripComment(raw).trim();
      if (!line) return;
      const sec = line.match(/^\[(ACCOUNT|NOTE|BEHAVIOR|会计|备注|行为)\]$/i);
      if (sec) {
        const key = sec[1].toUpperCase();
        section = key === '会计' || key === 'ACCOUNT' ? 'account'
          : key === '备注' || key === 'NOTE' ? 'note' : 'behavior';
        return;
      }
      if (/^alias\b/i.test(line)) {
        const m = line.match(/^alias\s+(.+?)\s*->\s*(.+)$/i);
        if (!m) { diagnostics.push(diag(lineNo, '别名格式：alias 别名 -> N:节点码 / T:标签码 / H:行为码')); return; }
        aliases.push({ key: m[1].trim(), targets: m[2].split(',').map((x) => x.trim()).filter(Boolean), line: lineNo });
        return;
      }
      const head = line.match(/^(node|tag|item)\b/i);
      if (!head) { diagnostics.push(diag(lineNo, '只认 node / tag / item / alias 开头的行')); return; }
      const kind = head[1].toLowerCase();
      const { left, right } = parseNames(line);
      const toks = left.split(/[\s\u3000]+/).filter(Boolean);
      if (kind === 'node') {
        if (section !== 'account') { diagnostics.push(diag(lineNo, 'node 只能写在 [会计] 段')); return; }
        if (toks.length < 7) { diagnostics.push(diag(lineNo, '节点格式：node 域 大类 形态 中文码 英文码 中文名 | 英文名 权重 父码')); return; }
        const dm = dictMod.normalizeDomain(toks[1], 'P');
        const ty = dictMod.normalizeType(toks[2]);
        if (!dm.ok) { diagnostics.push(diag(lineNo, dm.error)); return; }
        if (!ty.ok) { diagnostics.push(diag(lineNo, ty.error)); return; }
        const form = dictMod.normalizeForm(ty.type, toks[3]);
        if (!form.ok) { diagnostics.push(diag(lineNo, form.error)); return; }
        const code = codeSafe(toks[4]);
        const enCode = codeSafe(toks[5]) || code;
        const zhName = toks.slice(6).join(' ') || toks[4];
        const tail = parseTail(right);
        if (!code) { diagnostics.push(diag(lineNo, '节点缺中文码')); return; }
        if (seen.node.has(code)) { diagnostics.push(diag(lineNo, '节点码重复：' + code)); return; }
        seen.node.set(code, true);
        records.push({
          kind: 'node', line: lineNo, domain: dm.domain, type: ty.type, pole: ty.pole, form: form.form,
          code, enCode, zhName, enName: tail.enName || zhName, weight: Number(tail.weight) || 0,
          parentCode: tail.parent, system: tail.system,
        });
        return;
      }
      if (kind === 'tag') {
        if (section !== 'note') { diagnostics.push(diag(lineNo, 'tag 只能写在 [备注] 段')); return; }
        if (toks.length < 6) { diagnostics.push(diag(lineNo, '标签格式：tag 域 类型 中文码 英文码 中文名 | 英文名 权重 父码')); return; }
        const dm = dictMod.normalizeDomain(toks[1], 'P');
        if (!dm.ok) { diagnostics.push(diag(lineNo, dm.error)); return; }
        const tagKind = TAG_KINDS.indexOf(toks[2]) >= 0 ? toks[2] : dictMod.tagKindOf(toks[5]);
        const code = codeSafe(toks[3]);
        const enCode = codeSafe(toks[4]) || code;
        const zhName = toks.slice(5).join(' ') || toks[3];
        const tail = parseTail(right);
        if (!code) { diagnostics.push(diag(lineNo, '标签缺中文码')); return; }
        if (seen.tag.has(code)) { diagnostics.push(diag(lineNo, '标签码重复：' + code)); return; }
        seen.tag.set(code, true);
        records.push({
          kind: 'tag', line: lineNo, domain: dm.domain, tagKind, code, enCode,
          zhName, enName: tail.enName || zhName, weight: Number(tail.weight) || 0, parentCode: tail.parent,
        });
        return;
      }
      /* item = 行为项，身体/心理统一，层级由 parent 定义 */
      if (section !== 'behavior') { diagnostics.push(diag(lineNo, 'item 只能写在 [行为] 段')); return; }
      if (toks.length < 5) { diagnostics.push(diag(lineNo, '行为项格式：item 域 中文码 英文码 中文名 | 英文名 权重 父码')); return; }
      const dm = dictMod.normalizeDomain(toks[1], 'P');
      if (!dm.ok) { diagnostics.push(diag(lineNo, dm.error)); return; }
      const code = codeSafe(toks[2]);
      const enCode = codeSafe(toks[3]) || code;
      const zhName = toks.slice(4).join(' ') || toks[2];
      const tail = parseTail(right);
      if (!code) { diagnostics.push(diag(lineNo, '行为项缺中文码')); return; }
      if (seen.item.has(code)) { diagnostics.push(diag(lineNo, '行为项码重复：' + code)); return; }
      seen.item.set(code, true);
      records.push({
        kind: 'item', line: lineNo, domain: dm.domain, code, enCode,
        zhName, enName: tail.enName || zhName, weight: Number(tail.weight) || 0, parentCode: tail.parent,
      });
    });

    const dict = dictMod.emptyDict(o.vaultId || '', now);
    dict.behaviors = {};
    dict.link = '';
    const usedIds = new Set(['N_sys_loss', 'N_sys_gain']);
    const nodeByCode = new Map();
    const tagByCode = new Map();
    const itemByCode = new Map();
    records.filter((r) => r.kind === 'node').forEach((r) => {
      const id = ids.newNodeId((x) => usedIds.has(x));
      usedIds.add(id);
      dict.nodes[id] = {
        zh_name: r.zhName, en_name: r.enName, zh_code: r.code, en_code: r.enCode,
        polarity: r.pole, type: r.type, form: r.form, domain: r.domain,
        parent_id: '', weight: r.weight, system: !!r.system, created_at: now.toISOString(),
      };
      nodeByCode.set(r.code, id);
    });
    records.filter((r) => r.kind === 'tag').forEach((r) => {
      const id = ids.newTagId((x) => usedIds.has(x));
      usedIds.add(id);
      dict.tags[id] = {
        zh_name: r.zhName, en_name: r.enName, zh_code: r.code, en_code: r.enCode,
        domain: r.domain, parent_id: '', weight: r.weight, kind: r.tagKind, created_at: now.toISOString(),
      };
      tagByCode.set(r.code, id);
    });
    records.filter((r) => r.kind === 'item').forEach((r) => {
      const id = ids.newBehaviorItemId((x) => usedIds.has(x));
      usedIds.add(id);
      dict.behaviors[id] = {
        zh_name: r.zhName, en_name: r.enName, zh_code: r.code, en_code: r.enCode,
        domain: r.domain, parent_id: '', weight: r.weight, created_at: now.toISOString(),
      };
      itemByCode.set(r.code, id);
    });
    records.forEach((r) => {
      const id = r.kind === 'node' ? nodeByCode.get(r.code) : r.kind === 'tag' ? tagByCode.get(r.code) : itemByCode.get(r.code);
      if (!id) return;
      if (r.parentCode && r.parentCode !== '-') {
        const pid = r.kind === 'node' ? nodeByCode.get(r.parentCode) : r.kind === 'tag' ? tagByCode.get(r.parentCode) : itemByCode.get(r.parentCode);
        if (!pid) diagnostics.push(diag(r.line, (r.kind === 'node' ? '节点' : r.kind === 'tag' ? '标签' : '行为项') + '父码不存在：' + r.parentCode));
        else if (r.kind === 'node') dict.nodes[id].parent_id = pid;
        else if (r.kind === 'tag') dict.tags[id].parent_id = pid;
        else dict.behaviors[id].parent_id = pid;
      }
      dictMod.addAlias(dict, r.code, id);
      dictMod.addAlias(dict, r.enCode, id);
      dictMod.addAlias(dict, r.zhName, id);
      dictMod.addAlias(dict, r.enName, id);
    });
    aliases.forEach((a) => {
      a.targets.forEach((tok) => {
        const m = tok.match(/^([NTH]):(.+)$/i);
        const kind = m ? m[1].toUpperCase() : '';
        const code = m ? m[2] : tok;
        const id = kind === 'T' ? tagByCode.get(code)
          : kind === 'H' ? itemByCode.get(code)
            : kind === 'N' ? nodeByCode.get(code)
              : (nodeByCode.get(code) || tagByCode.get(code) || itemByCode.get(code));
        if (!id) diagnostics.push(diag(a.line, '别名目标不存在：' + tok));
        else dictMod.addAlias(dict, a.key, id);
      });
    });
    [['N_sys_loss', 'loss', 'Loss', '费用', 'A', 'steam', '损耗'],
      ['N_sys_gain', 'gain', 'Gain', '收入', 'B', 'outside', '增益']].forEach((x) => {
      if (dict.nodes[x[0]]) return;
      dict.nodes[x[0]] = {
        zh_name: x[6], en_name: x[2], zh_code: x[1], en_code: x[1],
        polarity: x[4], type: x[3], form: x[5], domain: 'P',
        parent_id: '', weight: 0, system: true, created_at: now.toISOString(),
      };
    });
    dict.meta.nextNode = 1;
    dict.meta.nextTag = 1;
    dict.meta.nextEvent = 1;
    dict.meta.nextChain = 1;
    dict.meta.nextRule = 1;
    dict.meta.nextPlan = 1;
    dict.meta.updatedAt = now.toISOString();
    const errors = diagnostics.filter((x) => x.severity === 'error').length;
    return { ok: errors === 0, dict, diagnostics, errors, lines: lines.length };
  }

  /* ---------------- 行为/会计/备注解析 ---------------- */

  function behaviorMatches(dict, token) {
    const t = S(token).trim();
    const low = t.toLowerCase();
    const idsOut = [];
    Object.keys(dict.behaviors || {}).forEach((id) => {
      const h = dict.behaviors[id];
      if (S(h.zh_code).toLowerCase() === low || S(h.en_code).toLowerCase() === low
        || h.zh_name === t || h.en_name === t) idsOut.push(id);
    });
    return idsOut;
  }

  function behaviorPrefix(dict, token) {
    const t = S(token).trim();
    if (!t) return [];
    const low = t.toLowerCase();
    const idsOut = [];
    Object.keys(dict.behaviors || {}).forEach((id) => {
      const h = dict.behaviors[id];
      if (S(h.zh_code).toLowerCase().startsWith(low) || S(h.en_code).toLowerCase().startsWith(low)
        || S(h.zh_name).startsWith(t) || S(h.en_name).toLowerCase().startsWith(low)) idsOut.push(id);
    });
    return idsOut;
  }

  function resolveBehavior(dict, token, ctx) {
    const t = S(token).trim();
    let idsOut = (dict.aliasIds ? [] : []);
    if (dict.aliases) {
      const hit = Object.keys(dict.aliases).find((k) => k.toLowerCase() === t.toLowerCase());
      if (hit) idsOut = (dict.aliases[hit] || []).filter((id) => dict.behaviors[id]);
    }
    if (idsOut.length === 1) return { ok: true, id: idsOut[0], item: dict.behaviors[idsOut[0]] };
    if (idsOut.length > 1) return { ok: false, ambiguous: idsOut.map((id) => ({ id, item: dict.behaviors[id] })) };
    idsOut = behaviorMatches(dict, t);
    if (idsOut.length === 1) return { ok: true, id: idsOut[0], item: dict.behaviors[idsOut[0]] };
    if (idsOut.length > 1) return { ok: false, ambiguous: idsOut.map((id) => ({ id, item: dict.behaviors[id] })) };
    idsOut = behaviorPrefix(dict, t);
    if (idsOut.length === 1) return { ok: true, id: idsOut[0], item: dict.behaviors[idsOut[0]] };
    if (idsOut.length > 1) return { ok: false, ambiguous: idsOut.map((id) => ({ id, item: dict.behaviors[id] })) };
    return { ok: false, unbound: true };
  }

  function resolveToken(dict, raw, ctx) {
    let token = S(raw).trim();
    let force = '';
    const fm = token.match(/^([NTH]):(.+)$/i);
    if (fm) { force = fm[1].toUpperCase(); token = fm[2]; }
    let domain = '';
    const dm = token.match(/^([PFCH]):(.+)$/i);
    if (dm) { domain = dm[1].toUpperCase(); token = dm[2]; }
    if (force === 'H') {
      const r = resolveBehavior(dict, token, { domain: domain || ctx.domain });
      return r.ok ? { ok: true, account: null, behavior: r.id, force } : { ok: false, error: '找不到行为项：' + token, force };
    }
    if (force === 'N') {
      const r = dictMod.resolveAlias(dict, token, { domain: domain || ctx.domain, lang: 'zh' });
      return r.ok ? { ok: true, account: r.id, behavior: null, force } : { ok: false, error: r.error, force };
    }
    const a = dictMod.resolveAlias(dict, token, { domain: domain || ctx.domain, lang: 'zh' });
    const b = resolveBehavior(dict, token, { domain: domain || ctx.domain });
    if (a.ok && b.ok) return { ok: true, account: a.id, behavior: b.id, dual: true };
    if (a.ok) return { ok: true, account: a.id, behavior: null };
    if (b.ok) return { ok: true, account: null, behavior: b.id };
    if (a.code === 'AMBIGUOUS' || b.ambiguous) {
      return { ok: false, error: '多义：' + token, ambiguous: true };
    }
    return { ok: false, error: '找不到节点/行为项：' + token };
  }

  function ensureNoteTag(dict, name, ctx, autoTags, usedIds) {
    const t = S(name).trim();
    if (!t) return '';
    const r = dictMod.resolveTag(dict, t, { domain: ctx.domain });
    if (r.ok) return r.id;
    let code = codeSafe(t) || 'tag';
    const existing = Object.keys(dict.tags || {}).find((id) => dict.tags[id].zh_code === code);
    if (existing) code = code + '_2';
    const id = ids.newTagId((x) => usedIds.has(x));
    usedIds.add(id);
    dict.tags[id] = {
      zh_name: t, en_name: t, zh_code: code, en_code: code,
      domain: ctx.domain || 'P', parent_id: ctx.parentId || '',
      weight: 10, kind: dictMod.tagKindOf(t), created_at: new Date().toISOString(),
    };
    dictMod.addAlias(dict, code, id);
    dictMod.addAlias(dict, t, id);
    autoTags.push({ id, name: t, code });
    return id;
  }

  /** 行为项自动建：身体/心理统一，层级由字典后续维护 */
  function ensureBehaviorItem(dict, rawToken, ctx, autoBehaviors, usedIds) {
    let token = S(rawToken).trim();
    const fm = token.match(/^([NTH]):(.+)$/i);
    if (fm) token = fm[2];
    const dm = token.match(/^([PFCH]):(.+)$/i);
    if (dm) token = dm[2];
    const exist = Object.keys(dict.behaviors || {}).find((id) => {
      const h = dict.behaviors[id];
      return h.zh_code === token || h.en_code === token || h.zh_name === token || h.en_name === token;
    });
    if (exist) return exist;
    let nodeId = Object.keys(dict.nodes || {}).find((id) => {
      const n = dict.nodes[id];
      return n.zh_code === token || n.en_code === token || n.zh_name === token || n.en_name === token;
    });
    let name = token;
    let code = codeSafe(token) || 'h';
    let domain = ctx.domain || 'P';
    if (nodeId) {
      const n = dict.nodes[nodeId];
      name = n.zh_name || token;
      code = n.zh_code || code;
      domain = n.domain || domain;
    }
    code = codeSafe(code) || 'h';
    let unique = code;
    let i = 2;
    while (Object.keys(dict.behaviors || {}).some((id) => dict.behaviors[id].zh_code === unique)) {
      unique = code + i;
      i += 1;
    }
    const id = ids.newBehaviorItemId((x) => usedIds.has(x));
    usedIds.add(id);
    dict.behaviors[id] = {
      zh_name: name, en_name: name, zh_code: unique, en_code: unique,
      domain, parent_id: '', weight: 10, created_at: new Date().toISOString(),
    };
    dictMod.addAlias(dict, unique, id);
    dictMod.addAlias(dict, name, id);
    if (nodeId) dictMod.addAlias(dict, token, id);
    autoBehaviors.push({ id, name, code: unique });
    return id;
  }

  function parseTagBlocks(tagPart, dict, ctx, autoTags, usedIds) {
    const out = [];
    let parentId = '';
    const blocks = S(tagPart).split('<').map((x) => x.trim()).filter(Boolean);
    blocks.forEach((block) => {
      const names = block.split(/[\s\u3000]+/).filter(Boolean);
      let firstId = '';
      names.forEach((name) => {
        if (name === '-') return;
        const id = ensureNoteTag(dict, name, { domain: ctx.domain, parentId }, autoTags, usedIds);
        if (!id) return;
        if (!firstId) firstId = id;
        if (!out.includes(id)) out.push(id);
      });
      parentId = firstId || parentId;
    });
    return out;
  }

  function parseLedgerLine(raw, dict, opts, ctxState) {
    const o = opts || {};
    const now = o.now instanceof Date ? o.now : new Date();
    const diagnostics = [];
    const events = [];
    const behaviors = [];
    const notes = [];
    const autoTags = [];
    const autoBehaviors = [];
    const usedIds = ctxState.usedIds;
    const lineNo = ctxState.lineNo;
    function invalidNote(rawText, message, domain, stamp) {
      const id = ids.newTextId((x) => usedIds.has(x));
      usedIds.add(id);
      notes.push({
        id, kind: 'invalid', raw: String(rawText || '').trim(), line: lineNo,
        domain: domain || 'P', date: stamp || dateMod.todayStamp(new Date()),
        accounting: false, diagnostics: [diag(lineNo, message)],
      });
      diagnostics.push(diag(lineNo, message));
    }
    let src = S(raw).replace(/\r\n?/g, '\n');
    const commented = hasComment(src);
    src = stripComment(src).trim();
    if (!src) {
      if (commented) {
        notes.push({ id: ids.newTextId((x) => usedIds.has(x)), kind: 'comment', raw: S(raw).trim(), line: lineNo, domain: 'P', date: dateMod.todayStamp(now), accounting: false });
      }
      return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
    }
    if (/^\/\//.test(S(raw).trim())) {
      const id = ids.newTextId((x) => usedIds.has(x)); usedIds.add(id);
      notes.push({ id, kind: 'comment', raw: S(raw).trim(), line: lineNo, domain: 'P', date: dateMod.todayStamp(now), accounting: false });
      return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
    }
    src = TV.text.normalizeOperators(src);
    let domain = o.domain || 'P';
    let m = src.match(/^\[([PFCH])\]\s*/i);
    if (m) { domain = m[1].toUpperCase(); src = src.slice(m[0].length); }
    else if ((m = src.match(/^([PFCH])\s*:\s+/i))) { domain = m[1].toUpperCase(); src = src.slice(m[0].length); }
    else if ((m = src.match(/^([PFCH])\s+/i))) { domain = m[1].toUpperCase(); src = src.slice(m[0].length); }
    let stamp = dateMod.todayStamp(now);
    const first = src.split(/\s+/)[0] || '';
    if (/^\d{6}$/.test(first) || /^\d{8}$/.test(first) || /^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(first) || /^[+-]?\d{1,3}$/.test(first)) {
      const d = dateMod.resolveDateToken(first, now);
      if (!d.ok) { invalidNote(S(raw).trim(), d.error, domain, stamp); return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors }; }
      if (d.relative) {
        invalidNote(S(raw).trim(), '源码日期必须是 YYMMDD；相对日期请用对话框录入', domain, stamp);
        return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
      }
      stamp = d.stamp;
      src = src.slice(first.length).trim();
    }
    const lt = src.indexOf('<');
    const flowPart = lt >= 0 ? src.slice(0, lt).trim() : src;
    const tagPart = lt >= 0 ? src.slice(lt + 1) : '';
    if (flowPart.indexOf('>') < 0) {
      /* 备注行：金额 < 分类 < 关键字... */
      const toks = flowPart.split(/[\s\u3000]+/).filter(Boolean);
      let amt = null;
      let i = 0;
      if (toks.length) {
        const q = amount.parseQuantity(toks[0]);
        if (q.ok) { amt = q; i = 1; }
      }
      const blocks = tagPart.split('<').map((x) => x.trim()).filter(Boolean);
      if (!blocks.length) {
        invalidNote(S(raw).trim(), '备注行格式：金额 < 分类 < 关键字', domain, stamp);
        return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
      }
      const catBlock = blocks[0].split(/[\s\u3000]+/).filter(Boolean);
      const category = catBlock[0] || '';
      const keywordNames = catBlock.slice(1);
      blocks.slice(1).forEach((b) => b.split(/[\s\u3000]+/).filter(Boolean).forEach((k) => keywordNames.push(k)));
      if (!category) {
        invalidNote(S(raw).trim(), '备注行缺分类', domain, stamp);
        return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
      }
      const categoryId = ensureNoteTag(dict, category, { domain }, autoTags, usedIds);
      const keywordIds = [];
      keywordNames.forEach((k) => {
        const id = ensureNoteTag(dict, k, { domain, parentId: categoryId }, autoTags, usedIds);
        if (id && !keywordIds.includes(id)) keywordIds.push(id);
      });
      const id = ids.newTextId((x) => usedIds.has(x)); usedIds.add(id);
      notes.push({
        id, kind: 'note', raw: S(raw).trim(), line: lineNo, domain, date: stamp,
        categoryId, keywordIds, amountCents: amt && amt.ok && amt.unit === 'money' ? amt.cents : 0,
        minutes: amt && amt.ok && amt.unit === 'time' ? amt.minutes : 0,
        tagIds: keywordIds.slice(), accounting: false,
      });
      return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
    }

    /* 含 >：按段展开 */
    let flow = flowPart.replace(/\s*>\s*/g, ' > ');
    flow = flow.replace(/([^\s])#/g, '$1 #');
    const toks = flow.split(/[\s\u3000]+/).filter(Boolean);
    const nodeToks = [];
    const amountToks = [];
    let period = '';
    for (let i = 0; i < toks.length; i += 1) {
      const t = toks[i];
      if (t === '>') continue;
      if (/^\*[dmy]$/i.test(t)) { period = t.slice(1).toLowerCase(); continue; }
      const sp = amount.splitPeriod(t);
      if (sp.period) period = sp.period;
      const q = amount.parseQuantity(sp.token);
      if (q.ok) { amountToks.push(sp.token); continue; }
      if (amountToks.length) {
        invalidNote(S(raw).trim(), '金额之后还有认不出的内容：' + t, domain, stamp);
        return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
      }
      nodeToks.push(t);
    }
    if (nodeToks.length < 2) {
      invalidNote(S(raw).trim(), '至少需要两个节点', domain, stamp);
      return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
    }
    const segments = nodeToks.length - 1;
    if (amountToks.length !== 1 && amountToks.length !== segments) {
      invalidNote(S(raw).trim(), '金额数量必须为 1 或等于段数（' + segments + '）', domain, stamp);
      return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
    }
    const resolved = nodeToks.map((t) => resolveToken(dict, t, { domain }));
    /* 行为项自动建：当一段另一端已经是行为项时，把这一端补成行为项 */
    for (let i = 0; i < segments; i += 1) {
      const a = resolved[i];
      const b = resolved[i + 1];
      if (!a || !b) continue;
      const rawAmt = amountToks.length === segments ? amountToks[i] : amountToks[0];
      if (a.ok && b.ok) {
        if (a.behavior && !b.behavior && !a.account) {
          b.behavior = ensureBehaviorItem(dict, nodeToks[i + 1], { domain }, autoBehaviors, usedIds);
        } else if (b.behavior && !a.behavior && !b.account) {
          a.behavior = ensureBehaviorItem(dict, nodeToks[i], { domain }, autoBehaviors, usedIds);
        }
      } else if (!a.ok && !b.ok && /^\d+$/.test(rawAmt || '')) {
        /* 两端都未知、强度是正整数：默认按行为项自动建，符合“行为模板优先” */
        a.behavior = ensureBehaviorItem(dict, nodeToks[i], { domain }, autoBehaviors, usedIds);
        b.behavior = ensureBehaviorItem(dict, nodeToks[i + 1], { domain }, autoBehaviors, usedIds);
        a.ok = true; a.account = null;
        b.ok = true; b.account = null;
      } else if (a.ok && a.behavior && !b.ok) {
        b.behavior = ensureBehaviorItem(dict, nodeToks[i + 1], { domain }, autoBehaviors, usedIds);
        b.ok = true;
        b.account = null;
      } else if (b.ok && b.behavior && !a.ok) {
        a.behavior = ensureBehaviorItem(dict, nodeToks[i], { domain }, autoBehaviors, usedIds);
        a.ok = true;
        a.account = null;
      }
    }
    resolved.forEach((r, i) => {
      if (!r.ok) diagnostics.push(diag(lineNo, r.error || ('无法解析：' + nodeToks[i])));
    });
    const tagIds = parseTagBlocks(tagPart, dict, { domain }, autoTags, usedIds);
    const layers = [];
    const segRi = [];
    for (let i = 0; i < segments; i += 1) {
      const a = resolved[i];
      const b = resolved[i + 1];
      if (!a || !a.ok || !b || !b.ok) { layers.push('invalid'); continue; }
      const canA = !!a.account && !!b.account;
      const canB = !!a.behavior && !!b.behavior;
      let layer = '';
      if (canA && !canB) layer = 'account';
      else if (canB && !canA) layer = 'behavior';
      else if (canA && canB) {
        if (a.force === 'N' || b.force === 'N') layer = 'account';
        else if (a.force === 'H' || b.force === 'H') layer = 'behavior';
        else {
          diagnostics.push(diag(lineNo, '同一段同时是会计和行为，请加 N: 或 H: 前缀：' + nodeToks[i] + ' > ' + nodeToks[i + 1]));
          layer = 'invalid';
        }
      } else {
        diagnostics.push(diag(lineNo, '层不匹配：' + nodeToks[i] + ' > ' + nodeToks[i + 1]));
        layer = 'invalid';
      }
      layers.push(layer);
    }
    const per = amountToks.length === segments ? amountToks : Array.from({ length: segments }, () => amountToks[0]);
    if (period && layers.some((l) => l === 'behavior')) {
      diagnostics.push(diag(lineNo, '行为段不能挂 *d/*m/*y 周期规则'));
    }
    let chainId = '';
    if (segments > 1) {
      chainId = ids.newChainId((x) => usedIds.has(x));
      usedIds.add(chainId);
    }
    for (let i = 0; i < segments; i += 1) {
      const layer = layers[i];
      const rawSeg = nodeToks[i] + ' > ' + nodeToks[i + 1] + ' ' + per[i];
      if (layer === 'account') {
        const q = amount.parseQuantity(per[i]);
        if (!q.ok) { diagnostics.push(diag(lineNo, q.error)); continue; }
        if (q.unit === 'money' && q.cents <= 0) { diagnostics.push(diag(lineNo, '金额必须大于 0')); continue; }
        const id = ids.newEventId((x) => usedIds.has(x)); usedIds.add(id);
        events.push({
          id, kind: 'account', domain, date: stamp,
          from: resolved[i].account, to: resolved[i + 1].account,
          amountCents: q.unit === 'money' ? q.cents : 0,
          minutes: q.unit === 'time' ? q.minutes : 0,
          tagIds: tagIds.slice(), chainId, sourceLine: lineNo, raw: rawSeg,
          crossDomain: !!(dict.nodes[resolved[i].account] && dict.nodes[resolved[i + 1].account]
            && dict.nodes[resolved[i].account].domain !== dict.nodes[resolved[i + 1].account].domain),
        });
      } else if (layer === 'behavior') {
        if (!/^\d+$/.test(per[i]) || Number(per[i]) <= 0) {
          diagnostics.push(diag(lineNo, '行为强度必须是正整数：' + per[i]));
          continue;
        }
        const id = ids.newBehaviorEventId((x) => usedIds.has(x)); usedIds.add(id);
        behaviors.push({
          id, kind: 'behavior', domain, date: stamp,
          from: resolved[i].behavior, to: resolved[i + 1].behavior,
          weight: Number(per[i]), tagIds: tagIds.slice(), chainId,
          sourceLine: lineNo, raw: rawSeg,
        });
      } else {
        const id = ids.newTextId((x) => usedIds.has(x)); usedIds.add(id);
        notes.push({
          id, kind: 'invalid', raw: rawSeg, line: lineNo, domain, date: stamp,
          accounting: false, tagIds: tagIds.slice(),
          draft: { from: nodeToks[i], to: nodeToks[i + 1], amount: per[i] },
          diagnostics: [diag(lineNo, '该段未编译')],
        });
      }
    }
    return { events, behaviors, notes, diagnostics, autoTags, autoBehaviors };
  }

  function compileLedgerSource(text, dict, opts) {
    const o = opts || {};
    const now = o.now instanceof Date ? o.now : new Date();
    const diagnostics = [];
    const events = [];
    const behaviors = [];
    const notes = [];
    const autoTags = [];
    const autoBehaviors = [];
    const work = JSON.parse(JSON.stringify(dict || {}));
    if (!work.behaviors) work.behaviors = {};
    const usedIds = new Set(Object.keys(work.nodes || {}).concat(Object.keys(work.tags || {}), Object.keys(work.behaviors || {})));
    const lines = S(text).replace(/\r\n?/g, '\n').split('\n');
    lines.forEach((raw, idx) => {
      const lineNo = idx + 1;
      const line = S(raw).trim();
      if (!line) return;
      if (/^\[(PLAN|RULES?)\]$/i.test(line)) {
        diagnostics.push(diag(lineNo, 'PLAN/RULES 暂由规则面板管理', 'warning'));
        return;
      }
      const r = parseLedgerLine(raw, work, { now, domain: o.domain || 'P' }, { lineNo, usedIds });
      r.events.forEach((e) => events.push(e));
      r.behaviors.forEach((b) => behaviors.push(b));
      r.notes.forEach((n) => notes.push(n));
      r.diagnostics.forEach((d) => diagnostics.push(d));
      r.autoTags.forEach((t) => { if (!autoTags.some((x) => x.id === t.id)) autoTags.push(t); });
      (r.autoBehaviors || []).forEach((t) => { if (!autoBehaviors.some((x) => x.id === t.id)) autoBehaviors.push(t); });
    });
    const errors = diagnostics.filter((x) => x.severity === 'error').length;
    return { ok: errors === 0, dict: work, events, behaviors, notes, autoTags, autoBehaviors, diagnostics, errors, lines: lines.length };
  }

  function compileAll(dictSource, ledgerSource, opts) {
    const o = opts || {};
    const d = compileDictSource(dictSource, o);
    const l = compileLedgerSource(ledgerSource, d.dict, o);
    return {
      ok: d.ok && l.ok,
      dict: l.dict || d.dict,
      events: l.events,
      behaviors: l.behaviors,
      notes: l.notes,
      autoTags: l.autoTags,
      autoBehaviors: l.autoBehaviors,
      diagnostics: d.diagnostics.concat(l.diagnostics),
      dictDiagnostics: d.diagnostics,
      ledgerDiagnostics: l.diagnostics,
      errors: d.errors + l.errors,
    };
  }

  /** 单 TXT 导出格式：## 统计 / ## 流水 / ## 行为 / ## 备注 / ## 字典 */
  function parseSingleTxt(text) {
    const lines = S(text).replace(/\r\n?/g, '\n').split('\n');
    const sec = { flow: [], behavior: [], notes: [], dict: [] };
    let cur = '';
    let sawDict = false;
    let sawFlow = false;
    lines.forEach((line) => {
      const m = line.match(/^##\s*(统计|流水|行为|备注|字典)\s*$/);
      if (m) {
        cur = m[1];
        if (cur === '字典') sawDict = true;
        if (cur === '流水') sawFlow = true;
        return;
      }
      if (cur === '流水') sec.flow.push(line);
      else if (cur === '行为') sec.behavior.push(line);
      else if (cur === '备注') sec.notes.push(line);
      else if (cur === '字典') sec.dict.push(line);
    });
    if (!sawDict) return { ok: false, error: '单 TXT 缺 ## 字典 段' };
    if (!sawFlow) return { ok: false, error: '单 TXT 缺 ## 流水 段' };
    const dictSource = sec.dict.join('\n').trim() + '\n';
    const ledgerSource = [sec.flow.join('\n'), sec.behavior.join('\n'), sec.notes.join('\n')]
      .map((x) => x.trim()).filter(Boolean).join('\n') + '\n';
    return { ok: true, dictSource, ledgerSource };
  }

  TV.source = {
    TAG_KINDS,
    formatYuanExact,
    sourceCodeMap,
    dictToSource,
    ledgerToSource,
    normalizeDomainSyntax,
    compileDictSource,
    compileLedgerSource,
    compileAll,
    parseSingleTxt,
    parseLedgerLine,
    stripComment,
    parseNames,
    parseTail,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.source;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/core/calc.js */
/* TxtVein · 计算层
 * 唯一核心算式（双极相对论）：
 *   A 极：转入增加，转出减少
 *   B 极：转出增加，转入减少
 * 只要一笔 Event 两端都在，系统天然平账——这里不做「借贷校验」。
 *
 * 所有报表、窗格、余额都是本模块的派生结果，不落盘。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);

  function emptyStat(node) {
    return {
      id: node.id,
      node,
      opening: 0,
      inc: 0,
      dec: 0,
      closing: 0,
      count: 0,
      grossIn: 0,
      grossOut: 0,
      firstDate: '',
      lastDate: '',
      minutes: 0,
    };
  }

  function addToStat(stat, node, role, cents, openingOnly) {
    if (openingOnly) {
      if (role === 'from') {
        if (node.polarity === 'A') stat.opening -= cents;
        else stat.opening += cents;
      } else {
        if (node.polarity === 'A') stat.opening += cents;
        else stat.opening -= cents;
      }
      return;
    }
    if (role === 'from') {
      if (node.polarity === 'A') {
        stat.dec += cents;
        stat.closing -= cents;
      } else {
        stat.inc += cents;
        stat.closing += cents;
      }
      stat.grossOut += cents;
    } else {
      if (node.polarity === 'A') {
        stat.inc += cents;
        stat.closing += cents;
      } else {
        stat.dec += cents;
        stat.closing -= cents;
      }
      stat.grossIn += cents;
    }
  }

  /**
   * 规范文档里的 processTransfer：原地改两个节点的 balance。
   * 计算层内部用 addToStat，但保留这个函数作为「唯一算式」的可读锚点。
   */
  function processTransfer(fromNode, toNode, amountCents) {
    const a = Math.round(Number(amountCents) || 0);
    if (fromNode.polarity === 'A') fromNode.balance = (Number(fromNode.balance) || 0) - a;
    else fromNode.balance = (Number(fromNode.balance) || 0) + a;
    if (toNode.polarity === 'A') toNode.balance = (Number(toNode.balance) || 0) + a;
    else toNode.balance = (Number(toNode.balance) || 0) - a;
    return { fromNode, toNode };
  }

  function normalizeRange(range) {
    if (!range) return { start: '000000', end: '999999', label: '全期', all: true };
    if (range.start && range.end) return Object.assign({ all: false }, range);
    return { start: '000000', end: '999999', label: '全期', all: true };
  }

  function compute(dict, events, opts) {
    const o = opts || {};
    const range = normalizeRange(o.range);
    const rowsAll = [];
    const stats = new Map();
    Object.keys(dict.nodes || {}).forEach((id) => {
      const node = Object.assign({ id }, dict.nodes[id]);
      const st = emptyStat(node);
      stats.set(id, st);
      rowsAll.push(st);
    });

    const sorted = (events || [])
      .map((e, i) => ({ e, i }))
      .sort((a, b) => S(a.e.date).localeCompare(S(b.e.date)) || a.i - b.i);

    const issues = [];
    const tagStats = new Map();
    const domainStats = new Map();
    const timeByNode = new Map();
    const chainMap = new Map();
    let flowCents = 0;
    let crossDomainCents = 0;
    let crossNetDelta = 0;
    const filterDomain = o.domain || '';
    let unbalanced = 0;
    let rangeCount = 0;
    let timeMinutes = 0;
    let unlabeledOutflow = 0;
    let gainCents = 0;
    let suppressCents = 0;

    const domainEntry = (d) => {
      if (!domainStats.has(d)) {
        domainStats.set(d, {
          domain: d, flowCents: 0, count: 0,
          inCents: 0, outCents: 0, bookedCents: 0, crossCents: 0,
        });
      }
      return domainStats.get(d);
    };

    for (const item of sorted) {
      const e = item.e || {};
      if (e.kind === 'behavior') continue; /* 行为边只进行为统计，不进 A/B */
      const from = dict.nodes[e.from];
      const to = dict.nodes[e.to];
      if (!from || !to) {
        unbalanced += 1;
        issues.push({ code: 'UNBOUND_EVENT', message: '流水引用了不存在的节点', event: e });
        continue;
      }
      const cents = Math.round(Number(e.amountCents) || 0);
      const minutes = Math.round(Number(e.minutes) || 0);
      if (cents < 0 || (cents === 0 && !minutes)) {
        unbalanced += 1;
        issues.push({ code: 'BAD_AMOUNT', message: '金额必须大于 0', event: e });
        continue;
      }
      const inRange = S(e.date) >= range.start && S(e.date) <= range.end;
      const isOpening = S(e.date) < range.start;

      /* 时间代币只进时间统计，不碰金额余额 */
      if (minutes > 0) {
        if (inRange) {
          timeMinutes += minutes;
          timeByNode.set(e.to, (timeByNode.get(e.to) || 0) + minutes);
          if (e.from) timeByNode.set(e.from, (timeByNode.get(e.from) || 0) + minutes);
          const stTo = stats.get(e.to);
          if (stTo) stTo.minutes += minutes;
        }
        continue;
      }

      const sf = stats.get(e.from);
      const st = stats.get(e.to);
      if (!sf || !st) { unbalanced += 1; continue; }

      if (isOpening) {
        addToStat(sf, from, 'from', cents, true);
        addToStat(st, to, 'to', cents, true);
        continue;
      }
      if (!inRange) continue;

      rangeCount += 1;
      flowCents += cents;
      addToStat(sf, from, 'from', cents, false);
      addToStat(st, to, 'to', cents, false);
      sf.count += 1;
      st.count += 1;
      sf.firstDate = sf.firstDate || e.date;
      st.firstDate = st.firstDate || e.date;
      sf.lastDate = e.date;
      st.lastDate = e.date;

      const isSystem = !!(e.system || from.system || to.system);
      const cross = from.domain !== to.domain && !isSystem;
      if (cross) {
        crossDomainCents += cents;
        /* 独立域视角：跨域那一端对 A−B 的影响要单独记，报表才能显示
           「域内净额」（把对外投资/划拨加回），而不是看起来凭空少了 1000。 */
        if (filterDomain) {
          if (from.domain === filterDomain) crossNetDelta += from.polarity === 'A' ? -cents : cents;
          if (to.domain === filterDomain) crossNetDelta += to.polarity === 'A' ? cents : -cents;
        }
      }
      const ds = domainEntry(e.domain || 'P');
      ds.flowCents += cents;
      ds.count += 1;
      ds.bookedCents += cents;
      if (cross) ds.crossCents += cents;
      const dOut = domainEntry(from.domain);
      const dIn = domainEntry(to.domain);
      dOut.outCents += cents;
      dIn.inCents += cents;

      const tags = Array.isArray(e.tagIds) ? e.tagIds : [];
      if (!isSystem) tags.forEach((tid) => {
        const tag = dict.tags[tid];
        if (!tag) return;
        if (!tagStats.has(tid)) tagStats.set(tid, { id: tid, tag, amountCents: 0, count: 0, minutes: 0 });
        const ts = tagStats.get(tid);
        ts.amountCents += cents;
        ts.count += 1;
        if (tag.kind === 'gain') gainCents += cents;
        if (tag.kind === 'suppress') suppressCents += cents;
      });
      if (!tags.length && from.polarity === 'A' && !isSystem) unlabeledOutflow += cents;

      if (e.chainId) {
        if (!chainMap.has(e.chainId)) chainMap.set(e.chainId, { id: e.chainId, events: [], totalCents: 0 });
        const ch = chainMap.get(e.chainId);
        ch.events.push(e);
        ch.totalCents += cents;
      }
    }

    /* 期末 = 期初 + 本期增加 − 本期减少。opening 已在处理区间前流水时累好。 */
    const rows = [];
    rowsAll.forEach((st) => {
      st.closing = st.opening + st.inc - st.dec;
      rows.push(st);
    });

    const domain = o.domain || '';
    const visible = domain ? rows.filter((r) => r.node.domain === domain) : rows;
    const totals = {
      A: { opening: 0, inc: 0, dec: 0, closing: 0, count: 0, nodes: 0, grossIn: 0, grossOut: 0 },
      B: { opening: 0, inc: 0, dec: 0, closing: 0, count: 0, nodes: 0, grossIn: 0, grossOut: 0 },
    };
    visible.forEach((r) => {
      const t = totals[r.node.polarity] || totals.A;
      t.opening += r.opening;
      t.inc += r.inc;
      t.dec += r.dec;
      t.closing += r.closing;
      t.count += r.count;
      t.nodes += 1;
      t.grossIn += r.grossIn;
      t.grossOut += r.grossOut;
    });

    const openingNet = totals.A.opening - totals.B.opening;
    const closingNet = totals.A.closing - totals.B.closing;

    /* 全局 A−B（不按域裁剪）用于验证双极守恒 */
    const globalTotals = {
      A: { opening: 0, inc: 0, dec: 0, closing: 0 },
      B: { opening: 0, inc: 0, dec: 0, closing: 0 },
    };
    rows.forEach((r) => {
      const t = globalTotals[r.node.polarity] || globalTotals.A;
      t.opening += r.opening;
      t.inc += r.inc;
      t.dec += r.dec;
      t.closing += r.closing;
    });
    const globalOpeningNet = globalTotals.A.opening - globalTotals.B.opening;
    const globalClosingNet = globalTotals.A.closing - globalTotals.B.closing;

    const tagRows = Array.from(tagStats.values()).sort((a, b) => b.amountCents - a.amountCents);
    const domainRows = Array.from(domainStats.values())
      .sort((a, b) => (dictMod ? dictMod.DOMAIN_ORDER.indexOf(a.domain) - dictMod.DOMAIN_ORDER.indexOf(b.domain) : 0));

    const chains = Array.from(chainMap.values()).map((ch) => {
      ch.events.sort((a, b) => S(a.date).localeCompare(S(b.date)));
      ch.nodes = [];
      ch.events.forEach((e) => {
        if (!ch.nodes.includes(e.from)) ch.nodes.push(e.from);
        if (!ch.nodes.includes(e.to)) ch.nodes.push(e.to);
      });
      return ch;
    });

    return {
      range,
      events: (events || []).slice(),
      rows: visible,
      allRows: rows,
      byId: new Map(rows.map((r) => [r.id, r])),
      totals,
      globalTotals,
      openingNet,
      closingNet,
      netWorth: closingNet,
      adjustedNet: closingNet - crossNetDelta,
      crossNetDelta,
      invariant: closingNet === openingNet,
      globalOpeningNet,
      globalClosingNet,
      globalInvariant: globalClosingNet === globalOpeningNet,
      balanced: globalClosingNet === globalOpeningNet && unbalanced === 0,
      flowCents,
      crossDomainCents,
      externalCents: flowCents - crossDomainCents,
      rangeCount,
      unbalanced,
      issues,
      tagRows,
      domains: domainRows,
      timeMinutes,
      timeByNode: Array.from(timeByNode.entries()).map(([id, m]) => ({ id, node: dict.nodes[id], minutes: m })),
      chains,
      unlabeledOutflow,
      gainCents,
      suppressCents,
      nodeCount: visible.length,
    };
  }

  /** 单节点余额（不传 range 就是全期）。 */
  function calcBalance(dict, events, nodeId, range) {
    const r = compute(dict, events, { range: range || null });
    const row = r.byId.get(nodeId);
    return row ? row.closing : 0;
  }

  /** 全局重算：id → 余额。 */
  function recalculateAllBalances(dict, events) {
    const out = {};
    const r = compute(dict, events, {});
    r.allRows.forEach((row) => { out[row.id] = row.closing; });
    return out;
  }

  /** 单笔双端守恒：两端金额相等、节点存在、金额正整数或时间。 */
  function checkEvent(dict, event) {
    const from = dict.nodes[event.from];
    const to = dict.nodes[event.to];
    if (!from || !to) return { ok: false, error: '节点未绑定' };
    if (!(Number(event.amountCents) > 0) && !(Number(event.minutes) > 0)) {
      return { ok: false, error: '金额/时间必须大于 0' };
    }
    return { ok: true };
  }

  TV.calc = {
    processTransfer,
    compute,
    calcBalance,
    recalculateAllBalances,
    checkEvent,
    emptyStat,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.calc;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* js/core/domain.js */
/* TxtVein · 多域层
 * 域只是账本的「圈层」标签，不是另一套账：
 *   节点有 domain；流水行有 domain（记在哪个圈层）。
 * 跨域转移必须显式写前缀（P: / C: / …），解析层已在绑定阶段拦截。
 * 报表：独立视角只看本域节点；合并视角把跨域内部划拨单独列出并抵消。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);

  const ORDER = ['P', 'F', 'C', 'H'];

  function order(domain) {
    const i = ORDER.indexOf(S(domain).toUpperCase());
    return i < 0 ? 99 : i;
  }

  function label(domain, lang) {
    return dictMod ? dictMod.domainLabel(domain, lang) : S(domain);
  }

  function isCross(event, dict) {
    const from = dict && dict.nodes[event.from];
    const to = dict && dict.nodes[event.to];
    if (!from || !to) return false;
    return from.domain !== to.domain;
  }

  function filterEvents(events, domain) {
    if (!domain) return (events || []).slice();
    return (events || []).filter((e) => e.domain === domain);
  }

  function crossEvents(events, dict) {
    return (events || []).filter((e) => isCross(e, dict));
  }

  function groupByDomain(events) {
    const map = new Map();
    (events || []).forEach((e) => {
      const d = e.domain || 'P';
      if (!map.has(d)) map.set(d, []);
      map.get(d).push(e);
    });
    return ORDER.filter((d) => map.has(d)).map((d) => ({ domain: d, events: map.get(d) }));
  }

  /**
   * 合并视角：
   * internal = 跨域流水金额（家族/集团内部的划拨）
   * external = 全部流水 − internal（真正流出总盘子的部分）
   * 注意这里是「流量口径」，不是余额口径。
   */
  function consolidate(calcResult, dict) {
    const events = calcResult && calcResult.events ? calcResult.events : [];
    let internal = 0;
    let count = 0;
    events.forEach((e) => {
      if (isCross(e, dict)) {
        internal += Math.round(Number(e.amountCents) || 0);
        count += 1;
      }
    });
    const flow = Number(calcResult && calcResult.flowCents) || 0;
    return {
      internalCents: internal,
      externalCents: flow - internal,
      crossCount: count,
      flowCents: flow,
      offsetApplied: internal > 0,
    };
  }

  /** 域切换器需要的计数。 */
  function counts(dict, events) {
    const out = {};
    ORDER.forEach((d) => { out[d] = { nodes: 0, events: 0 }; });
    Object.keys((dict && dict.nodes) || {}).forEach((id) => {
      const n = dict.nodes[id];
      if (out[n.domain]) out[n.domain].nodes += 1;
    });
    (events || []).forEach((e) => {
      const d = e.domain || 'P';
      if (out[d]) out[d].events += 1;
    });
    return out;
  }

  /**
   * 明确接口节点：同一域对之间，若确实需要镜像挂账，用这个固定 ID 家族。
   * MVP 不自动双记（否则同一笔钱会被算两次）；报表按跨域边界抵消。
   * 这个函数保留给后续「必须镜像」的场景，ID 规则固定、可审计。
   */
  function interfaceId(fromDomain, toDomain) {
    return 'N_iface_' + S(fromDomain).toUpperCase() + '_' + S(toDomain).toUpperCase();
  }

  function findInterfaceNodes(dict, fromDomain, toDomain) {
    const id = interfaceId(fromDomain, toDomain);
    return Object.keys((dict && dict.nodes) || {})
      .filter((k) => k === id || (dict.nodes[k].interface
        && dict.nodes[k].domain === toDomain
        && dict.nodes[k].peer_domain === fromDomain));
  }

  TV.domain = {
    ORDER,
    order,
    label,
    isCross,
    filterEvents,
    crossEvents,
    groupByDomain,
    consolidate,
    counts,
    interfaceId,
    findInterfaceNodes,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.domain;
})(typeof globalThis !== 'undefined' ? globalThis : this);
