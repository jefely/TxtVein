<script>
/* js/ui/panes.js */
/* TxtVein · 宽屏多窗格（虚拟滚动）
 * 四个派生窗格：全局时间流 / A 极资产池 / B 极外部池 / 费用蒸汽池。
 * 全部从 Event + Dict 现算，不私存任何业务数据。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const { el, clear } = TV.dom;
  const amount = TV.amount;
  const dictMod = TV.dict;

  const ROW = 33;
  const OVERSCAN = 8;

  const DEFS = [
    { key: 'time', title: '全局时间流', sub: 'EVENTS', kind: 'events' },
    { key: 'asset', title: 'A 极 · 资产池', sub: 'ASSET / COST', kind: 'nodes' },
    { key: 'external', title: 'B 极 · 外部池', sub: 'LIABILITY / INCOME / EQUITY', kind: 'nodes' },
    { key: 'expense', title: '费用 · 蒸汽', sub: 'EXPENSE', kind: 'nodes' },
  ];

  function fmtDate(stamp) {
    const s = String(stamp || '');
    return /^\d{6}$/.test(s) ? s.slice(2, 4) + '-' + s.slice(4, 6) : s;
  }

  function create(host, handlers) {
    const h = handlers || {};
    const state = {
      model: null,
      panes: {},
    };

    clear(host);
    DEFS.forEach((def) => {
      const count = el('span', { class: 'pane-count' });
      const filter = el('button', { class: 'pane-filter', hidden: true });
      const title = el('div', { class: 'pane-title' });
      const head = el('header', { class: 'pane-head' }, [title, filter, count]);
      const canvas = el('div', { class: 'pane-canvas' });
      const empty = el('div', { class: 'pane-empty', text: '暂无数据' });
      const scroll = el('div', { class: 'pane-scroll', 'data-pane': def.key }, [canvas, empty]);
      const pane = el('article', { class: 'pane', 'data-pane': def.key }, [head, scroll]);
      host.appendChild(pane);
      const p = { def, pane, head, title, count, filter, canvas, empty, scroll, items: [], top: 0, raf: 0 };
      state.panes[def.key] = p;

      scroll.addEventListener('scroll', () => {
        p.top = scroll.scrollTop;
        if (p.raf) return;
        p.raf = requestAnimationFrame(() => {
          p.raf = 0;
          paint(p);
        });
      }, { passive: true });

      canvas.addEventListener('click', (ev) => {
        const row = ev.target.closest('.row');
        if (!row) return;
        const idx = Number(row.dataset.index);
        if (def.kind === 'events') {
          if (h.onSelectEvent) h.onSelectEvent(Number(row.dataset.ev));
        } else if (h.onSelectNode) {
          h.onSelectNode(row.dataset.id);
        }
      });
      canvas.addEventListener('dblclick', (ev) => {
        const row = ev.target.closest('.row');
        if (!row) return;
        if (def.kind === 'events' && h.onEditEvent) h.onEditEvent(Number(row.dataset.ev));
        if (def.kind === 'nodes' && h.onSelectNode) h.onSelectNode(row.dataset.id);
      });
      filter.addEventListener('click', () => h.onFilterNode && h.onFilterNode(''));
    });

    function paint(p) {
      if (!p.items.length) {
        clear(p.canvas);
        p.canvas.style.height = '100%';
        p.empty.hidden = false;
        return;
      }
      p.empty.hidden = true;
      const total = p.items.length * ROW;
      p.canvas.style.height = total + 'px';
      const viewH = p.scroll.clientHeight || 400;
      const start = Math.max(0, Math.floor(p.top / ROW) - OVERSCAN);
      const end = Math.min(p.items.length, Math.ceil((p.top + viewH) / ROW) + OVERSCAN);
      clear(p.canvas);
      const frag = document.createDocumentFragment();
      for (let i = start; i < end; i += 1) {
        const row = p.def.kind === 'events' ? eventRow(p.items[i], i) : nodeRow(p.items[i], i);
        row.style.top = i * ROW + 'px';
        frag.appendChild(row);
      }
      p.canvas.appendChild(frag);
    }

    function tagText(tagIds) {
      const m = state.model;
      return (tagIds || [])
        .map((id) => dictMod.renderTag(m.dict, id, m.mode, m.lang))
        .filter(Boolean)
        .map((x) => '#' + x)
        .join(' ');
    }

    function eventRow(item, i) {
      const m = state.model;
      const e = item.event;
      const from = dictMod.renderNode(m.dict, e.from, m.mode, m.lang);
      const to = dictMod.renderNode(m.dict, e.to, m.mode, m.lang);
      const fromNode = m.dict.nodes[e.from];
      const toNode = m.dict.nodes[e.to];
      const tags = tagText(e.tagIds);
      const amt = e.minutes > 0 ? amount.formatTime(e.minutes) : amount.centsToDisplay(e.amountCents);
      const row = el('div', {
        class: 'row row-event' + (item.selected ? ' is-selected' : '') + (item.linked ? ' is-linked' : ''),
        dataset: { index: i, ev: item.index, kind: 'event' },
        title: (e.date || '') + '  ' + from + ' → ' + to + '  ' + amount.formatPlain(e.amountCents),
      }, [
        el('span', { class: 'date' }, [fmtDate(e.date)]),
        el('span', { class: 'flow' }, [
          el('span', { class: 'node ' + (fromNode && fromNode.polarity === 'B' ? 'is-b' : 'is-a') }, [from]),
          el('span', { class: 'op' }, ['>']),
          el('span', { class: 'node ' + (toNode && toNode.polarity === 'B' ? 'is-b' : 'is-a') }, [to]),
          tags ? el('span', { class: 'tags', text: tags }) : null,
        ]),
        el('span', { class: 'amt' + (e.minutes > 0 ? ' is-time' : '') }, [amt]),
      ]);
      if (e.minutes > 0) row.classList.add('is-time-row');
      return row;
    }

    function nodeRow(item, i) {
      const m = state.model;
      const n = item.node;
      const name = dictMod.renderNode(m.dict, item.id, m.mode, m.lang);
      const pole = n.polarity === 'B' ? 'is-b' : 'is-a';
      const form = n.type === '成本' ? '冰块' : n.type === '费用' ? '蒸汽' : n.type === '资产' ? '流体' : '';
      return el('div', {
        class: 'row row-node' + (item.selected ? ' is-selected' : '') + (item.linked ? ' is-linked' : ''),
        dataset: { index: i, id: item.id, kind: 'node' },
        title: dictMod.pathLabel(m.dict, item.id, m.lang),
      }, [
        el('span', { class: 'node-main' }, [
          el('span', { class: 'name ' + pole }, [name]),
          form ? el('span', { class: 'form' }, [form]) : null,
        ]),
        el('span', { class: 'node-count' }, [item.count ? item.count + ' 笔' : '—']),
        el('span', { class: 'node-balance' + (item.value < 0 ? ' is-neg' : '') }, [
          amount.centsToDisplay(item.value),
        ]),
      ]);
    }

    function titleFor(def, model) {
      const parts = [];
      if (def.key === 'time') {
        parts.push(el('b', {}, ['全局']), document.createTextNode(' 时间流'));
        parts.push(el('span', { class: 'dim' }, ['  // EVENTS']));
        return parts;
      }
      if (def.key === 'asset') {
        parts.push(el('span', { class: 'a' }, ['A 极']), document.createTextNode(' · 资产池'));
        parts.push(el('span', { class: 'dim' }, ['  // ASSET + COST']));
        return parts;
      }
      if (def.key === 'external') {
        parts.push(el('span', { class: 'b' }, ['B 极']), document.createTextNode(' · 外部池'));
        parts.push(el('span', { class: 'dim' }, ['  // LIABILITY + INCOME + EQUITY']));
        return parts;
      }
      parts.push(document.createTextNode('费用'), el('span', { class: 'dim' }, [' · 蒸汽  // EXPENSE']));
      return parts;
    }

    function buildModel(model) {
      const m = model;
      const selectedEvent = m.selectedEventIndex;
      const selectedNode = m.selectedNodeId;
      const linked = m.linkedNodeIds || new Set();
      const eventFilter = m.filterNodeId
        ? (e) => e.from === m.filterNodeId || e.to === m.filterNodeId
        : () => true;

      const timeItems = m.events
        .map((e, i) => ({ event: e, index: i }))
        .filter((x) => eventFilter(x.event))
        .filter((x) => !m.domain || x.event.domain === m.domain)
        .sort((a, b) => String(b.event.date).localeCompare(String(a.event.date)) || b.index - a.index)
        .map((x) => ({
          event: x.event,
          index: x.index,
          selected: x.index === selectedEvent,
          linked: linked.has(x.event.from) || linked.has(x.event.to),
        }));

      const nodeItems = (types) => {
        const rows = (m.calcAll ? m.calcAll.rows : [])
          .filter((r) => types.includes(r.node.type))
          .filter((r) => !m.domain || r.node.domain === m.domain)
          .filter((r) => !r.node.system || r.count > 0)
          .map((r) => ({
            id: r.id,
            node: r.node,
            value: types[0] === '费用' ? r.inc : r.closing,
            count: r.count,
            selected: r.id === selectedNode,
            linked: linked.has(r.id),
          }))
          .sort((a, b) => Math.abs(b.value) - Math.abs(a.value) || b.count - a.count);
        return rows;
      };

      return {
        time: timeItems,
        asset: nodeItems(['资产', '成本']),
        external: nodeItems(['负债', '收入', '权益']),
        expense: nodeItems(['费用']),
      };
    }

    function render(model) {
      state.model = model;
      const data = buildModel(model);
      DEFS.forEach((def) => {
        const p = state.panes[def.key];
        const items = data[def.key] || [];
        p.items = items;
        clear(p.title);
        titleFor(def, model).forEach((x) => p.title.appendChild(x));
        p.count.textContent = items.length + (def.kind === 'events' ? ' 笔' : ' 项');
        const filterId = model.filterNodeId;
        if (def.key === 'time' && filterId) {
          p.filter.hidden = false;
          p.filter.textContent = '节点: ' + dictMod.renderNode(model.dict, filterId, model.mode, model.lang) + ' ×';
        } else {
          p.filter.hidden = true;
        }
        p.canvas.style.height = (items.length * ROW) + 'px';
        paint(p);
      });
    }

    function scrollTimeToTop() {
      const p = state.panes.time;
      if (p) p.scroll.scrollTop = 0;
    }

    function scrollTimeToEvent(index) {
      const p = state.panes.time;
      if (!p) return;
      const i = p.items.findIndex((x) => x.index === index);
      if (i < 0) return;
      const target = Math.max(0, i * ROW - p.scroll.clientHeight / 3);
      p.scroll.scrollTop = target;
    }

    function flash(index) {
      const p = state.panes.time;
      if (!p) return;
      const i = p.items.findIndex((x) => x.index === index);
      if (i < 0) return;
      scrollTimeToEvent(index);
      requestAnimationFrame(() => {
        const row = p.canvas.querySelector('.row[data-ev="' + index + '"]');
        if (row) {
          row.classList.add('is-flash');
          setTimeout(() => row.classList.remove('is-flash'), 800);
        }
      });
    }

    return { render, scrollTimeToTop, scrollTimeToEvent, flash };
  }

  TV.panes = { create, ROW };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/ui/report-view.js */
/* TxtVein · 报表视图
 * 双极四列、能量审计、时间代币、链式因果、多域合并。
 * 所有数字来自 report.buildReport；这里只负责 DOM。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const { el, clear } = TV.dom;
  const amount = TV.amount;

  function create(host, handlers) {
    const h = handlers || {};
    let model = null;
    let report = null;
    let customRange = '';

    function render(nextReport, nextModel) {
      report = nextReport;
      model = nextModel || model;
      if (!report || !report.ok) return;
      clear(host);
      const inner = el('div', { class: 'report-inner' });
      inner.appendChild(head());
      inner.appendChild(kpi());
      inner.appendChild(typeGrid());
      inner.appendChild(sideGrid());
      inner.appendChild(chainCard());
      inner.appendChild(domainCard());
      if (report.issues && report.issues.length) inner.appendChild(issuesCard());
      host.appendChild(inner);
    }

    function head() {
      const chips = el('div', { class: 'range-bar' });
      ['本月', '上月', '今年', '全部'].forEach((label) => {
        const b = el('button', {
          class: 'range-chip' + (report.rangeLabel.startsWith(label) || (label === '全部' && report.rangeLabel === '全期') ? ' is-active' : ''),
          type: 'button',
        }, [label]);
        b.addEventListener('click', () => { customRange = ''; h.onRange && h.onRange(label); });
        chips.appendChild(b);
      });
      const input = el('input', {
        class: 'range-input', type: 'text', placeholder: '261101~261130',
        value: customRange || '',
      });
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          customRange = input.value.trim();
          if (customRange) h.onRange && h.onRange(customRange);
        }
        if (ev.key === 'Escape') { input.value = ''; input.blur(); }
      });
      chips.appendChild(input);
      return el('header', { class: 'report-head' }, [
        el('div', {}, [
          el('div', { class: 'report-title' }, [
            (model && model.lang === 'en' ? 'STATS ' : '统计 '), el('span', {}, ['// 双极 · 四列 · 派生视图']),
          ]),
          el('div', { class: 'report-sub' }, [
            report.rangeLabel + ' · ' + report.headline.rangeCount + ' 笔 · '
              + report.headline.nodeCount + ' 个节点',
          ]),
        ]),
        chips,
      ]);
    }

    function kpi() {
      const hd = report.headline;
      const inv = hd.invariant;
      const netNote = report.domain
        ? '域内净额 · 跨域调整 ' + amount.formatPlain(Math.abs(hd.crossNetDelta || 0))
        : '净额（期初差恒定）';
      return el('div', { class: 'kpi-row' }, [
        kpiCell('A 极余额', amount.formatPlain(hd.aBalance), 'a', report.domain ? '本域 · 资产/费用/成本' : '资产 / 费用 / 成本'),
        kpiCell('B 极余额', amount.formatPlain(hd.bBalance), 'b', report.domain ? '本域 · 负债/收入/权益' : '负债 / 收入 / 权益'),
        kpiCell('A − B', amount.formatPlain(hd.netWorth), '', netNote),
        kpiCell('本期流水', amount.formatPlain(hd.flowCents), '', hd.rangeCount + ' 笔'),
        kpiCell('跨域划拨', amount.formatPlain(hd.crossDomainCents), '', '合并时抵消'),
        kpiCell('双极守恒', inv ? 'OK' : 'BROKEN', inv ? 'ok' : 'bad', inv ? 'A − B 未变' : '检查未绑定节点'),
      ]);
    }

    function kpiCell(label, value, cls, note) {
      return el('div', { class: 'kpi' }, [
        el('div', { class: 'kpi-label' }, [label]),
        el('div', { class: 'kpi-value ' + (cls || '') }, [value]),
        el('div', { class: 'kpi-note' }, [note || '']),
      ]);
    }

    function typeGrid() {
      const grid = el('div', { class: 'report-grid' });
      report.types.forEach((t) => grid.appendChild(typeCard(t)));
      return grid;
    }

    const TYPE_COLS = {
      收入: [['期初累计', 'opening'], ['本期收入', 'inc'], ['本期退回', 'dec'], ['期末累计', 'closing']],
      负债: [['期初余额', 'opening'], ['本期新增', 'inc'], ['本期偿还', 'dec'], ['期末余额', 'closing']],
      权益: [['期初余额', 'opening'], ['本期增加', 'inc'], ['本期减少', 'dec'], ['期末余额', 'closing']],
      资产: [['期初余额', 'opening'], ['本期流入', 'inc'], ['本期流出', 'dec'], ['期末余额', 'closing']],
      费用: [['本期累计', 'closing'], ['本期支出', 'inc'], ['本期退回', 'dec'], ['本期净出', 'net']],
      成本: [['期初净值', 'opening'], ['本期新增', 'inc'], ['本期消耗', 'dec'], ['期末净值', 'closing']],
    };

    function typeValue(row, key) {
      if (key === 'net') return (Number(row.closing) || 0) - (Number(row.opening) || 0);
      return Number(row[key]) || 0;
    }

    function typeCard(t) {
      const card = el('section', { class: 'report-card', dataset: { type: t.type } });
      const cols = TYPE_COLS[t.type] || TYPE_COLS.资产;
      const head = el('div', { class: 'card-head' }, [
        el('h3', {}, [t.type]),
        el('span', { class: 'pole ' + (t.pole === 'A' ? 'a' : 'b') }, [t.pole + ' 极']),
        el('span', { class: 'hint' }, [t.hint]),
        el('span', { class: 'total' }, [amount.formatPlain(t.totals.closing)]),
      ]);
      card.appendChild(head);
      if (!t.rows.length) {
        card.appendChild(el('div', { class: 'rtable-empty' }, ['（本期无记录）']));
        return card;
      }
      const table = el('div', { class: 'rtable' }, [
        el('div', { class: 'rtable-row is-head' }, [
          el('span', {}, ['分类']),
          ...cols.map((c) => el('span', { class: 'rtable-num' }, [c[0]])),
        ]),
      ]);
      t.rows.forEach((r) => {
        const code = model && model.mode === 'CODE' ? r.code : '';
        const nameEl = el('span', { class: 'rtable-name' }, [
          code ? code : r.name,
          code ? el('span', { class: 'code' }, [r.name]) : null,
          r.system ? el('span', { class: 'sys' }, ['SYS']) : null,
        ]);
        const row = el('div', { class: 'rtable-row', dataset: { id: r.id } }, [
          nameEl,
          ...cols.map((c) => {
            const v = typeValue(r, c[1]);
            return el('span', { class: 'rtable-num' + (v < 0 ? ' is-neg' : '') + (c[1] === 'net' ? ' is-sub' : '') }, [
              amount.formatPlain(v),
            ]);
          }),
        ]);
        row.style.cursor = 'pointer';
        row.title = '在查询页中筛选该节点';
        row.addEventListener('click', () => h.onNodeClick && h.onNodeClick(r.id));
        table.appendChild(row);
      });
      table.appendChild(el('div', { class: 'rtable-row is-total' }, [
        el('span', {}, ['合计']),
        ...cols.map((c) => el('span', { class: 'rtable-num' }, [amount.formatPlain(typeValue(t.totals, c[1]))])),
      ]));
      card.appendChild(table);
      return card;
    }

    function sideGrid() {
      return el('div', { class: 'report-grid' }, [energyCard(), timeCard()]);
    }

    function energyCard() {
      const e = report.energy;
      const max = Math.max(e.gainCents, e.suppressCents, e.unlabeledOutflow, 1);
      const card = el('section', { class: 'report-card' });
      card.appendChild(el('div', { class: 'card-head' }, [
        el('h3', {}, ['能量审计']),
        el('span', { class: 'hint' }, ['增益 / 阻抑 / 无标签流失']),
      ]));
      card.appendChild(el('div', { class: 'energy-grid' }, [
        el('div', { class: 'energy-cell' }, [
          el('div', { class: 'l' }, ['天赋驱动 · 增益']),
          el('div', { class: 'v gain' }, [amount.formatPlain(e.gainCents)]),
        ]),
        el('div', { class: 'energy-cell' }, [
          el('div', { class: 'l' }, ['短板流失 · 阻抑']),
          el('div', { class: 'v drain' }, [amount.formatPlain(e.suppressCents)]),
        ]),
        el('div', { class: 'energy-cell' }, [
          el('div', { class: 'l' }, ['精神暗域 · 无标签']),
          el('div', { class: 'v dark' }, [amount.formatPlain(e.unlabeledOutflow)]),
        ]),
      ]));
      const list = el('div', { class: 'energy-list' });
      const addLine = (x, cls) => {
        const pct = Math.max(2, Math.round((x.cents / max) * 100));
        list.appendChild(el('div', { class: 'energy-line' + (cls || '') }, [
          el('span', { class: 'n' }, [x.name]),
          el('span', { class: 'v' }, [amount.formatPlain(x.cents)]),
          el('span', { class: 'bar' }, [el('i', { style: 'width:' + pct + '%' })]),
        ]));
      };
      e.gainNodes.slice(0, 3).forEach((x) => addLine(x));
      e.suppressNodes.slice(0, 3).forEach((x) => addLine(x, 'is-drain'));
      e.darkNodes.slice(0, 3).forEach((x) => addLine(x, 'is-drain'));
      if (!e.gainNodes.length && !e.suppressNodes.length && !e.darkNodes.length) {
        list.appendChild(el('div', { class: 'rtable-empty' }, ['（本期没有可归因的能量标签）']));
      }
      card.appendChild(list);
      return card;
    }

    function timeCard() {
      const t = report.time;
      const card = el('section', { class: 'report-card' });
      card.appendChild(el('div', { class: 'card-head' }, [
        el('h3', {}, ['时间代币']),
        el('span', { class: 'hint' }, ['m · 不进入金额余额']),
      ]));
      card.appendChild(el('div', { class: 'time-big' }, [
        el('b', {}, [String(t.totalMinutes)]),
        el('span', {}, ['m']),
      ]));
      const list = el('div', { class: 'energy-list' });
      const max = Math.max.apply(null, [t.totalMinutes, 1].concat(t.rows.map((x) => x.minutes)));
      t.rows.forEach((x) => {
        const pct = Math.max(2, Math.round((x.minutes / max) * 100));
        list.appendChild(el('div', { class: 'energy-line' }, [
          el('span', { class: 'n' }, [x.name]),
          el('span', { class: 'v' }, [x.minutes + 'm']),
          el('span', { class: 'bar' }, [el('i', { style: 'width:' + pct + '%' })]),
        ]));
      });
      if (!t.rows.length) list.appendChild(el('div', { class: 'rtable-empty' }, ['（还没有 60m 这类时间流水）']));
      card.appendChild(list);
      return card;
    }

    function chainCard() {
      const card = el('section', { class: 'report-card', style: 'margin-top:14px' });
      card.appendChild(el('div', { class: 'card-head' }, [
        el('h3', {}, ['链式因果']),
        el('span', { class: 'hint' }, ['同一次 > 链展开的原子边，中间节点净额 0']),
        el('span', { class: 'total' }, [report.chains.length + ' 组']),
      ]));
      if (!report.chains.length) {
        card.appendChild(el('div', { class: 'rtable-empty' }, ['（还没有 A > B > C 这样的链式流水）']));
        return card;
      }
      const list = el('div', { class: 'chain-list' });
      report.chains.forEach((ch) => {
        const item = el('div', { class: 'chain-item' }, [
          el('div', { class: 'chain-head' }, [
            el('span', { class: 'id' }, [ch.id]),
            el('span', {}, [ch.nodes.join(' > ')]),
            el('span', { class: 'sum' }, [amount.formatPlain(ch.totalCents)]),
          ]),
          el('div', { class: 'chain-events' }, ch.events.map((e) => el('span', {}, [
            e.date + ' ' + e.fromName + '>' + e.toName + ' ',
            el('span', { class: 'amt' }, [amount.formatPlain(e.amountCents)]),
            e.diff === 'loss' ? ' 损耗' : e.diff === 'gain' ? ' 增益' : '',
          ]))),
        ]);
        list.appendChild(item);
      });
      card.appendChild(list);
      return card;
    }

    function domainCard() {
      const card = el('section', { class: 'report-card', style: 'margin-top:14px' });
      card.appendChild(el('div', { class: 'card-head' }, [
        el('h3', {}, ['多域 · 合并视角']),
        el('span', { class: 'hint' }, ['独立账本严格隔离；内部划拨单列并抵消']),
        el('span', { class: 'total' }, [report.domains.length + ' 域']),
      ]));
      const list = el('div', { class: 'domain-list' });
      report.domains.forEach((d) => {
        list.appendChild(el('div', { class: 'domain-line' }, [
          el('span', { class: 'd' }, [d.domain, el('i', {}, [d.label])]),
          el('span', { class: 'n' }, [d.count + ' 笔 · 记入 ' + amount.formatPlain(d.bookedCents)]),
          el('span', { class: 'v' }, ['流入 ' + amount.formatPlain(d.inCents)]),
          el('span', { class: 'v cross' }, ['跨域 ' + amount.formatPlain(d.crossCents)]),
        ]));
      });
      if (!report.domains.length) list.appendChild(el('div', { class: 'rtable-empty' }, ['（本期没有流水）']));
      card.appendChild(list);
      const c = report.consolidated;
      card.appendChild(el('div', { class: 'consolidate-note' }, [
        '合并：内部跨域 ' + amount.formatPlain(c.internalCents) + '，真正对外 '
          + el('b', {}, [amount.formatPlain(c.externalCents)]) + '。',
        report.crossEvents.length
          ? el('span', {}, [' 最近跨域：' + report.crossEvents.map((x) => x.fromDomain + '→' + x.toDomain + ' ' + amount.formatPlain(x.amountCents)).join(' · ')])
          : null,
      ]));
      return card;
    }

    function issuesCard() {
      const lines = report.issues.slice(0, 8).map((x) => '· ' + (x.message || x.code));
      return el('div', { class: 'report-issues' }, [
        '底层数据有 ' + report.issues.length + ' 条提示：',
        el('br'),
        lines.join(' '),
      ]);
    }

    return { render };
  }

  TV.reportView = { create };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/ui/input.js */
/* TxtVein · 单输入框
 * 双空格宏：第一次双击 → >，第二次双击 → <。
 * 气泡：↑↓ 选择、Tab 补全、数字键秒选并固化别名。
 * 幽灵撤销：固化后 5 秒内 Ctrl+Z / 点提示可恢复。
 * 这一层只管输入框与气泡；候选计算和落盘都在 app。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const { el, clear } = TV.dom;

  function create(dom, handlers) {
    const h = handlers || {};
    const input = dom.input;
    const bubbles = dom.bubbles;
    const prediction = dom.prediction;
    const stateEl = dom.state;
    const hintEl = dom.hint;
    const errorEl = dom.error;
    const row = dom.row;
    const prompt = dom.prompt;

    let suggestions = [];
    let active = 0;
    let context = null;
    let predictionData = null;
    let spaceRun = 0;
    let lastSpace = 0;
    let spaceTimer = 0;
    let rawSpaceTimer = 0;
    let rawSpaceCount = 0;
    let editing = false;
    let ghost = null;
    let errorTimer = 0;

    function caret() {
      return input.selectionStart == null ? input.value.length : input.selectionStart;
    }

    function setCaret(pos) {
      const p = Math.max(0, Math.min(input.value.length, pos));
      input.setSelectionRange(p, p);
    }

    function query(show) {
      if (!h.onQuery) return;
      const res = h.onQuery(input.value, caret());
      if (!res) return;
      suggestions = res.suggestions || [];
      context = res.context || null;
      predictionData = res.prediction || null;
      active = 0;
      if (res.state) stateEl.textContent = res.state;
      if (res.hint != null) hintEl.textContent = res.hint;
      renderBubbles(show !== false && !!input.value.trim());
      renderPrediction(!!input.value.trim());
    }

    function renderBubbles(show) {
      clear(bubbles);
      if (!show || !suggestions.length) {
        bubbles.hidden = true;
        return;
      }
      suggestions.forEach((s, i) => {
        const meta = [s.type || s.kindTag || '', s.pole ? s.pole + ' 极' : '', s.domain ? '[' + s.domain + ']' : '']
          .filter(Boolean).join(' · ');
        const b = el('div', {
          class: 'bubble' + (i === active ? ' is-active' : ''),
          dataset: { index: i },
          role: 'option',
        }, [
          el('span', { class: 'bubble-idx' }, [String(i + 1)]),
          el('span', { class: 'bubble-main' }, [
            el('span', { class: 'bubble-name' }, [
              s.label || s.name,
              s.codeLabel ? el('span', { class: 'code' }, [s.codeLabel]) : null,
            ]),
            el('span', { class: 'bubble-meta' }, [meta]),
          ]),
          el('span', { class: 'bubble-side' }, [
            s.kind === 'tag' ? '标签' : (s.pole === 'A'
              ? el('span', { class: 'pole-a' }, ['A'])
              : el('span', { class: 'pole-b' }, ['B'])),
          ]),
        ]);
        let chose = false;
        const doChoose = (ev) => {
          if (ev && ev.preventDefault) ev.preventDefault();
          if (chose) return;
          chose = true;
          choose(i);
        };
        b.addEventListener('pointerdown', doChoose);
        b.addEventListener('mousedown', doChoose);
        b.addEventListener('click', doChoose);
        b.addEventListener('mouseenter', () => setActive(i));
        bubbles.appendChild(b);
      });
      bubbles.hidden = false;
    }

    function renderPrediction(show) {
      clear(prediction);
      if (!show || !predictionData) {
        prediction.hidden = true;
        return;
      }
      prediction.appendChild(el('span', { class: 'pred-label' }, ['PREDICT']));
      prediction.appendChild(el('span', { class: 'pred-text' }, [predictionData.text]));
      prediction.appendChild(el('span', { class: 'pred-key' }, ['TAB 采用']));
      prediction.hidden = false;
    }

    function setActive(i) {
      if (!suggestions.length) return;
      active = (i + suggestions.length) % suggestions.length;
      Array.from(bubbles.children).forEach((b, idx) => {
        b.classList.toggle('is-active', idx === active);
      });
      const child = bubbles.children[active];
      if (child && child.scrollIntoView) child.scrollIntoView({ block: 'nearest' });
    }

    function choose(i) {
      const s = suggestions[i];
      if (!s) return;
      const ctx = context;
      bubbles.hidden = true;
      if (h.onChoose) h.onChoose(ctx, s, i, suggestions.slice());
    }

    function submit() {
      if (!input.value.trim()) return;
      if (h.onSubmit) h.onSubmit(input.value, { editing });
    }

    function showError(msg) {
      errorEl.textContent = msg || '';
      errorEl.hidden = !msg;
      row.classList.remove('is-error');
      void row.offsetWidth;
      if (msg) row.classList.add('is-error');
      clearTimeout(errorTimer);
      if (msg) {
        errorTimer = setTimeout(() => {
          row.classList.remove('is-error');
        }, 600);
      }
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.hidden = true;
    }

    function setValue(value, pos) {
      input.value = value == null ? '' : String(value);
      setCaret(pos == null ? input.value.length : pos);
      query(true);
    }

    function setEditing(on, text, label) {
      editing = !!on;
      row.classList.toggle('is-editing', editing);
      prompt.textContent = editing ? 'EDIT' : '>';
      if (editing && text != null) {
        input.value = text;
        setCaret(input.value.length);
        query(true);
      }
      if (label) hintEl.textContent = label;
      input.focus();
    }

    function setGhost(g) {
      ghost = g || null;
    }

    function undoGhost() {
      if (!ghost) return false;
      const g = ghost;
      ghost = null;
      if (h.onUndoAlias) h.onUndoAlias(g);
      return true;
    }

    function toggleGhost() {
      if (!ghost) return false;
      undoGhost();
      return true;
    }

    function insertSpaceOperator(op) {
      const pos = caret();
      const before = input.value.slice(0, pos);
      const after = input.value.slice(pos);
      const nextBefore = op === '>' ? before.replace(/\s*$/, '') + ' > '
        : before.replace(/\s*[<>]\s*$/, '') + ' < ';
      input.value = nextBefore + after;
      setCaret(nextBefore.length);
      query(true);
    }

    /* 手机软键盘不一定发可 preventDefault 的 Space keydown；
       从 input 事件里识别连续空格，延迟 320ms 等第三击。 */
    function commitRawSpaces(count) {
      const pos = caret();
      const before = input.value.slice(0, pos);
      const m = before.match(/ +$/);
      if (!m) return;
      const start = pos - m[0].length;
      input.value = input.value.slice(0, start) + input.value.slice(pos);
      setCaret(start);
      insertSpaceOperator((count >= 3 || m[0].length >= 3) ? '<' : '>');
    }

    input.addEventListener('keydown', (ev) => {
      if (ev.isComposing) return;

      if (ev.key !== ' ') {
        if (spaceTimer) { clearTimeout(spaceTimer); spaceTimer = 0; }
        if (rawSpaceTimer) { clearTimeout(rawSpaceTimer); rawSpaceTimer = 0; rawSpaceCount = 0; }
        spaceRun = 0;
      }

      if (ev.key === ' ') {
        if (rawSpaceTimer) { clearTimeout(rawSpaceTimer); rawSpaceTimer = 0; rawSpaceCount = 0; }
        const now = Date.now();
        spaceRun = (now - lastSpace < 360) ? spaceRun + 1 : 1;
        lastSpace = now;

        /* 2 连击 → >；3 连击 → 把刚插入的 > 换成 < */
        if (spaceRun >= 2) {
          ev.preventDefault();
          if (spaceTimer) { clearTimeout(spaceTimer); spaceTimer = 0; }
          insertSpaceOperator(spaceRun === 2 ? '>' : '<');
          spaceRun = spaceRun === 2 ? 2 : 0;
          return;
        }

        /* 候选打开时，单空格延迟确认；若 360ms 内来了第二/第三个空格，走上面的 > / < */
        if (suggestions.length && !bubbles.hidden) {
          const s = suggestions[active];
          const repl = String((s && (s.codeLabel || s.label || s.name)) || '').replace(/^#/, '').trim().toLowerCase();
          const tok = String((context && context.token) || '').replace(/^#/, '').trim().toLowerCase();
          if (!tok || (repl && repl !== tok)) {
            ev.preventDefault();
            if (spaceTimer) clearTimeout(spaceTimer);
            spaceTimer = setTimeout(() => {
              spaceTimer = 0;
              spaceRun = 0;
              choose(active);
            }, 320);
            return;
          }
        }
        return;
      }

      if (ev.key === 'Enter') {
        if (suggestions.length && !bubbles.hidden) {
          ev.preventDefault();
          choose(active);
          return;
        }
        ev.preventDefault();
        submit();
        return;
      }

      if (ev.key === 'Tab') {
        if (predictionData && prediction.hidden === false) {
          ev.preventDefault();
          input.value = predictionData.text;
          setCaret(input.value.length);
          query(true);
          return;
        }
        if (suggestions.length && !bubbles.hidden) {
          ev.preventDefault();
          choose(active);
        }
        return;
      }

      if ((ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')
        && suggestions.length && !bubbles.hidden) {
        ev.preventDefault();
        if (h.onPath) h.onPath(ev.key === 'ArrowRight' ? 1 : -1, context);
        return;
      }

      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        if (suggestions.length && !bubbles.hidden) {
          ev.preventDefault();
          setActive(active + (ev.key === 'ArrowDown' ? 1 : -1));
          return;
        }
        if (h.onNavigate) {
          ev.preventDefault();
          h.onNavigate(ev.key === 'ArrowDown' ? 1 : -1);
        }
        return;
      }

      if (ev.key === 'Escape') {
        if (suggestions.length && !bubbles.hidden) {
          bubbles.hidden = true;
          return;
        }
        if (editing) {
          ev.preventDefault();
          if (h.onCancelEdit) h.onCancelEdit();
          return;
        }
        if (input.value) {
          input.value = '';
          clearError();
          query(false);
        }
        return;
      }

      if (ev.key === 'Backspace') {
        clearError();
        setTimeout(() => query(true), 0);
        return;
      }

      const num = /^[1-9]$/.test(ev.key) ? Number(ev.key)
        : (/^Numpad[1-9]$/.test(ev.code) ? Number(ev.code.slice(-1)) : 0);
      if (num && suggestions.length && !bubbles.hidden) {
        ev.preventDefault();
        choose(num - 1);
        return;
      }

      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') {
        if (ghost) {
          ev.preventDefault();
          undoGhost();
        }
      }
    });

    input.addEventListener('input', (ev) => {
      clearError();
      const type = ev.inputType || '';
      if (!ev.isComposing && type.indexOf('Composition') < 0 && type.indexOf('Paste') < 0) {
        const pos = caret();
        const before = input.value.slice(0, pos);
        const m = before.match(/ +$/);
        const n = m ? m[0].length : 0;
        if (n >= 2) {
          if (rawSpaceTimer) clearTimeout(rawSpaceTimer);
          rawSpaceCount = n;
          if (n >= 3) {
            rawSpaceTimer = 0;
            commitRawSpaces(3);
          } else {
            rawSpaceTimer = setTimeout(() => {
              rawSpaceTimer = 0;
              commitRawSpaces(rawSpaceCount);
            }, 320);
          }
        } else if (n === 0 && rawSpaceTimer) {
          clearTimeout(rawSpaceTimer);
          rawSpaceTimer = 0;
          rawSpaceCount = 0;
        }
      }
      query(true);
    });

    input.addEventListener('focus', () => query(true));

    input.addEventListener('blur', () => {
      setTimeout(() => {
        if (!bubbles.contains(document.activeElement)) bubbles.hidden = true;
      }, 120);
    });

    return {
      el: input,
      focus() { input.focus(); },
      value() { return input.value; },
      setValue,
      setEditing,
      select(start, end) {
        const a = Math.max(0, Math.min(Number(start) || 0, input.value.length));
        const b = Math.max(a, Math.min(Number(end) || a, input.value.length));
        input.focus();
        input.setSelectionRange(a, b);
      },
      isEditing() { return editing; },
      showError,
      clearError,
      setGhost,
      undoGhost,
      toggleGhost,
      query,
      setSuggestions(list, ctx) {
        suggestions = Array.isArray(list) ? list : [];
        context = ctx || null;
        active = 0;
        renderBubbles(true);
        renderPrediction(false);
      },
      clear() {
        input.value = '';
        clearError();
        query(false);
      },
    };
  }

  TV.input = { create };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/ui/panels.js */
/* TxtVein · 面板：规则 / 字典 / 文本 / 导入导出 / 帮助 / 密码
 * 所有面板都只读 app.getState()，写操作调用 app 的方法；不直接碰核心数据。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const { el, clear } = TV.dom;
  const amount = TV.amount;
  const dictMod = TV.dict;
  const dateMod = TV.date;
  const rulesMod = TV.rules;

  function create(ui) {
    const modal = ui.modal;
    const titleEl = ui.title;
    const bodyEl = ui.body;
    const footEl = ui.foot;
    const closeBtn = ui.close;
    const toastEl = ui.toast;
    const toastText = ui.toastText;
    const toastAction = ui.toastAction;

    let toastTimer = 0;

    function open(title, body, foot) {
      titleEl.textContent = title;
      clear(bodyEl);
      clear(footEl);
      (Array.isArray(body) ? body : [body]).forEach((n) => n && bodyEl.appendChild(n));
      (Array.isArray(foot) ? foot : foot ? [foot] : []).forEach((n) => n && footEl.appendChild(n));
      modal.hidden = false;
      bodyEl.scrollTop = 0;
      setTimeout(() => {
        const first = bodyEl.querySelector('input, select, textarea, button');
        if (first && ui.autofocus !== false) first.focus();
      }, 30);
    }

    function close() {
      modal.hidden = true;
      clear(bodyEl);
      clear(footEl);
    }

    closeBtn.addEventListener('click', close);
    modal.querySelector('.modal-backdrop').addEventListener('click', close);
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && !modal.hidden) {
        const panel = bodyEl.querySelector('[data-escape-stop]');
        if (panel) return;
        close();
      }
    });

    function toast(msg, type, action) {
      toastText.textContent = msg || '';
      toastEl.hidden = false;
      toastEl.classList.toggle('is-error', type === 'error');
      toastEl.classList.toggle('is-ok', type === 'ok');
      clearTimeout(toastTimer);
      if (action && action.label) {
        toastAction.hidden = false;
        toastAction.textContent = action.label;
        toastAction.onclick = () => {
          toastAction.hidden = true;
          action.fn && action.fn();
        };
      } else {
        toastAction.hidden = true;
        toastAction.onclick = null;
      }
      toastTimer = setTimeout(() => { toastEl.hidden = true; }, action ? 6500 : 3200);
    }

    function section(title, children, note) {
      return el('section', { class: 'panel-section' }, [
        el('h3', {}, [title, note ? el('span', {}, [note]) : null]),
        ...(Array.isArray(children) ? children : [children]),
      ]);
    }

    function field(label, input) {
      return el('div', { class: 'field' }, [
        el('label', {}, [label]),
        input,
      ]);
    }

    function input(opts) {
      return el('input', Object.assign({ class: 'input', type: 'text', autocomplete: 'off', spellcheck: 'false' }, opts || {}));
    }

    function select(options, value) {
      const s = el('select', { class: 'select' });
      (options || []).forEach((o) => {
        const opt = el('option', { value: o.value }, [o.label]);
        if (String(o.value) === String(value)) opt.selected = true;
        s.appendChild(opt);
      });
      return s;
    }

    function button(label, cls, fn) {
      const b = el('button', { class: 'btn ' + (cls || ''), type: 'button' }, [label]);
      b.addEventListener('click', fn);
      return b;
    }

    function mini(label, cls, fn) {
      const b = el('button', { class: 'mini-btn ' + (cls || ''), type: 'button' }, [label]);
      b.addEventListener('click', fn);
      return b;
    }

    function closeFoot(extra) {
      return el('div', { class: 'row-gap' }, [
        ...(extra || []),
        button('关闭', 'btn-ghost', close),
      ]);
    }

    /* ---------------- 规则 ---------------- */

    function showRules(app) {
      const s = app.getState();
      const plansActive = s.plans.filter((p) => p.status === 'active');
      const plansOff = s.plans.filter((p) => p.status !== 'active');
      const planCard = (p) => {
        const from = dictMod.renderNode(s.dict, p.from, s.mode, s.lang);
        const to = dictMod.renderNode(s.dict, p.to, s.mode, s.lang);
        const tags = (p.tagIds || []).map((id) => dictMod.renderTag(s.dict, id, s.mode, s.lang)).filter(Boolean);
        const due = rulesMod.nextDue(p, new Date());
        return el('div', { class: 'plan-card' + (p.status !== 'active' ? ' is-canceled' : '') }, [
          el('div', { class: 'plan-top' }, [
            el('span', { class: 'plan-id' }, [p.id]),
            el('span', { class: 'plan-status' + (p.status !== 'active' ? ' is-off' : '') }, [p.status === 'active' ? 'ACTIVE' : 'CANCELED']),
            el('span', { class: 'plan-meta' }, [
              '从 ' + (p.start || '—') + ' 起',
              p.lastRun ? '上次 ' + p.lastRun : '未执行',
              due ? '下次 ' + due : '不再生成',
            ]),
          ]),
          el('div', { class: 'plan-text' }, [
            from + ' > ' + to + '  ' + amount.formatPlain(p.amountCents)
              + '  *' + p.period + (tags.length ? '  < ' + tags.join(' < ') : ''),
          ]),
          el('div', { class: 'plan-actions' }, [
            p.status === 'active'
              ? mini('取消未来', 'is-danger', () => {
                app.cancelPlan(p.id);
                toast('已取消 ' + p.id + '；历史流水未动', 'ok');
                showRules(app);
              })
              : mini('恢复', 'is-accent', () => {
                app.resumePlan(p.id);
                toast('已恢复 ' + p.id, 'ok');
                showRules(app);
              }),
            mini('删除规则', '', () => {
              confirm(app, '删除规则', '删除 ' + p.id + '？只删规则，不删已经生成的流水。', () => {
                app.deletePlan(p.id);
                toast('已删除规则 ' + p.id, 'ok');
                showRules(app);
              });
            }),
          ]),
        ]);
      };

      const ruleCard = (r) => {
        const from = dictMod.renderNode(s.dict, r.from, s.mode, s.lang);
        const to = dictMod.renderNode(s.dict, r.to, s.mode, s.lang);
        return el('div', { class: 'rule-card' }, [
          el('div', { class: 'rule-top' }, [
            el('span', { class: 'rule-id' }, [r.id]),
            el('span', { class: 'rule-status' + (r.status !== 'active' ? ' is-off' : '') }, [r.status === 'active' ? 'ACTIVE' : 'OFF']),
            el('span', { class: 'rule-meta' }, [
              '关键字 ' + (r.keywords || []).join(' / '),
              r.amountOp ? '金额 ' + r.amountOp + ' ' + amount.centsToDisplay(r.amountCents) : '',
            ]),
          ]),
          el('div', { class: 'rule-text' }, [from + ' > ' + to + '  ' + (r.name || '')]),
          el('div', { class: 'rule-actions' }, [
            mini('删除规则', 'is-danger', () => {
              confirm(app, '删除事件规则', '删除 ' + r.id + '？只删除预测模板，不改历史流水。', () => {
                app.deleteRule(r.id);
                toast('已删除规则 ' + r.id, 'ok');
                showRules(app);
              });
            }),
          ]),
        ]);
      };

      const body = [
        section('周期规则 · PLAN', plansActive.length || plansOff.length
          ? plansActive.concat(plansOff).map(planCard)
          : el('div', { class: 'import-note' }, ['还没有周期规则。录入 微信 > 房租 1000*m 即可挂一条。']),
          plansActive.length + ' active / ' + plansOff.length + ' canceled'),
        section('事件规则 · RULES', s.rules.length
          ? s.rules.map(ruleCard)
          : el('div', { class: 'import-note' }, ['还没有事件规则。可以在这里理解预测式录入的模板结构。']),
          s.rules.length + ' 条'),
      ];
      open('规则引擎', body, closeFoot([
        el('span', { class: 'help-text' }, ['取消只改状态；历史流水一行不动。']),
      ]));
    }

    /* ---------------- 字典 ---------------- */

    function showDict(app, tab, query) {
      const s = app.getState();
      const q = String(query || '');
      const current = tab || 'nodes';
      const tabs = el('div', { class: 'panel-tabs' }, [
        tabBtn('节点 · NODES', 'nodes', current),
        tabBtn('标签 · TAGS', 'tags', current),
      ]);
      function tabBtn(label, key, active) {
        const b = el('button', { class: 'panel-tab' + (key === active ? ' is-active' : ''), type: 'button' }, [label]);
        b.addEventListener('click', () => showDict(app, key, q));
        return b;
      }

      const search = input({ class: 'input panel-search', placeholder: current === 'nodes' ? '搜索名字 / 简码' : '搜索标签', value: q });
      search.addEventListener('input', () => {
        const val = search.value;
        clearTimeout(search._t);
        search._t = setTimeout(() => showDict(app, current, val), 180);
      });

      const addBtn = button(current === 'nodes' ? '+ 新建节点' : '+ 新建标签', 'btn-primary', () => {
        if (current === 'nodes') nodeForm(app); else tagForm(app);
      });

      const toolbar = el('div', { class: 'panel-toolbar' }, [search, el('span', { class: 'grow' }), addBtn]);

      let list;
      if (current === 'nodes') list = nodeList(app, q);
      else list = tagList(app, q);

      open('字典 · ' + (current === 'nodes' ? '节点' : '标签'), [tabs, toolbar, list], closeFoot([
        el('span', { class: 'help-text' }, ['流水只存 ID；改名只改这里，历史不断链。']),
      ]));
    }

    function nodeList(app, q) {
      const s = app.getState();
      const calc = app.getCalcAll();
      const rows = Object.keys(s.dict.nodes)
        .map((id) => ({ id, node: s.dict.nodes[id], stat: calc.byId.get(id) }))
        .filter((x) => !q || (x.node.zh_name + x.node.en_name + x.node.zh_code + x.node.en_code).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => (a.node.type || '').localeCompare(b.node.type || '') || (a.node.zh_name || '').localeCompare(b.node.zh_name || ''));
      if (!rows.length) return el('div', { class: 'import-note' }, ['没有匹配的节点。']);
      const list = el('div', { class: 'dict-list' }, [
        el('div', { class: 'dict-row is-head' }, [
          el('span', {}, ['名称']), el('span', {}, ['简码']), el('span', {}, ['类型']),
          el('span', {}, ['域']), el('span', {}, ['余额']), el('span', {}, ['操作']),
        ]),
      ]);
      rows.forEach((x) => {
        const n = x.node;
        const bal = x.stat ? x.stat.closing : 0;
        list.appendChild(el('div', { class: 'dict-row' }, [
          el('span', { class: 'dict-name' }, [
            n.zh_name,
            n.system ? el('i', {}, ['SYS']) : null,
            el('span', { class: 'pole-badge ' + (n.polarity === 'A' ? 'a' : 'b') }, [n.polarity]),
          ]),
          el('span', { class: 'dict-code' }, [n.zh_code || n.en_code || '—']),
          el('span', { class: 'dict-dim' }, [n.type + (n.form && n.form !== 'outside' ? ' · ' + (dictMod.FORMS[n.form] || n.form) : '')]),
          el('span', { class: 'dict-domain' }, [el('span', { class: 'domain-badge' }, [n.domain])]),
          el('span', { class: 'dict-code' }, [amount.centsToDisplay(bal)]),
          el('span', { class: 'dict-actions' }, [
            mini('编辑', '', () => nodeForm(app, null, x.id)),
            mini('删除', 'is-danger', () => {
              const used = app.countNodeRefs(x.id);
              if (used > 0) { toast('该节点被 ' + used + ' 笔流水引用，不能删；可改名', 'error'); return; }
              confirm(app, '删除节点', '删除「' + n.zh_name + '」？ID 作废，别名一并清理。', () => {
                const r = app.deleteNode(x.id);
                if (r.ok) { toast('已删除节点', 'ok'); showDict(app, 'nodes', q); } else toast(r.error, 'error');
              });
            }),
          ]),
        ]));
      });
      return list;
    }

    function tagList(app, q) {
      const s = app.getState();
      const rows = Object.keys(s.dict.tags)
        .map((id) => ({ id, tag: s.dict.tags[id] }))
        .filter((x) => !q || (x.tag.zh_name + x.tag.en_name + x.tag.zh_code).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => (a.tag.kind || '').localeCompare(b.tag.kind || '') || (a.tag.zh_name || '').localeCompare(b.tag.zh_name || ''));
      if (!rows.length) return el('div', { class: 'import-note' }, ['没有匹配的标签。']);
      const list = el('div', { class: 'dict-list' }, [
        el('div', { class: 'dict-row is-head' }, [
          el('span', {}, ['名称']), el('span', {}, ['简码']), el('span', {}, ['类型']),
          el('span', {}, ['域']), el('span', {}, ['父级']), el('span', {}, ['操作']),
        ]),
      ]);
      rows.forEach((x) => {
        const t = x.tag;
        const parent = t.parent_id && s.dict.tags[t.parent_id] ? s.dict.tags[t.parent_id].zh_name : '—';
        list.appendChild(el('div', { class: 'dict-row' }, [
          el('span', { class: 'dict-name' }, [t.zh_name, el('span', { class: 'pole-badge ' + (t.kind === 'gain' ? 'a' : t.kind === 'suppress' ? 'b' : '') }, [t.kind || 'plain'])]),
          el('span', { class: 'dict-code' }, [t.zh_code || '—']),
          el('span', { class: 'dict-dim' }, [dictMod.KIND_TAG[t.kind] || t.kind || '普通']),
          el('span', { class: 'dict-domain' }, [el('span', { class: 'domain-badge' }, [t.domain])]),
          el('span', { class: 'dict-code' }, [parent]),
          el('span', { class: 'dict-actions' }, [
            mini('编辑', '', () => tagForm(app, null, x.id)),
            mini('删除', 'is-danger', () => {
              confirm(app, '删除标签', '删除「' + t.zh_name + '」？流水里的标签引用会保留 ID，但字典不再解析。', () => {
                const r = app.deleteTag(x.id);
                if (r.ok) { toast('已删除标签', 'ok'); showDict(app, 'tags', q); } else toast(r.error, 'error');
              });
            }),
          ]),
        ]));
      });
      return list;
    }

    function nodeForm(app, preset, id, opts) {
      const o = opts || {};
      const s = app.getState();
      const n = id ? s.dict.nodes[id] : null;
      const p = preset || {};
      const zhName = input({ value: n ? n.zh_name : (p.zh_name || ''), placeholder: '如：微信钱包' });
      const enName = input({ value: n ? n.en_name : (p.en_name || ''), placeholder: 'WeChat Wallet' });
      const zhCode = input({ value: n ? n.zh_code : (p.zh_code || ''), placeholder: 'wx' });
      const enCode = input({ value: n ? n.en_code : (p.en_code || ''), placeholder: 'wc' });
      const type = select(dictMod.TYPE_ALL.map((t) => ({ value: t, label: t + ' · ' + dictMod.TYPES[t].pole + ' 极' })), n ? n.type : (p.type || '资产'));
      const form = select(Object.keys(dictMod.FORMS).map((f) => ({ value: f, label: dictMod.FORMS[f] })), n ? n.form : (p.form || 'fluid'));
      const domain = select(dictMod.DOMAIN_ORDER.map((d) => ({ value: d, label: d + ' · ' + dictMod.DOMAINS[d].zh })), n ? n.domain : (p.domain || s.domain));
      const parent = select([{ value: '', label: '（无）' }].concat(Object.keys(s.dict.nodes)
        .filter((k) => k !== id)
        .map((k) => ({ value: k, label: s.dict.nodes[k].zh_name }))), n ? n.parent_id : '');
      const weight = input({ type: 'number', value: n ? n.weight : 100, min: '0', max: '1000' });
      const error = el('div', { class: 'form-error' });

      function syncForm() {
        const t = dictMod.normalizeType(type.value);
        form.disabled = !t.ok || t.pole === 'B';
        if (t.pole === 'B') form.value = 'outside';
        else if (form.value === 'outside') form.value = t.form || 'fluid';
        error.textContent = '';
      }
      type.addEventListener('change', syncForm);
      syncForm();

      const submit = button(id ? '保存修改' : '创建节点', 'btn-primary', () => {
        const spec = {
          zh_name: zhName.value.trim(),
          en_name: enName.value.trim(),
          zh_code: zhCode.value.trim(),
          en_code: enCode.value.trim(),
          type: type.value,
          form: form.value,
          domain: domain.value,
          parent_id: parent.value,
          weight: Number(weight.value),
        };
        if (!spec.zh_name && !spec.en_name) { error.textContent = '节点要有名字'; return; }
        const r = id ? app.updateNode(id, spec) : app.addNode(spec);
        if (!r.ok) { error.textContent = r.error; return; }
        toast(id ? '已保存节点（ID 不变，历史不断链）' : '已创建节点 ' + r.id, 'ok');
        close();
        app.afterDataChange();
        if (o.reopen === false) {
          if (TV.inputApi) TV.inputApi.focus();
        } else {
          showDict(app, 'nodes', '');
        }
      });

      open(id ? '编辑节点 · ' + n.zh_name : '新建节点', [
        el('div', { class: 'form-row' }, [field('中文名', zhName), field('英文名', enName)]),
        el('div', { class: 'form-row' }, [field('中文简码', zhCode), field('英文简码', enCode)]),
        el('div', { class: 'form-row-3' }, [field('大类', type), field('A 极形态', form), field('域', domain)]),
        el('div', { class: 'form-row' }, [field('父节点（可选）', parent), field('权重', weight)]),
        error,
        el('p', { class: 'help-text' }, ['极性由大类决定：资产/费用/成本 = A，负债/收入/权益 = B。流水只存 ID。']),
      ], closeFoot([submit]));
    }

    function tagForm(app, preset, id) {
      const s = app.getState();
      const t = id ? s.dict.tags[id] : null;
      const p = preset || {};
      const zhName = input({ value: t ? t.zh_name : (p.zh_name || ''), placeholder: '如：咖啡' });
      const enName = input({ value: t ? t.en_name : (p.en_name || ''), placeholder: 'Coffee' });
      const zhCode = input({ value: t ? t.zh_code : (p.zh_code || ''), placeholder: 'cof' });
      const domain = select(dictMod.DOMAIN_ORDER.map((d) => ({ value: d, label: d + ' · ' + dictMod.DOMAINS[d].zh })), t ? t.domain : (p.domain || s.domain));
      const parent = select([{ value: '', label: '（无 / 根标签）' }].concat(Object.keys(s.dict.tags)
        .filter((k) => k !== id)
        .map((k) => ({ value: k, label: s.dict.tags[k].zh_name }))), t ? t.parent_id : '');
      const kind = select(Object.keys(dictMod.KIND_TAG).map((k) => ({ value: k, label: dictMod.KIND_TAG[k] })), t ? t.kind : 'plain');
      const error = el('div', { class: 'form-error' });
      const submit = button(id ? '保存修改' : '创建标签', 'btn-primary', () => {
        const spec = {
          zh_name: zhName.value.trim(),
          en_name: enName.value.trim(),
          zh_code: zhCode.value.trim(),
          domain: domain.value,
          parent_id: parent.value,
          kind: kind.value,
        };
        if (!spec.zh_name) { error.textContent = '标签要有名字'; return; }
        const r = id ? app.updateTag(id, spec) : app.addTag(spec);
        if (!r.ok) { error.textContent = r.error; return; }
        toast(id ? '已保存标签' : '已创建标签 ' + r.id, 'ok');
        close();
        app.afterDataChange();
        showDict(app, 'tags', '');
      });
      open(id ? '编辑标签 · ' + t.zh_name : '新建标签', [
        el('div', { class: 'form-row' }, [field('中文名', zhName), field('英文名', enName)]),
        el('div', { class: 'form-row-3' }, [field('简码', zhCode), field('域', domain), field('类型', kind)]),
        field('父标签（可选）', parent),
        error,
        el('p', { class: 'help-text' }, ['标签是语义层；< 表达从属层级，空格表达同级。']),
      ], closeFoot([submit]));
    }

    /* ---------------- 文本 ---------------- */

    async function showText(app, tab) {
      const texts = await app.buildTexts();
      const current = tab || 'ledger';
      const tabs = el('div', { class: 'tab-bar' }, [
        textTab('ledger.txt', 'ledger'),
        textTab('dict.json', 'dict'),
      ]);
      function textTab(label, key) {
        const b = el('button', { class: current === key ? 'is-active' : '', type: 'button' }, [label]);
        b.addEventListener('click', () => showText(app, key));
        return b;
      }
      const text = current === 'ledger' ? texts.ledger : texts.dict;
      const meta = el('div', { class: 'text-meta' }, [
        el('span', {}, ['VAULT_ID ', el('b', {}, [texts.vaultId || '—'])]),
        el('span', {}, ['LINK ', el('b', {}, [(current === 'ledger' ? texts.dictHash : texts.ledgerHash || '').slice(0, 16) + '…'])]),
        el('span', {}, ['SHA-256 ', el('b', {}, [((current === 'ledger' ? texts.ledgerHash : texts.dictHash) || '').slice(0, 16) + '…'])]),
        el('span', {}, [text.length + ' 字符']),
      ]);
      const pre = el('pre', { class: 'text-pre' }, [text]);
      const toolbar = el('div', { class: 'panel-toolbar' }, [
        button('复制', '', async () => {
          await TV.files.copyText(text);
          toast('已复制 ' + (current === 'ledger' ? 'ledger.txt' : 'dict.json'), 'ok');
        }),
        button('下载', '', () => {
          TV.files.downloadText(current === 'ledger' ? 'ledger.txt' : 'dict.json', text);
          toast('已下载', 'ok');
        }),
        el('span', { class: 'grow' }),
        el('span', { class: 'help-text' }, ['这是底层唯一事实源，含 ID。']),
      ]);
      open('底层纯文本', [tabs, meta, toolbar, pre], closeFoot());
    }

    /* ---------------- 导出 ---------------- */

    function showExport(app) {
      const cards = [
        exportCard(app, 'single', '明文单文件', ['txtvein-export.txt'], '统计 → 流水 → 行为 → 备注 → 字典明文；不含 ID 附录。'),
        exportCard(app, 'shadow', '初级密文', ['ledger.shadow', 'dict.vault'], '流水是纯 ID 明文；字典 AES-GCM-256 加密。适合公开流水、隐藏语义。'),
        exportCard(app, 'deep', '深度密文', ['ledger.enc', 'dict.enc'], '两份文件都加密，纵深防御：解开流水仍只看到 ID。'),
      ];
      open('导出', [
        el('div', { class: 'export-grid' }, cards),
        el('div', { class: 'import-note' }, [
          '导出使用当前内存中的主密钥，不会再次询问密码。加密文件带 [SECURE_START] / [SECURE_END] 装甲与 SHA-256 互锁。',
        ]),
      ], closeFoot());
    }

    function exportCard(app, mode, title, files, desc) {
      const btn = button('生成并下载', mode === 'deep' ? 'btn-primary' : '', async () => {
        btn.disabled = true;
        btn.textContent = '生成中…';
        try {
          const r = await app.exportMode(mode);
          if (!r.ok) { toast(r.error || '导出失败', 'error'); return; }
          toast('已生成 ' + files.join(' + '), 'ok');
        } catch (e) {
          toast(e.message || '导出失败', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = '生成并下载';
        }
      });
      return el('div', { class: 'export-card' }, [
        el('h4', {}, [title]),
        el('p', {}, [desc]),
        el('div', { class: 'file-list-mini' }, [files.join('  +  ')]),
        btn,
      ]);
    }

    /* ---------------- 导入 ---------------- */

    function showImport(app) {
      let files = [];
      let result = null;
      const drop = el('div', { class: 'drop-zone' }, [
        el('b', {}, ['选择或拖入两个文件']),
        el('br'),
        'ledger.txt + dict.json / ledger.shadow + dict.vault / ledger.enc + dict.enc',
        el('br'),
        '也接受旧版文脉明文账本（单文件）',
      ]);
      const fileList = el('div', { class: 'file-list' });
      const password = input({ type: 'password', placeholder: '加密文件的密码（如有）' });
      const force = el('input', { type: 'checkbox' });
      const forceWrap = el('label', { class: 'row-gap', style: 'font-size:11px;color:var(--dim)' }, [
        force, '指纹不匹配时仍然导入（不推荐）',
      ]);
      const note = el('div', { class: 'import-note' });
      const submit = button('导入并替换当前账本', 'btn-primary', async () => {
        if (!files.length) { note.className = 'import-note is-bad'; note.textContent = '先选文件。'; return; }
        submit.disabled = true;
        submit.textContent = '导入中…';
        try {
          const r = await app.importBundle(files, {
            password: password.value,
            force: force.checked,
          });
          result = r;
          if (!r.ok) {
            note.className = 'import-note is-bad';
            note.textContent = r.error || '导入失败';
            if (r.needsForce) forceWrap.hidden = false;
            return;
          }
          note.className = 'import-note';
          note.textContent = r.message || '导入成功';
          toast(r.message || '导入成功', 'ok');
          setTimeout(() => { close(); app.afterDataChange(); }, 350);
        } finally {
          submit.disabled = false;
          submit.textContent = '导入并替换当前账本';
        }
      });

      function refresh() {
        clear(fileList);
        result = null;
        if (!files.length) return;
        files.forEach((f) => {
          const kind = TV.files.classify(f.name, f.text);
          const label = { ledger: 'LEDGER', dict: 'DICT', secure: 'SECURE', legacy: 'LEGACY', unknown: '?' }[kind] || '?';
          fileList.appendChild(el('div', { class: 'file-row' }, [
            el('span', { class: 'file-kind is-' + kind }, [label]),
            el('span', { class: 'file-name' }, [f.name]),
            el('span', { class: 'file-size' }, [TV.files.bytes(f.size || f.text.length)]),
          ]));
        });
        const kinds = files.map((f) => TV.files.classify(f.name, f.text));
        const secure = kinds.includes('secure');
        password.parentElement.hidden = !secure;
        if (files.length === 1 && kinds[0] !== 'legacy') {
          note.className = 'import-note is-bad';
          note.textContent = '只选了一个文件。明文/密文流水必须和字典一起导入；旧版单文件例外。';
        } else {
          note.className = 'import-note';
          note.textContent = '导入会替换当前账本（当前账本请先导出备份）。';
        }
        forceWrap.hidden = true;
      }

      async function addFiles(list) {
        const arr = Array.from(list || []);
        if (!arr.length) return;
        const read = await TV.files.readFiles(arr);
        files = files.concat(read);
        refresh();
      }

      drop.addEventListener('click', async () => {
        const picked = await TV.files.pickFiles(true);
        await addFiles(picked);
      });
      drop.addEventListener('dragover', (ev) => { ev.preventDefault(); drop.classList.add('is-over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
      drop.addEventListener('drop', async (ev) => {
        ev.preventDefault();
        drop.classList.remove('is-over');
        await addFiles(ev.dataTransfer.files);
      });

      open('导入', [
        drop,
        fileList,
        el('div', { class: 'form-row', style: 'margin-top:12px' }, [field('密码', password), el('div', {}, [])]),
        forceWrap,
        note,
        el('div', { class: 'help-text' }, ['校验：VAULT_ID 指纹 + 流水/字典 SHA-256 互锁。缺一个文件会被拦下。']),
      ], closeFoot([submit]));
      forceWrap.hidden = true;
      password.parentElement.hidden = true;
    }

    /* ---------------- 帮助 ---------------- */

    function showHelp(app) {
      const help = el('div', { class: 'help-grid' }, [        el('div', {}, [
          el('h3', {}, ['一句语法']),
          el('p', {}, [
            el('code', {}, ['转出 > 转入 金额 < 标签']),
            el('br'),
            '只有 > 和 <。资金从左流向右；< 把语义收敛到标签层级。',
          ]),
          el('h3', {}, ['示例']),
          el('ul', {}, [
            el('li', {}, [el('code', {}, ['wx1 > din 35 < 咖啡 < 拿铁'])]),
            el('li', {}, [el('code', {}, ['sav > wx1 > din 1000 995']), ' 链式转移，差额进损耗']),
            el('li', {}, [el('code', {}, ['261110 wx1 > din 12.5']), ' 指定日期']),
            el('li', {}, [el('code', {}, ['-1 wx1 > din 35']), ' 昨天（落盘固化）']),
            el('li', {}, [el('code', {}, ['wx1 > rent 1000*m']), ' 周期规则']),
            el('li', {}, [el('code', {}, ['P:wx1 > C:cbiz 1000 < 垫付']), ' 跨域']),
            el('li', {}, [el('code', {}, ['wx1 > din 60m < 时间']), ' 时间代币']),
          ]),
          el('h3', {}, ['录入宏']),
          el('p', {}, ['连按两次空格 → >；再连按两次 → <。Backspace 删掉符号后会自动重新判断。数字键 1–9 可在气泡里秒选，并把 wx1/wx2 固化进别名。']),
        ]),
        el('div', {}, [
          el('h3', {}, ['快捷键']),
          shortcut('回车', '落盘 / 气泡选中'),
          shortcut('↑ ↓', '行间穿梭 / 气泡选择'),
          shortcut('Tab', '补全气泡 / 采用预测'),
          shortcut('Ctrl+Z', '撤销刚固化的别名'),
          shortcut('Delete', '删除选中的流水'),
          shortcut('Ctrl+S', '立即保存'),
          shortcut('Ctrl+R', '规则面板'),
          shortcut('Ctrl+Shift+P', '简码 / 明文'),
          shortcut('Ctrl+Shift+L', '中文 / 英文'),
          shortcut('Ctrl+Shift+K', '锁定'),
          shortcut('?', '本页'),
          el('h3', { style: 'margin-top:16px' }, ['三大铁律']),
          el('ul', {}, [
            el('li', {}, ['流水是唯一事实；UI/报表/统计都是派生视图。']),
            el('li', {}, ['关闭软件，数据不死；导出必须能被记事本打开。']),
            el('li', {}, ['灯下黑：复杂都在底层，界面只留发光的输入框。']),
          ]),
          el('h3', { style: 'margin-top:16px' }, ['自动锁定']),
          el('p', {}, ['无操作 5 分钟，或退到后台 30 秒，自动锁定；不再提供手动锁按钮。']),
          el('h3', { style: 'margin-top:16px' }, ['文件']),
          el('p', {}, ['ledger 只存 ID 与整数分；dict 存名字/简码/极性/域/树。改名只改 dict，历史流水不动。加密：PBKDF2-SHA-256 150,000 → AES-GCM-256。']),
        ]),
      ]);
      const update = button(app.getState().lang === 'en' ? 'Update' : '更新', 'btn-primary', async () => {
        update.disabled = true;
        const old = update.textContent;
        update.textContent = app.getState().lang === 'en' ? 'Updating…' : '更新中…';
        try {
          if (navigator.serviceWorker) {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg) {
              await reg.update().catch(() => {});
              if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              await new Promise((resolve) => setTimeout(resolve, 500));
            }
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'reload' }).catch(() => {});
          location.reload();
        } catch (e) {
          update.disabled = false;
          update.textContent = old;
        }
      });
      update.title = app.getState().lang === 'en'
        ? 'Check and switch to the latest version'
        : '检查并切换到最新版本';
      open('帮助与协议', help, closeFoot([
        el('span', { class: 'help-text' }, ['TxtVein · 纯文本双极账本']),
        update,
      ]));
    }

    function shortcut(k, v) {
      return el('div', { class: 'shortcut-row' }, [el('span', {}, [k]), el('span', {}, [v])]);
    }

    /* ---------------- 改密码 ---------------- */

    function showPassword(app) {
      const oldPw = input({ type: 'password', placeholder: '当前密码' });
      const newPw = input({ type: 'password', placeholder: '新密码（至少 4 位）' });
      const pw2 = input({ type: 'password', placeholder: '再输一次' });
      const hint = input({ type: 'text', placeholder: '密码提示（可选）' });
      hint.value = TV.store && TV.store.readHint ? TV.store.readHint() : '';
      const error = el('div', { class: 'form-error' });
      const submit = button('改密码并重新加密', 'btn-primary', async () => {
        if (newPw.value.length < 4) { error.textContent = '新密码至少 4 位'; return; }
        if (newPw.value !== pw2.value) { error.textContent = '两次新密码不一致'; return; }
        const r = await app.changePassword(oldPw.value, newPw.value, hint.value);
        if (!r.ok) { error.textContent = r.error; return; }
        toast('主密码已更换；旧密码失效', 'ok');
        close();
      });
      open('安全 · 修改主密码', [
        field('当前密码', oldPw),
        el('div', { class: 'form-row' }, [field('新密码', newPw), field('确认', pw2)]),
        field('提示语（可选）', hint),
        error,
        el('p', { class: 'help-text' }, ['会用新盐、新 IV、新密钥重新加密整本账。旧密码立即失效。']),
      ], closeFoot([submit]));
    }

    /* ---------------- 确认框 ---------------- */

    function confirm(app, title, text, onOk, danger) {
      const ok = button('确认', danger === false ? 'btn-primary' : 'btn-danger', () => {
        close();
        onOk && onOk();
      });
      open(title || '确认', [
        el('p', { class: 'help-text', style: 'font-size:12px;color:var(--text-2);line-height:1.8' }, [text || '']),
      ], closeFoot([ok]));
    }

    return {
      open,
      close,
      toast,
      showRules,
      showDict,
      nodeForm,
      tagForm,
      showText,
      showExport,
      showImport,
      showHelp,
      showPassword,
      confirm,
    };
  }

<script>

 */
(function (root) {

  const LABELS = {
