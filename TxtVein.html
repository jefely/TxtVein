<script>
/* js/core/rules.js */
/* TxtVein · 规则层
 * 周期规则（PLAN）：*d / *m / *y，到期生成真实流水，只推进 last_run。
 * 事件规则（RULES）：关键字 + 金额条件 → 预测式录入模板。
 *
 * 规则本身也是纯文本，存在 ledger.txt 末尾的 [PLAN] / [RULES] 区块里。
 * 取消规则只改状态，历史流水一行不动。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const date = TV.date || (typeof require === 'function' ? require('./date.js') : null);
  const amount = TV.amount || (typeof require === 'function' ? require('./amount.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);

  const STATUS = ['active', 'canceled'];

  function periodLabel(p) {
    return p === 'd' ? '每天' : p === 'm' ? '每月' : p === 'y' ? '每年' : p;
  }

  function parsePlanLine(line, index) {
    const raw = S(line).trim();
    if (!raw || raw.startsWith('#')) return null;
    const m = raw.match(/^(\S+)\s+(active|canceled)\s*:\s*(\S*)\s+(\S+)\s*>\s*(\S+)\s+(\d+)\s*(.*)$/i);
    if (!m) return { error: '无法解析计划行：' + raw, raw, line: index };
    const rest = m[7] || '';
    let period = '';
    let lastRun = '';
    const tagIds = [];
    let name = '';
    rest.split(/[\s\u3000]+/).filter(Boolean).forEach((tok) => {
      if (/^\*[dmy]$/i.test(tok)) { period = tok.slice(1).toLowerCase(); return; }
      if (/^last_run=/i.test(tok)) { lastRun = tok.split('=')[1] || ''; return; }
      if (/^name=/i.test(tok)) { name = decodeURIComponent(tok.slice(5)); return; }
      if (/^T_[A-Za-z0-9_]+$/.test(tok)) { tagIds.push(tok); return; }
    });
    if (!period) return { error: '计划缺少周期 *d/*m/*y：' + raw, raw, line: index };
    const d = date.parseDate(lastRun || '');
    return {
      ok: true,
      id: m[1],
      status: m[2].toLowerCase(),
      flags: m[3] || '',
      from: m[4],
      to: m[5],
      amountCents: Number(m[6]),
      period,
      tagIds,
      name,
      lastRun: d.ok ? d.stamp : '',
      start: d.ok ? d.stamp : '',
      raw,
      line: index,
    };
  }

  function serializePlan(plan) {
    const p = plan || {};
    const tagPart = (p.tagIds || []).join(' ');
    const nm = p.name ? ' name=' + (/[\s\u3000]/.test(p.name) ? encodeURIComponent(p.name) : p.name) : '';
    return [
      p.id || 'R_???',
      (p.status || 'active') + ':',
      '0',
      p.from,
      '>',
      p.to,
      String(Math.round(Number(p.amountCents) || 0)),
      tagPart,
      '*' + (p.period || 'm'),
      p.lastRun ? 'last_run=' + p.lastRun : '',
      nm.trim(),
    ].filter(Boolean).join(' ');
  }

  function parseRuleLine(line, index) {
    const raw = S(line).trim();
    if (!raw || raw.startsWith('#')) return null;
    const arrow = raw.indexOf('->');
    if (arrow < 0) return { error: '规则缺少 ->：' + raw, raw, line: index };
    const head = raw.slice(0, arrow).trim();
    const tail = raw.slice(arrow + 2).trim();
    const hm = head.match(/^(\S+)\s+(active|canceled)\s*:\s*(.*)$/i);
    if (!hm) return { error: '无法解析规则头：' + raw, raw, line: index };
    const cond = hm[3] || '';
    const flow = tail.match(/^(\S+)\s*>\s*(\S+)(?:\s+(.*))?$/);
    if (!flow) return { error: '规则右侧不是 A > B：' + raw, raw, line: index };
    const rest = flow[3] || '';
    let tags = [];
    let name = '';
    rest.split(/[\s\u3000]+/).filter(Boolean).forEach((tok) => {
      if (/^tags=/i.test(tok)) {
        tags = tok.slice(5).split(',').map((x) => x.trim()).filter(Boolean);
      } else if (/^name=/i.test(tok)) {
        name = decodeURIComponent(tok.slice(5));
      }
    });
    const keywords = [];
    let amountOp = '';
    let amountCents = 0;
    const km = cond.match(/keywords\s*=\s*\(([^)]*)\)/i);
    if (km) {
      km[1].split('|').map((x) => x.trim()).filter(Boolean).forEach((x) => {
        keywords.push(x.replace(/^[#T_]+/, ''));
      });
    }
    const am = cond.match(/amount\s*([<>=])\s*(\d+(?:\.\d+)?[kK]?)/);
    if (am) {
      amountOp = am[1];
      const q = amount.parseAmount(am[2]);
      amountCents = q.ok ? q.cents : 0;
    }
    return {
      ok: true,
      id: hm[1],
      status: hm[2].toLowerCase(),
      condition: cond,
      keywords,
      amountOp,
      amountCents,
      from: flow[1],
      to: flow[2],
      tagIds: tags,
      name,
      raw,
      line: index,
    };
  }

  function serializeRule(rule) {
    const r = rule || {};
    const kw = (r.keywords || []).join('|');
    const cond = 'keywords=(' + kw + ')'
      + (r.amountOp ? '&amount' + r.amountOp + (Number(r.amountCents) / 100) : '');
    const tags = (r.tagIds || []).length ? ' tags=' + r.tagIds.join(',') : '';
    const name = r.name ? ' name=' + (/[\s\u3000]/.test(r.name) ? encodeURIComponent(r.name) : r.name) : '';
    return (r.id || 'R_???') + ' ' + (r.status || 'active') + ': ' + cond
      + ' -> ' + r.from + ' > ' + r.to + tags + name;
  }

  function parseBlocks(source) {
    const lines = S(source).replace(/\r\n?/g, '\n').split('\n');
    const plans = [];
    const rules = [];
    const warnings = [];
    let section = '';
    lines.forEach((line, i) => {
      const s = line.trim();
      if (!s || s.startsWith('#')) return;
      const sec = s.match(/^\[(PLAN|RULES?)\]$/i);
      if (sec) {
        section = sec[1].toUpperCase().startsWith('PLAN') ? 'plan' : 'rule';
        return;
      }
      if (section === 'plan') {
        const p = parsePlanLine(s, i);
        if (!p) return;
        if (p.error) warnings.push(p.error);
        else plans.push(p);
      } else if (section === 'rule') {
        const r = parseRuleLine(s, i);
        if (!r) return;
        if (r.error) warnings.push(r.error);
        else rules.push(r);
      }
    });
    return { plans, rules, warnings };
  }

  function serializeBlocks(plans, rules) {
    const out = [];
    if ((plans || []).length) {
      out.push('[PLAN]');
      plans.forEach((p) => out.push(serializePlan(p)));
    }
    if ((rules || []).length) {
      out.push('[RULES]');
      rules.forEach((r) => out.push(serializeRule(r)));
    }
    return out.join('\n');
  }

  function upsertPlan(plans, plan) {
    const arr = plans || [];
    const i = arr.findIndex((x) => x.id === plan.id);
    if (i >= 0) arr[i] = Object.assign({}, arr[i], plan);
    else arr.push(plan);
    return arr;
  }

  function nextDue(plan, now) {
    if (!plan || plan.status !== 'active') return '';
    const base = plan.lastRun || plan.start;
    if (!base) return '';
    const next = date.addPeriod(base, plan.period, 1);
    if (!next) return '';
    const today = date.todayStamp(now);
    return next <= today ? next : next;
  }

  function isDue(plan, now) {
    const next = nextDue(plan, now);
    return !!next && next <= date.todayStamp(now);
  }

  /**
   * 到期生成真实流水。
   * 返回的 events 还没有 id；由 app 统一分配 E_xxx。
   */
  function runDuePlans(dict, plans, now, opts) {
    const o = opts || {};
    const today = date.todayStamp(now);
    const generated = [];
    let changed = false;
    const max = o.max || 120;
    (plans || []).forEach((plan) => {
      if (!plan || plan.status !== 'active') return;
      let guard = 0;
      let next = date.addPeriod(plan.lastRun || plan.start, plan.period, 1);
      while (next && next <= today && guard < max) {
        generated.push({
          domain: plan.domain || 'P',
          date: next,
          from: plan.from,
          to: plan.to,
          amountCents: Math.round(Number(plan.amountCents) || 0),
          minutes: 0,
          tagIds: (plan.tagIds || []).slice(),
          chainId: '',
          planId: plan.id,
          raw: '[plan ' + plan.id + ']',
          crossDomain: !!(dict && dict.nodes[plan.from] && dict.nodes[plan.to]
            && dict.nodes[plan.from].domain !== dict.nodes[plan.to].domain),
        });
        plan.lastRun = next;
        changed = true;
        next = date.addPeriod(next, plan.period, 1);
        guard += 1;
      }
    });
    return { events: generated, plans, generated: generated.length, changed };
  }

  function cancelPlan(plans, id) {
    const p = (plans || []).find((x) => x.id === id);
    if (!p) return { ok: false, error: '规则不存在：' + id };
    p.status = 'canceled';
    p.updatedAt = new Date().toISOString();
    return { ok: true, plan: p };
  }

  function resumePlan(plans, id) {
    const p = (plans || []).find((x) => x.id === id);
    if (!p) return { ok: false, error: '规则不存在：' + id };
    p.status = 'active';
    p.updatedAt = new Date().toISOString();
    return { ok: true, plan: p };
  }

  function guessAmountCents(input) {
    const tokens = S(input).split(/[\s\u3000]+/);
    for (const tok of tokens) {
      const q = amount.parseQuantity(tok);
      if (q.ok && q.unit === 'money') return q.cents;
    }
    return 0;
  }

  function matchRule(rule, input, cents) {
    if (!rule || rule.status !== 'active') return false;
    const s = S(input);
    if (!rule.keywords || !rule.keywords.length) return false;
    const hit = rule.keywords.some((k) => s.includes(k));
    if (!hit) return false;
    if (rule.amountOp && rule.amountCents) {
      const v = Number(cents) || guessAmountCents(s);
      if (rule.amountOp === '<' && !(v < rule.amountCents)) return false;
      if (rule.amountOp === '>' && !(v > rule.amountCents)) return false;
      if (rule.amountOp === '=' && v !== rule.amountCents) return false;
    }
    return true;
  }

  function templateOf(rule, dict) {
    const code = (id) => {
      const n = dict && dict.nodes[id];
      return n ? (n.zh_code || n.en_code || id) : id;
    };
    const tags = (rule.tagIds || [])
      .map((id) => (dict && dict.tags[id] ? dict.tags[id].zh_name : id))
      .filter(Boolean);
    const base = code(rule.from) + ' > ' + code(rule.to) + ' ' + (Number(rule.amountCents) / 100);
    const tagPart = tags.concat(rule.name ? [rule.name] : []).map((x) => ' < ' + x).join('');
    return base + tagPart;
  }

  function predict(input, rules, dict) {
    const cents = guessAmountCents(input);
    const hits = (rules || []).filter((r) => matchRule(r, input, cents));
    return hits.map((r) => ({ rule: r, text: templateOf(r, dict) }));
  }

  function summarize(plans) {
    const active = (plans || []).filter((p) => p.status === 'active');
    const canceled = (plans || []).filter((p) => p.status === 'canceled');
    const monthly = active.filter((p) => p.period === 'm')
      .reduce((s, p) => s + (Number(p.amountCents) || 0), 0);
    return { active: active.length, canceled: canceled.length, monthlyCents: monthly };
  }

  TV.rules = {
    STATUS,
    periodLabel,
    parsePlanLine,
    serializePlan,
    parseRuleLine,
    serializeRule,
    parseBlocks,
    serializeBlocks,
    upsertPlan,
    nextDue,
    isDue,
    runDuePlans,
    cancelPlan,
    resumePlan,
    guessAmountCents,
    matchRule,
    templateOf,
    predict,
    summarize,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.rules;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* js/core/report.js */
/* TxtVein · 报表层（派生视图，绝不落盘）
 * 双极四列 / 多域合并 / 时间代币 / 增益阻抑 / 能量审计 / 链式因果。
 * 所有数字都来自 calc.compute；这里只做分组、排版和文案。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const amount = TV.amount || (typeof require === 'function' ? require('./amount.js') : null);
  const date = TV.date || (typeof require === 'function' ? require('./date.js') : null);
  const calcMod = TV.calc || (typeof require === 'function' ? require('./calc.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);
  const domainMod = TV.domain || (typeof require === 'function' ? require('./domain.js') : null);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);

  const TYPE_ORDER = ['费用', '收入', '资产', '负债', '成本', '权益'];

  function resolveRange(range, now) {
    if (range && range.start && range.end) return range;
    if (typeof range === 'string') {
      const r = date.parseRange(range, now);
      return r.ok ? r : date.parseRange('', now);
    }
    return date.parseRange('', now);
  }

  function eventInRange(e, range) {
    if (!range || !range.start) return true;
    return S(e.date) >= range.start && S(e.date) <= range.end;
  }

  function nodeLabel(dict, id, lang) {
    return dictMod.renderNode(dict, id, 'PLAIN', lang || 'zh');
  }

  function buildReport(dict, events, opts) {
    const o = opts || {};
    const lang = o.lang || 'zh';
    const range = resolveRange(o.range, o.now);
    const calc = calcMod.compute(dict, events, { range, domain: o.domain || '', now: o.now });

    const byType = new Map();
    TYPE_ORDER.forEach((t) => byType.set(t, []));
    calc.rows.forEach((r) => {
      if (!byType.has(r.node.type)) byType.set(r.node.type, []);
      byType.get(r.node.type).push(r);
    });

    const types = TYPE_ORDER.map((type) => {
      const info = dictMod.TYPES[type];
      const rows = (byType.get(type) || []).slice().sort((a, b) => Math.abs(b.closing) - Math.abs(a.closing));
      const totals = { opening: 0, inc: 0, dec: 0, closing: 0, count: 0 };
      rows.forEach((r) => {
        totals.opening += r.opening;
        totals.inc += r.inc;
        totals.dec += r.dec;
        totals.closing += r.closing;
        totals.count += r.count;
      });
      const outRows = rows.map((r) => ({
        id: r.id,
        name: nodeLabel(dict, r.id, lang),
        en_name: dict.nodes[r.id] ? dict.nodes[r.id].en_name : '',
        code: dict.nodes[r.id] ? dictMod.displayCode(dict, r.id, lang) : '',
        type,
        pole: info.pole,
        form: dict.nodes[r.id] ? dict.nodes[r.id].form : info.form,
        system: !!(dict.nodes[r.id] && dict.nodes[r.id].system),
        domain: dict.nodes[r.id] ? dict.nodes[r.id].domain : 'P',
        balance: r.closing,
        opening: r.opening,
        inc: r.inc,
        dec: r.dec,
        closing: r.closing,
        count: r.count,
        share: totals.closing !== 0 ? r.closing / totals.closing : 0,
      }));
      return {
        type,
        pole: info.pole,
        en: info.en,
        form: info.form,
        hint: info.hint,
        rows: outRows,
        totals,
        empty: outRows.length === 0,
      };
    });

    const inflow = calc.totals.A.inc + calc.totals.B.inc;
    const outflow = calc.totals.A.dec + calc.totals.B.dec;
    const headline = {
      aBalance: calc.totals.A.closing,
      bBalance: calc.totals.B.closing,
      netWorth: calc.adjustedNet,
      rawNetWorth: calc.netWorth,
      crossNetDelta: calc.crossNetDelta,
      inflow,
      outflow,
      flowCents: calc.flowCents,
      crossDomainCents: calc.crossDomainCents,
      rangeCount: calc.rangeCount,
      timeMinutes: calc.timeMinutes,
      invariant: calc.balanced,
      unbalanced: calc.unbalanced,
      nodeCount: calc.nodeCount,
    };

    const gainByNode = new Map();
    const suppressByNode = new Map();
    const darkByNode = new Map();
    const addMap = (map, id, cents) => {
      if (!id) return;
      map.set(id, (map.get(id) || 0) + cents);
    };
    (events || []).forEach((e) => {
      if (!eventInRange(e, range)) return;
      const cents = Math.round(Number(e.amountCents) || 0);
      if (!cents) return;
      const tags = Array.isArray(e.tagIds) ? e.tagIds : [];
      const from = dict.nodes[e.from];
      const to = dict.nodes[e.to];
      if (!from || !to) return;
      const target = to.polarity === 'A' ? e.to : e.from;
      let hasEnergyTag = false;
      tags.forEach((tid) => {
        const tag = dict.tags[tid];
        if (!tag) return;
        if (tag.kind === 'gain') { addMap(gainByNode, target, cents); hasEnergyTag = true; }
        if (tag.kind === 'suppress') { addMap(suppressByNode, target, cents); hasEnergyTag = true; }
      });
      if (!hasEnergyTag && !tags.length && from.polarity === 'A') addMap(darkByNode, e.from, cents);
    });

    const topNodes = (map, limit) => Array.from(map.entries())
      .map(([id, cents]) => ({ id, name: nodeLabel(dict, id, lang), cents }))
      .sort((a, b) => b.cents - a.cents)
      .slice(0, limit || 6);

    const energy = {
      gainCents: calc.gainCents,
      suppressCents: calc.suppressCents,
      unlabeledOutflow: calc.unlabeledOutflow,
      gainNodes: topNodes(gainByNode),
      suppressNodes: topNodes(suppressByNode),
      darkNodes: topNodes(darkByNode),
      gainRatio: calc.flowCents ? calc.gainCents / calc.flowCents : 0,
      suppressRatio: calc.flowCents ? calc.suppressCents / calc.flowCents : 0,
    };

    const tagRows = calc.tagRows.map((t) => ({
      id: t.id,
      name: lang === 'en' ? (t.tag.en_name || t.tag.zh_name) : (t.tag.zh_name || t.tag.en_name),
      kind: t.tag.kind || 'plain',
      domain: t.tag.domain || 'P',
      amountCents: t.amountCents,
      count: t.count,
      share: calc.flowCents ? t.amountCents / calc.flowCents : 0,
    }));

    const timeRows = calc.timeByNode
      .map((x) => ({
        id: x.id,
        name: nodeLabel(dict, x.id, lang),
        minutes: x.minutes,
        share: calc.timeMinutes ? x.minutes / calc.timeMinutes : 0,
      }))
      .sort((a, b) => b.minutes - a.minutes);

    const chains = calc.chains.map((ch) => {
      const nodes = [];
      ch.events.forEach((e) => {
        if (!nodes.includes(e.from)) nodes.push(e.from);
        if (!nodes.includes(e.to)) nodes.push(e.to);
      });
      const evs = ch.events.map((e) => ({
        date: e.date,
        from: e.from,
        to: e.to,
        fromName: nodeLabel(dict, e.from, lang),
        toName: nodeLabel(dict, e.to, lang),
        amountCents: e.amountCents,
        minutes: e.minutes,
        diff: e.diff || '',
      }));
      return {
        id: ch.id,
        nodes: nodes.map((id) => nodeLabel(dict, id, lang)),
        events: evs,
        totalCents: ch.totalCents,
      };
    });

    const domains = calc.domains.map((d) => ({
      domain: d.domain,
      label: domainMod.label(d.domain, lang),
      flowCents: d.flowCents,
      count: d.count,
      inCents: d.inCents,
      outCents: d.outCents,
      bookedCents: d.bookedCents,
      crossCents: d.crossCents,
    }));

    const crossAll = (events || []).filter((e) => eventInRange(e, range)
      && dict.nodes[e.from] && dict.nodes[e.to]
      && dict.nodes[e.from].domain !== dict.nodes[e.to].domain);
    const consolidated = {
      flowCents: calc.flowCents,
      internalCents: calc.crossDomainCents,
      externalCents: calc.flowCents - calc.crossDomainCents,
      crossCount: crossAll.length,
      offsetApplied: calc.crossDomainCents > 0,
    };

    const crossEvents = crossAll.slice(-12).map((e) => ({
      date: e.date,
      fromName: nodeLabel(dict, e.from, lang),
      toName: nodeLabel(dict, e.to, lang),
      fromDomain: dict.nodes[e.from].domain,
      toDomain: dict.nodes[e.to].domain,
      amountCents: e.amountCents,
    }));

    return {
      ok: true,
      range,
      rangeLabel: range.label,
      domain: o.domain || '',
      lang,
      types,
      headline,
      energy,
      tags: tagRows,
      time: { totalMinutes: calc.timeMinutes, rows: timeRows },
      chains,
      domains,
      consolidated,
      crossEvents,
      issues: (calc.issues || []).slice(),
      generatedAt: new Date().toISOString(),
    };
  }

  function reportToText(report) {
    if (!report || !report.ok) return '';
    const h = report.headline;
    const lines = [];
    lines.push('TXTVAIN // REPORT');
    lines.push(report.rangeLabel + ' · ' + h.rangeCount + ' 笔 · ' + h.nodeCount + ' 个节点'
      + (h.invariant ? ' · 双极守恒 ✓' : ' · 双极不守恒 ✗'));
    lines.push('A 极 ' + amount.formatPlain(h.aBalance)
      + '   B 极 ' + amount.formatPlain(h.bBalance)
      + '   净额 ' + amount.formatPlain(h.netWorth)
      + '   流入 ' + amount.formatPlain(h.inflow)
      + '   流出 ' + amount.formatPlain(h.outflow));
    if (report.consolidated.offsetApplied) {
      lines.push('合并视角：内部跨域划拨 ' + amount.formatPlain(report.consolidated.internalCents)
        + ' 已单列；真正对外 ' + amount.formatPlain(report.consolidated.externalCents));
    }
    lines.push('');

    for (const t of report.types) {
      lines.push('[' + t.type + '] · ' + t.pole + ' 极 · ' + t.hint);
      if (!t.rows.length) {
        lines.push('  （无）');
        lines.push('');
        continue;
      }
      const nameW = Math.min(28, Math.max(8, ...t.rows.map((r) => text.textWidth(r.name))) + 2);
      const numW = 14;
      lines.push(
        text.padEndWidth('名称', nameW)
        + text.padStartWidth('期末', numW)
        + text.padStartWidth('本期增加', numW)
        + text.padStartWidth('本期减少', numW)
        + text.padStartWidth('期初', numW)
      );
      t.rows.forEach((r) => {
        lines.push(
          text.padEndWidth(r.name + (r.system ? '·S' : ''), nameW)
          + text.padStartWidth(amount.formatPlain(r.closing), numW)
          + text.padStartWidth(amount.formatPlain(r.inc), numW)
          + text.padStartWidth(amount.formatPlain(r.dec), numW)
          + text.padStartWidth(amount.formatPlain(r.opening), numW)
        );
      });
      lines.push(
        text.padEndWidth('合计', nameW)
        + text.padStartWidth(amount.formatPlain(t.totals.closing), numW)
        + text.padStartWidth(amount.formatPlain(t.totals.inc), numW)
        + text.padStartWidth(amount.formatPlain(t.totals.dec), numW)
        + text.padStartWidth(amount.formatPlain(t.totals.opening), numW)
      );
      lines.push('');
    }

    lines.push('[能量]');
    lines.push('增益 ' + amount.formatPlain(report.energy.gainCents)
      + '   阻抑 ' + amount.formatPlain(report.energy.suppressCents)
      + '   无标签流失 ' + amount.formatPlain(report.energy.unlabeledOutflow));
    report.energy.gainNodes.slice(0, 4).forEach((x) => {
      lines.push('  + ' + x.name + ' ' + amount.formatPlain(x.cents));
    });
    report.energy.suppressNodes.slice(0, 4).forEach((x) => {
      lines.push('  − ' + x.name + ' ' + amount.formatPlain(x.cents));
    });
    lines.push('');

    if (report.time.totalMinutes > 0) {
      lines.push('[时间代币] 共 ' + report.time.totalMinutes + 'm');
      report.time.rows.slice(0, 6).forEach((x) => {
        lines.push('  ' + x.name + ' ' + x.minutes + 'm');
      });
      lines.push('');
    }

    if (report.chains.length) {
      lines.push('[链式因果]');
      report.chains.slice(0, 8).forEach((ch) => {
        lines.push('  ' + ch.id + '  ' + ch.nodes.join(' > ') + '  ' + amount.formatPlain(ch.totalCents));
      });
      lines.push('');
    }

    lines.push('[域]');
    report.domains.forEach((d) => {
      lines.push('  ' + d.label + ' · ' + d.count + ' 笔 · 记入 ' + amount.formatPlain(d.bookedCents)
        + ' · 跨域 ' + amount.formatPlain(d.crossCents));
    });
    return lines.join('\n');
  }

  TV.report = {
    TYPE_ORDER,
    resolveRange,
    buildReport,
    reportToText,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.report;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/core/ledger-file.js */
/* TxtVein · 流水文本（ledger）
 * 纯文本唯一事实源。每行一笔原子转移，只写 ID：
 *
 *   # TxtVein ledger · 纯文本唯一事实源
 *   # FORMAT: 1
 *   # VAULT_ID: 8a2b1c3d
 *   # LINK: <字典 SHA-256>
 *   P 261110 N_001 > N_002 3500 T_01
 *   P 261110 N_001 > N_002 60m T_time
 *   [PLAN]
 *   R_001 active: 0 N_001 > N_002 100000 *m last_run=261110
 *   [RULES]
 *   R_001 active: keywords=(外卖)&amount<10000 -> N_001 > N_002 tags=T_01 name=外卖
 *
 * 哈希互锁：LINK 行本身不参与哈希，否则两边互为哈希会形成死循环。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);
  const date = TV.date || (typeof require === 'function' ? require('./date.js') : null);
  const amount = TV.amount || (typeof require === 'function' ? require('./amount.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);
  const rulesMod = TV.rules || (typeof require === 'function' ? require('./rules.js') : null);

  const HEADER = '# TxtVein ledger · 纯文本唯一事实源';
  const FORMAT = '1';
  const EVENT_RE = /^(?:\[([PFCH])\]|([PFCH]))\s+(\d{6})\s+(\S+)\s*>\s*(\S+)\s+(\S+)\s*(.*)$/;
  const TAG_RE = /^T_[A-Za-z0-9_]+$/;
  const CHAIN_RE = /^C_[A-Za-z0-9_]+$/;

  function eventLine(event) {
    const parts = [
      event.domain || 'P',
      event.date,
      event.from,
      '>',
      event.to,
      event.minutes > 0 ? amount.formatMinutes(event.minutes) : String(Math.round(Number(event.amountCents) || 0)),
    ];
    (event.tagIds || []).forEach((id) => parts.push(id));
    if (event.chainId) parts.push('^' + event.chainId);
    return parts.join(' ');
  }

  function serializeLedger(state) {
    const s = state || {};
    const lines = [
      HEADER,
      '# FORMAT: ' + FORMAT,
      '# VAULT_ID: ' + S(s.vaultId),
      '# LINK: ' + S(s.link),
      '# 域: P 个人 / F 家庭 / C 公司 / H 合伙',
      '# 金额: 整数分；60m 为时间代币；标签为 T_ID',
    ];
    (s.events || []).forEach((e) => lines.push(eventLine(e)));
    const blocks = rulesMod.serializeBlocks(s.plans || [], s.rules || []);
    if (blocks) {
      lines.push(blocks);
    }
    return lines.join('\n') + '\n';
  }

  function parseMeta(lines) {
    const meta = { format: '', vaultId: '', link: '' };
    lines.forEach((line) => {
      const m = S(line).match(/^#\s*([A-Za-z_]+)\s*:\s*(.*)$/);
      if (!m) return;
      const key = m[1].toUpperCase();
      if (key === 'FORMAT') meta.format = m[2].trim();
      if (key === 'VAULT_ID') meta.vaultId = m[2].trim();
      if (key === 'LINK') meta.link = m[2].trim();
    });
    return meta;
  }

  function parseLedger(src, opts) {
    const o = opts || {};
    const raw = text.normalize(src);
    const lines = raw.split('\n');
    const meta = parseMeta(lines);
    const events = [];
    const warnings = [];
    let section = '';
    let index = 0;

    lines.forEach((line, lineNo) => {
      const s = line.trim();
      if (!s) return;
      const sec = s.match(/^\[(PLAN|RULES?)\]$/i);
      if (sec) {
        section = sec[1].toUpperCase().startsWith('PLAN') ? 'plan' : 'rule';
        return;
      }
      if (s.startsWith('#')) return;
      if (section === 'plan' || section === 'rule') return; /* 交给 rules.parseBlocks */
      const m = s.match(EVENT_RE);
      if (!m) {
        warnings.push('第 ' + (lineNo + 1) + ' 行不是合法流水：' + s);
        return;
      }
      const tagIds = [];
      let chainId = '';
      const extras = (m[7] || '').split(/[\s\u3000]+/).filter(Boolean);
      extras.forEach((tok) => {
        if (TAG_RE.test(tok)) { tagIds.push(tok); return; }
        if (tok.startsWith('^') && CHAIN_RE.test(tok.slice(1))) { chainId = tok.slice(1); return; }
        warnings.push('第 ' + (lineNo + 1) + ' 行有未知标记：' + tok);
      });
      const isTime = amount.isTimeToken(m[6]);
      let cents = 0;
      let mins = 0;
      if (isTime) {
        const q = amount.parseTime(m[6]);
        if (!q.ok) {
          warnings.push('第 ' + (lineNo + 1) + ' 行时间无法解析：' + m[6]);
          return;
        }
        mins = q.minutes;
      } else {
        cents = Math.round(Number(m[6]) || 0);
        if (!Number.isSafeInteger(cents) || cents <= 0) {
          warnings.push('第 ' + (lineNo + 1) + ' 行金额（分）不合法：' + m[6]);
          return;
        }
      }
      events.push({
        id: 'E_' + String(index + 1).padStart(4, '0'),
        domain: m[1] || m[2],
        date: m[3],
        from: m[4],
        to: m[5],
        amountCents: cents,
        minutes: mins,
        tagIds,
        chainId,
        raw: s,
        line: lineNo + 1,
      });
      index += 1;
    });

    const blocks = rulesMod.parseBlocks(raw);
    warnings.push.apply(warnings, blocks.warnings || []);

    const issues = validateLedger(o.dict, events, blocks.plans);
    return {
      ok: true,
      meta,
      vaultId: meta.vaultId,
      link: meta.link,
      events,
      plans: blocks.plans,
      rules: blocks.rules,
      warnings,
      issues,
      raw,
    };
  }

  function validateLedger(dict, events, plans) {
    const issues = [];
    const add = (level, code, message, ref) => issues.push({ level, code, message, ref: ref || '' });
    (events || []).forEach((e, i) => {
      if (!/^\d{6}$/.test(e.date) || !date.parseDate(e.date).ok) add('error', 'EVENT_DATE', '第 ' + (i + 1) + ' 笔日期不合法：' + e.date);
      if (!(e.amountCents > 0) && !(e.minutes > 0)) add('error', 'EVENT_AMOUNT', '第 ' + (i + 1) + ' 笔金额/时间必须大于 0');
      if (!dict) return;
      if (!dict.nodes[e.from]) add('error', 'EVENT_FROM', '第 ' + (i + 1) + ' 笔转出节点不存在：' + e.from);
      if (!dict.nodes[e.to]) add('error', 'EVENT_TO', '第 ' + (i + 1) + ' 笔转入节点不存在：' + e.to);
      (e.tagIds || []).forEach((tid) => {
        if (!dict.tags[tid]) add('warn', 'EVENT_TAG', '第 ' + (i + 1) + ' 笔标签不存在：' + tid);
      });
    });
    (plans || []).forEach((p) => {
      if (!p.from || !p.to) add('error', 'PLAN_NODE', '计划缺少节点：' + p.id);
      if (!(p.amountCents > 0)) add('error', 'PLAN_AMOUNT', '计划金额必须大于 0：' + p.id);

    const lines = text.normalize(src).split('\n');
    const next = lines.filter((line) => !/^#\s*LINK\s*:/i.test(line.trim()));
    let at = 0;

    FORMAT,
    eventLine,

    parseLedger,
    validateLedger,

    getVaultId,
    setLink,

<script>
/* js/core/dict-file.js */
/* TxtVein · 字典文本（dict.json）
 * 流水只存 ID；名字、简码、极性、域、树关系、别名全在这里。
 *
 * 哈希互锁：link 字段不参与自身哈希（否则互为哈希死循环）。
 * 规范化 JSON 用「键排序 + 无空格」的 canonical 形式，格式化差异不会破坏校验。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);

  function sortValue(v) {
    if (Array.isArray(v)) return v.map(sortValue);
    if (v && typeof v === 'object') {
      const out = {};
      Object.keys(v).sort().forEach((k) => { out[k] = sortValue(v[k]); });
      return out;
    }
    return v;
  }

  function canonicalJson(obj) {
    return JSON.stringify(sortValue(obj));
  }

  function bodyForHash(dict) {
    const copy = normalizeDict(dict);
    delete copy.link;
    return canonicalJson(copy) + '\n';
  }

  function normalizeDict(dict) {
    const src = dict && typeof dict === 'object' ? dict : {};
    const out = {
      format: 'txtvein-dict',
      version: 1,
      vaultId: S(src.vaultId || src.vault_id || ''),
      link: S(src.link || ''),
      meta: Object.assign({}, src.meta || {}),
      nodes: {},
      tags: {},
      behaviors: {},
      aliases: {},
    };
    Object.keys(src.nodes || {}).forEach((id) => {
      if (!/^N_[A-Za-z0-9_]+$/.test(id)) return;
      out.nodes[id] = normalizeNode(id, src.nodes[id]);
    });
    Object.keys(src.tags || {}).forEach((id) => {
      if (!/^T_[A-Za-z0-9_]+$/.test(id)) return;
      out.tags[id] = normalizeTag(id, src.tags[id]);
    });
    Object.keys(src.behaviors || {}).forEach((id) => {
      if (!/^H_[A-Za-z0-9_]+$/.test(id)) return;
      out.behaviors[id] = normalizeBehavior(id, src.behaviors[id]);
    });
    Object.keys(src.aliases || {}).forEach((k) => {
      const arr = src.aliases[k];
      if (!Array.isArray(arr)) return;
      const valid = Array.from(new Set(arr.filter((id) => out.nodes[id] || out.tags[id] || out.behaviors[id])));
      if (valid.length) out.aliases[k] = valid;
    });
    if (src.updatedAt) out.updatedAt = S(src.updatedAt);
    return out;
  }

  function serializeDict(dict) {
    return JSON.stringify(normalizeDict(dict), null, 2) + '\n';
  }

  function normalizeNode(id, raw) {
    const n = raw && typeof raw === 'object' ? raw : {};
    let type = n.type || '';
    let pole = S(n.polarity).toUpperCase();
    if (!type && pole) type = pole === 'A' ? '资产' : '权益';
    const t = dictMod.normalizeType(type);
    if (!t.ok && pole) type = pole === 'A' ? '资产' : '权益';
    const tt = dictMod.normalizeType(type);
    const domain = dictMod.isDomain(n.domain) ? S(n.domain).toUpperCase() : 'P';
    return {
      zh_name: S(n.zh_name || n.name || id),
      en_name: S(n.en_name || n.name || n.zh_name || id),
      zh_code: S(n.zh_code || n.code || ''),
      en_code: S(n.en_code || ''),
      polarity: tt.ok ? tt.pole : (pole === 'A' ? 'A' : 'B'),
      type: tt.ok ? tt.type : '资产',
      form: tt.pole === 'B' ? 'outside' : (n.form || tt.form || 'fluid'),
      domain,
      parent_id: S(n.parent_id || ''),
      weight: dictMod.normalizeWeight(n.weight, 100),
      system: !!n.system,
      created_at: S(n.created_at || ''),
    };
  }

  function normalizeTag(id, raw) {
    const t = raw && typeof raw === 'object' ? raw : {};
    return {
      zh_name: S(t.zh_name || t.name || id),
      en_name: S(t.en_name || t.name || t.zh_name || id),
      zh_code: S(t.zh_code || t.code || ''),
      en_code: S(t.en_code || ''),
      domain: dictMod.isDomain(t.domain) ? S(t.domain).toUpperCase() : 'P',
      parent_id: S(t.parent_id || ''),
      weight: dictMod.normalizeWeight(t.weight, 10),
      kind: t.kind || dictMod.tagKindOf(t.zh_name || id),
      created_at: S(t.created_at || ''),
    };
  }

  function normalizeBehavior(id, raw) {
    const h = raw && typeof raw === 'object' ? raw : {};
    return {
      zh_name: S(h.zh_name || h.name || id),
      en_name: S(h.en_name || h.name || h.zh_name || id),
      zh_code: S(h.zh_code || h.code || ''),
      en_code: S(h.en_code || ''),
      domain: dictMod.isDomain(h.domain) ? S(h.domain).toUpperCase() : 'P',
      parent_id: S(h.parent_id || ''),
      weight: dictMod.normalizeWeight(h.weight, 10),
      created_at: S(h.created_at || ''),
    };
  }

  function parseDict(src, opts) {
    const o = opts || {};
    let obj;
    try {
      obj = JSON.parse(text.normalize(src).trim());
    } catch (e) {
      return { ok: false, error: '字典不是合法 JSON：' + e.message };
    }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
      return { ok: false, error: '字典根必须是对象' };
    }
    if (obj.format && obj.format !== 'txtvein-dict') {
      return { ok: false, error: '不是 TxtVein 字典（format=' + obj.format + '）' };
    }
    const warnings = [];
    const dict = {
      format: 'txtvein-dict',
      version: 1,
      vaultId: S(obj.vaultId || obj.vault_id || ''),
      link: S(obj.link || ''),
      meta: Object.assign({}, obj.meta || {}),
      nodes: {},
      tags: {},
      behaviors: {},
      aliases: {},
    };
    /* 兼容早期版本误写在顶层的 updatedAt，否则哈希校验会因字段丢失而误报 */
    if (obj.updatedAt) dict.updatedAt = S(obj.updatedAt);
    const nodes = obj.nodes && typeof obj.nodes === 'object' ? obj.nodes : {};
    Object.keys(nodes).forEach((id) => {
      if (!/^N_[A-Za-z0-9_]+$/.test(id)) {
        warnings.push('节点 ID 不合规，已跳过：' + id);
        return;
      }
      dict.nodes[id] = normalizeNode(id, nodes[id]);
    });
    const tags = obj.tags && typeof obj.tags === 'object' ? obj.tags : {};
    Object.keys(tags).forEach((id) => {
      if (!/^T_[A-Za-z0-9_]+$/.test(id)) {
        warnings.push('标签 ID 不合规，已跳过：' + id);
        return;
      }
      dict.tags[id] = normalizeTag(id, tags[id]);
    });
    const behaviors = obj.behaviors && typeof obj.behaviors === 'object' ? obj.behaviors : {};
    Object.keys(behaviors).forEach((id) => {
      if (!/^H_[A-Za-z0-9_]+$/.test(id)) {
        warnings.push('行为项 ID 不合规，已跳过：' + id);
        return;
      }
      dict.behaviors[id] = normalizeBehavior(id, behaviors[id]);
    });
    const aliases = obj.aliases && typeof obj.aliases === 'object' ? obj.aliases : {};
    Object.keys(aliases).forEach((k) => {
      const arr = aliases[k];
      if (!Array.isArray(arr)) return;
      const valid = arr.filter((id) => dict.nodes[id] || dict.tags[id] || dict.behaviors[id]);
      if (valid.length) dict.aliases[k] = Array.from(new Set(valid));
      if (valid.length !== arr.length) warnings.push('别名 ' + k + ' 有失效目标，已清理');
    });
    dictMod.ensureMeta(dict);
    dictMod.bumpMeta(dict);
    if (!o.keepLink && !dict.link) warnings.push('字典没有 LINK 字段，无法与流水互锁');
    const normalized = normalizeDict(dict);
    const validation = dictMod.validateDict(normalized);
    return { ok: true, dict: normalized, warnings, issues: validation.issues };
  }

  function syncMeta(dict, events, plans) {
    dictMod.ensureMeta(dict);
    dictMod.bumpMeta(dict);
    const count = (events || []).length;
    dict.meta.nextEvent = Math.max(Number(dict.meta.nextEvent) || 1, count + 1);
    (plans || []).forEach((p) => {
      const m = S(p.id).match(/^R_(\d+)$/);
      if (m) dict.meta.nextRule = Math.max(Number(dict.meta.nextRule) || 1, Number(m[1]) + 1);
      if (m) dict.meta.nextPlan = Math.max(Number(dict.meta.nextPlan) || 1, Number(m[1]) + 1);
    });
    const chainMax = (events || []).reduce((max, e) => {
      const m = S(e.chainId).match(/^C_(\d+)$/);
      return m ? Math.max(max, Number(m[1])) : max;
    }, 0);
    dict.meta.nextChain = Math.max(Number(dict.meta.nextChain) || 1, chainMax + 1);
    dict.meta.updatedAt = new Date().toISOString();
    return dict;
  }

  function getLink(src) {
    const r = parseDict(src);
    return r.ok ? r.dict.link : '';
  }

  function setLink(src, hash) {
    const r = parseDict(src, { keepLink: true });
    if (!r.ok) return src;
    r.dict.link = S(hash);
    return serializeDict(r.dict);
  }

  function isDict(src) {
    const s = text.normalize(src).trim();
    if (!s.startsWith('{')) return false;
    try {
      const o = JSON.parse(s);
      return !!(o && (o.format === 'txtvein-dict' || o.nodes || o.aliases));
    } catch (e) {
      return false;
    }
  }

  function emptyText(vaultId) {
    return serializeDict(dictMod.emptyDict(vaultId));
  }

  TV.dictFile = {
    canonicalJson,
    bodyForHash,
    normalizeDict,
    serializeDict,
    parseDict,
    normalizeNode,
    normalizeTag,
    normalizeBehavior,
    syncMeta,
    getLink,
    setLink,
    isDict,
    emptyText,
    sortValue,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.dictFile;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* js/core/crypto.js */
/* TxtVein · 加密层
 * PBKDF2-SHA-256 150,000 → AES-GCM-256；盐 16B、IV 12B，每次加密换新 IV。
 * 密钥只在内存（不可导出）；本模块不碰浏览器存储、不碰 DOM。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});

  const PBKDF2_ITERATIONS = 150000;
  const SALT_BYTES = 16;
  const IV_BYTES = 12;
  const KEY_BITS = 256;

  function webcrypto() {
    const c = root.crypto;
    if (!c || !c.subtle) throw new Error('当前环境不支持 WebCrypto（请用 Chrome/Edge，或 Node 18+）');
    return c;
  }

  function supportsCrypto() {
    return !!(root.crypto && root.crypto.subtle && root.crypto.getRandomValues);
  }

  function randomBytes(n) {
    const len = Math.max(1, Number(n) || 1);
    const out = new Uint8Array(len);
    webcrypto().getRandomValues(out);
    return out;
  }

  function randomHex(bytes) {
    const arr = randomBytes(bytes || 4);
    return Array.from(arr).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function randomVaultId() {
    return randomHex(4);
  }

  function bytesToBase64(bytes) {
    const arr = new Uint8Array(bytes);
    let bin = '';
    const chunk = 0x8000;
    for (let i = 0; i < arr.length; i += chunk) {
      bin += String.fromCharCode.apply(null, arr.subarray(i, i + chunk));
    }
    if (typeof root.btoa === 'function') return root.btoa(bin);
    if (typeof Buffer !== 'undefined') return Buffer.from(arr).toString('base64');
    throw new Error('当前环境没有 base64 编码器');
  }

  function base64ToBytes(str) {
    const s = String(str == null ? '' : str).replace(/\s+/g, '');
    if (!s) return new Uint8Array(0);
    if (typeof root.atob === 'function') {
      const bin = root.atob(s);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    }
    if (typeof Buffer !== 'undefined') return new Uint8Array(Buffer.from(s, 'base64'));
    throw new Error('当前环境没有 base64 解码器');
  }

  function hexToBytes(hex) {
    const s = String(hex || '').replace(/[^0-9a-f]/gi, '');
    const out = new Uint8Array(Math.floor(s.length / 2));

  function bytesToHex(bytes) {
    return Array.from(new Uint8Array(bytes)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  async function sha256Hex(str) {
    const data = new TextEncoder().encode(String(str == null ? '' : str));
    const buf = await webcrypto().subtle.digest('SHA-256', data);
    return bytesToHex(new Uint8Array(buf));

  async function deriveKey(password, salt, iterations) {
    if (!password) throw new Error('密码不能为空');
    if (!salt || !salt.byteLength) throw new Error('盐不能为空');
    const iter = Number(iterations) || PBKDF2_ITERATIONS;
    const material = await webcrypto().subtle.importKey(
      'raw', new TextEncoder().encode(String(password)),
      { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return webcrypto().subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
      material,
      { name: 'AES-GCM', length: KEY_BITS },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function encryptData(key, plaintext) {
    if (!key) throw new Error('没有密钥');
    const iv = randomBytes(IV_BYTES);
    const buf = await webcrypto().subtle.encrypt(
      { name: 'AES-GCM', iv },
      key,
      new TextEncoder().encode(String(plaintext == null ? '' : plaintext))
    );
    return { iv, ciphertext: new Uint8Array(buf) };
  }

  async function decryptData(key, iv, ciphertext) {
    if (!key) throw new Error('没有密钥');
    if (!iv || !iv.byteLength) throw new Error('IV 不能为空');
    const buf = await webcrypto().subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    return new TextDecoder().decode(buf);

    const useSalt = salt || randomBytes(SALT_BYTES);
    const key = await deriveKey(password, useSalt, iterations || PBKDF2_ITERATIONS);
    const { iv, ciphertext } = await encryptData(key, plaintext);
    return {
      salt: bytesToBase64(useSalt),
      iv: bytesToBase64(iv),
      ciphertext: bytesToBase64(ciphertext),
      iterations: iterations || PBKDF2_ITERATIONS,
    };
  }

  async function openText(password, parts) {
    const key = await deriveKey(password, base64ToBytes(parts.salt), parts.iterations || PBKDF2_ITERATIONS);
    return decryptData(key, base64ToBytes(parts.iv), base64ToBytes(parts.ciphertext));
  }

  TV.crypto = {
    PBKDF2_ITERATIONS,
    SALT_BYTES,
    IV_BYTES,
    KEY_BITS,
    supportsCrypto,
    randomBytes,
    randomHex,
    randomVaultId,
    bytesToBase64,
    base64ToBytes,
    bytesToHex,
    hexToBytes,
    sha256Hex,
    deriveKey,
    encryptData,
    decryptData,
    sealText,
    openText,
  };

<script>
/* js/core/envelope.js */
/* TxtVein · 文件装甲（ASCII armor）
 * 加密后的 Base64 不是裸奔的，而是有起止标记、可被清洗、可被截断检测：
 *
 *   # TxtVein ledger (encrypted)
 *   # FORMAT: 1
 *   # VAULT_ID: 8a2b1c3d
 *   # KIND: ledger
 *   # CIPHER: AES-GCM-256
 *   # ITER: 150000
 *   # SALT: ...
 *   # IV: ...
 *   # [SECURE_START: P, AES-GCM-256]
 *   U2FsdGVkX1+...
 *   # [SECURE_END]
 *
 * 解析器只认起止标记之间的 Base64；旁边的日记、空行、BOM 全部忽略。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);
  const crypto = TV.crypto || (typeof require === 'function' ? require('./crypto.js') : null);

  const BEGIN_RE = /^#\s*\[SECURE_START:\s*([A-Za-z0-9_-]+)\s*,\s*([A-Za-z0-9-]+)\s*\]\s*$/i;
  const END_RE = /^#\s*\[SECURE_END\]\s*$/i;

  function wrap64(b64) {
    const s = S(b64);
    const out = [];
    for (let i = 0; i < s.length; i += 64) out.push(s.slice(i, i + 64));
    return out.join('\n');

  function packSecure(kind, parts, ciphertextB64, opts) {
    const p = parts || {};
    const o = opts || {};
    const domain = o.domain || 'P';
    const algorithm = o.algorithm || 'AES-GCM-256';
    const lines = [
      '# TxtVein ' + kind + ' (encrypted)',
      '# FORMAT: 1',
      '# VAULT_ID: ' + S(p.vaultId),
      '# KIND: ' + kind,
      '# CIPHER: ' + algorithm,
      '# ITER: ' + (Number(p.iterations) || crypto.PBKDF2_ITERATIONS),
      '# SALT: ' + S(p.salt),
      '# IV: ' + S(p.iv),
    ];
    if (o.updatedAt) lines.push('# TIME: ' + o.updatedAt);
    lines.push('# [SECURE_START: ' + domain + ', ' + algorithm + ']');
    lines.push(wrap64(ciphertextB64));
    lines.push('# [SECURE_END]');
    return lines.join('\n') + '\n';
  }

  function parseHeader(lines) {
    const h = {};
    lines.forEach((line) => {
      const m = S(line).match(/^#\s*([A-Za-z_]+)\s*:\s*(.*)$/);
      if (m) h[m[1].toUpperCase()] = m[2].trim();
    });
    return h;

  function extractSecure(src) {
    const raw = text.normalize(src);
    const lines = raw.split('\n');
    let begin = -1;
    let end = -1;
    let domain = '';
    let algorithm = '';
    for (let i = 0; i < lines.length; i += 1) {
      const m = lines[i].trim().match(BEGIN_RE);
      if (m) {
        if (begin >= 0) throw new Error('文件里有多个密文块，无法确定用哪一个');
        begin = i;
        domain = m[1];
        algorithm = m[2];
        continue;
      }
      if (END_RE.test(lines[i].trim())) {
        if (begin >= 0) { end = i; break; }
        throw new Error('[SECURE_END] 出现在 [SECURE_START] 之前');
      }
    }
    if (begin < 0) throw new Error('没有找到 [SECURE_START] 装甲头');
    if (end < 0) throw new Error('密文被截断：找到 [SECURE_START] 但没有 [SECURE_END]');
    const body = lines.slice(begin + 1, end).join('').replace(/[\s\u3000]+/g, '');
    if (!body) throw new Error('密文块是空的');
    if (!/^[A-Za-z0-9+/]+={0,2}$/.test(body)) {
      throw new Error('密文块含有非 Base64 字符（可能被编辑器/聊天软件污染）');
    }
    const header = parseHeader(lines.slice(0, begin));
    const pair = {
      kind: S(header.KIND || '').toLowerCase(),
      vaultId: S(header.VAULT_ID || ''),
      cipher: S(header.CIPHER || algorithm),
      iterations: Number(header.ITER) || crypto.PBKDF2_ITERATIONS,
      salt: S(header.SALT || ''),
      iv: S(header.IV || ''),
      ciphertext: body,
      domain,
      algorithm,
      header,
    };
    if (!pair.salt || !pair.iv) throw new Error('密文头缺少 SALT 或 IV');
    return pair;
  }

  function isEncrypted(src) {
    const s = text.normalize(src);
    return BEGIN_RE.test(s.split('\n').map((x) => x.trim()).find((x) => BEGIN_RE.test(x)) || '');
  }

  function detect(src) {
    try {
      return { kind: 'secure', ...extractSecure(src) };
    } catch (e) {
      return null;
    }
  }

  function sealFile(kind, header, plaintext, password, opts) {
    const o = opts || {};
    return crypto.sealText(password, plaintext, o.salt, o.iterations).then((sealed) => packSecure(kind, {
      vaultId: header.vaultId,
      iterations: sealed.iterations,
      salt: sealed.salt,
      iv: sealed.iv,
    }, sealed.ciphertext, { domain: header.domain || 'P', updatedAt: o.updatedAt }));
  }

  async function openFile(src, password) {
    const pair = extractSecure(src);
    const plain = await crypto.openText(password, {
      salt: pair.salt,
      iv: pair.iv,
      ciphertext: pair.ciphertext,
      iterations: pair.iterations,
    });
    return { plain, pair };
  }

  TV.envelope = {
    BEGIN_RE,
    END_RE,
    wrap64,
    packSecure,
    extractSecure,
    isEncrypted,
    detect,
    sealFile,
    openFile,
    parseHeader,

<script>
/* js/core/legacy.js */
/* TxtVein · 旧版导入
 * 兼容 old1（TxtVein.html 七列/五列合订账本）与 old2（文脉 2 节点/流水）。
 *
 * 旧版流水存的是简码或名字；导入时一次性绑定到新的 N_xxx，之后改名不断链。
 * 旧版没有「期初」字段的新模型，这里把期初转成「期初权益 → 节点」的真实流水。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);
  const amount = TV.amount || (typeof require === 'function' ? require('./amount.js') : null);
  const date = TV.date || (typeof require === 'function' ? require('./date.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);

  const SEP_RE = /[，\t]/;

  function cutFields(line, n) {
    const all = S(line).split(SEP_RE).map((x) => x.trim());
    if (all.length <= n) {
      while (all.length < n) all.push('');
      return all;
    }
    const head = all.slice(0, n - 1);
    head.push(all.slice(n - 1).join('，'));
    return head;
  }

  function classify(line) {
    const s = S(line).trim();
    if (!s) return '';
    if (/^#{1,3}\s*(节点|流水|统计|报表)$/.test(s)) return 'section';
    if (/^\[(节点|流水|统计|报表)\]$/.test(s)) return 'section';
    if (/^\d{6}[，\t]/.test(s)) return 'flow';
    if (dictMod.normalizeType(cutFields(s, 5)[1]).ok) return 'node';
    return '';
  }

  function detectLegacy(src) {
    const s = text.normalize(src);
    if (/^#\s*TxtVein ledger/m.test(s)) return false;
    return /##\s*(节点|流水)/.test(s) || /#\s*文脉/.test(s) || /简码.*财务大类/.test(s);
  }

  function importLegacy(src, opts) {
    const o = opts || {};
    const raw = text.normalize(src);
    if (!detectLegacy(raw)) return { ok: false, error: '不是可识别的旧版明文账本' };
    const lines = raw.split('\n');
    const nodeLines = [];
    const flowLines = [];
    let section = '';
    const warnings = [];

    lines.forEach((line) => {
      const s = line.trim();
      if (!s) return;
      if (/^##\s*(节点|流水|统计|报表)/.test(s)) {
        section = /节点/.test(s) ? 'node' : /流水/.test(s) ? 'flow' : 'skip';
        return;
      }
      if (/^#/.test(s)) return;
      if (section === 'skip') return;
      if (section === 'node') { nodeLines.push(s); return; }
      if (section === 'flow') { flowLines.push(s); return; }
      const kind = classify(s);
      if (kind === 'node') nodeLines.push(s);
      else if (kind === 'flow') flowLines.push(s);
    });

    if (!nodeLines.length) return { ok: false, error: '旧账本里没有节点段，无法建立 ID 字典' };

    const dict = dictMod.emptyDict(o.vaultId || '');
    const byCode = new Map();
    const byName = new Map();
    const nodeIds = [];
    let importedNodes = 0;
    let skippedNodes = 0;

    nodeLines.forEach((line) => {
      const f = cutFields(line, 5);
      const code = dictMod.normalizeCode(f[0]);
      const t = dictMod.normalizeType(f[1]);
      const name = f[3] || code;
      if (!code || !t.ok || !name) { skippedNodes += 1; return; }
      const made = dictMod.addNode(dict, {
        zh_name: name,
        en_name: name,
        zh_code: code,
        en_code: code,
        type: t.type,
        domain: 'P',
        weight: 50,
      });
      if (!made.ok) { skippedNodes += 1; return; }
      const id = made.id;
      const opening = amount.parseAmount(f[4] || '0');
      made.node.legacy_opening = opening.ok ? opening.cents : 0;
      byCode.set(code.toLowerCase(), id);
      byName.set(name, id);
      nodeIds.push({ id, node: made.node, opening: opening.ok ? opening.cents : 0 });
      importedNodes += 1;
    });
    if (!importedNodes) return { ok: false, error: '旧账本节点全部无法识别' };

    /* 期初权益：把旧版 opening 变成一笔真实流水 */
    const openingNode = dictMod.addNode(dict, {
      zh_name: '期初权益', en_name: 'Opening Equity', zh_code: 'legacy_open', en_code: 'legacy_open',
      type: '权益', domain: 'P', weight: 0, system: true,
    });
    const openingId = openingNode.ok ? openingNode.id : '';
    const events = [];
    let seq = 0;
    const push = (d, from, to, cents, tagIds) => {
      seq += 1;
      events.push({
        id: 'E_' + String(seq).padStart(4, '0'),
        domain: 'P',
        date: d,
        from,
        to,
        amountCents: cents,
        minutes: 0,
        tagIds: tagIds || [],
        chainId: '',
        crossDomain: false,
        raw: '',
      });
    };
    if (openingId) {
      nodeIds.forEach((x) => {
        if (!x.opening) return;
        if (x.node.polarity === 'A') push('000101', openingId, x.id, Math.abs(x.opening), []);
        else push('000101', x.id, openingId, Math.abs(x.opening), []);
      });
    }

    const find = (token) => {
      const t = S(token).trim();
      if (!t) return '';
      return byCode.get(t.toLowerCase()) || byName.get(t) || '';
    };

    let importedFlows = 0;
    let skippedFlows = 0;
    flowLines.forEach((line) => {
      const f = cutFields(line, 7);
      const d = date.parseDate(f[0]);
      if (!d.ok) { skippedFlows += 1; return; }
      const from = find(f[1]);
      const to = find(f[2]);
      const q = amount.parseAmount(f[3]);
      if (!from || !to || !q.ok || q.cents <= 0) { skippedFlows += 1; return; }

      const tagIds = [];
      const cat = S(f[4]).trim();
      const key = S(f[5]).trim();
      const memo = S(f[6]).trim();
      const addTag = (name, parentId) => {
        if (!name || name === '-') return '';
        const r = dictMod.ensureTag(dict, name, { domain: 'P', parentId: parentId || '' });
        if (!r.ok) return '';
        if (!tagIds.includes(r.id)) tagIds.push(r.id);
        return r.id;
      };
      const catId = addTag(cat, '');
      const keyId = addTag(key, catId);
      addTag(memo, keyId || catId);
      push(d.stamp, from, to, q.cents, tagIds);
      importedFlows += 1;
    });

    dict.meta.nextEvent = Math.max(Number(dict.meta.nextEvent) || 1, events.length + 1);
    dict.meta.updatedAt = new Date().toISOString();
    if (skippedNodes) warnings.push(skippedNodes + ' 个节点无法识别，已跳过');
    if (skippedFlows) warnings.push(skippedFlows + ' 笔流水无法映射，已跳过');

    return {
      ok: true,
      dict,
      events,
      plans: [],
      rules: [],
      stats: {
        nodes: importedNodes,
        flows: importedFlows,
        skippedNodes,
        skippedFlows,
        openingEvents: events.filter((e) => e.date === '000101').length,
      },
      warnings,
    };
  }

  TV.legacy = { detectLegacy, importLegacy, cutFields };

  if (typeof module === 'object' && module.exports) module.exports = TV.legacy;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/browser/store.js */
/* TxtVein · 浏览器本地保险库
 * localStorage 里只有 { v, iterations, salt, iv, ciphertext, updatedAt }。
 * 明文 payload 只有解锁后存在于内存；密钥不可导出，刷新/锁定即消失。
 * 保存用「读-比对-写」：另一个窗口先写过就拒绝覆盖，不悄悄吞数据。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const crypto = TV.crypto;
  const envelope = TV.envelope;

  const VAULT_KEY = 'txtvein:v2:vault';
  const HINT_KEY = 'txtvein:v2:hint';
  const PAYLOAD_VERSION = 2;

  let key = null;
  let expectedCipher = '';
  let frozenError = '';
  let chain = Promise.resolve();

  function isoNow() {
    return new Date().toISOString();
  }

  function storageAvailable() {
    try {
      const k = '__tv_probe__';
      root.localStorage.setItem(k, '1');
      root.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  function hasVault() {
    try {
      return !!root.localStorage.getItem(VAULT_KEY);
    } catch (e) {
      return false;
    }
  }

  function readRecord() {
    try {
      const raw = root.localStorage.getItem(VAULT_KEY);
      if (!raw) return null;
      const rec = JSON.parse(raw);
      return rec && rec.ciphertext && rec.salt && rec.iv ? rec : null;
    } catch (e) {
      return null;
    }
  }

  function writeRecord(rec) {
    try {
      root.localStorage.setItem(VAULT_KEY, JSON.stringify(rec));
    } catch (e) {
      throw new Error('本地存储写入失败（可能空间不足或被浏览器禁用）');
    }
  }

  function normalizePayload(p) {
    const o = p && typeof p === 'object' ? p : {};
    return {
      format: 'txtvein-vault',
      version: PAYLOAD_VERSION,
      ledger: String(o.ledger == null ? '' : o.ledger),
      dict: String(o.dict == null ? '' : o.dict),
      ledgerSource: String(o.ledgerSource == null ? '' : o.ledgerSource),
      dictSource: String(o.dictSource == null ? '' : o.dictSource),
      updatedAt: String(o.updatedAt || ''),

  }

  function encodePayload(p) {
    return JSON.stringify(Object.assign(normalizePayload(p), { updatedAt: isoNow() }));
  }

  function decodePayload(s) {
    const o = JSON.parse(String(s || '{}'));
    return normalizePayload(o);
  }

  function isUnlocked() {
    return !!key;
  }

  function lock() {
    key = null;
    expectedCipher = '';
    frozenError = '';
  }

  function readHint() {
    try {
      return root.localStorage.getItem(HINT_KEY) || '';
    } catch (e) {
      return '';
    }
  }

  function saveHint(v) {
    try {
      const s = String(v == null ? '' : v).trim();
      if (s) root.localStorage.setItem(HINT_KEY, s);
      else root.localStorage.removeItem(HINT_KEY);
    } catch (e) { /* 提示写不进去不影响解锁 */ }
  }

  function makeRecord(salt, iv, ciphertext, iterations, old) {
    return {
      v: PAYLOAD_VERSION,
      iterations: iterations || (old && old.iterations) || crypto.PBKDF2_ITERATIONS,
      salt: crypto.bytesToBase64(salt),
      iv: crypto.bytesToBase64(iv),
      ciphertext: crypto.bytesToBase64(ciphertext),
      updatedAt: isoNow(),
    };
  }

  async function createVault(password, payload) {
    if (hasVault()) throw new Error('已经存在保险库');
    if (!password || String(password).length < 4) throw new Error('主密码至少 4 位');
    const salt = crypto.randomBytes(crypto.SALT_BYTES);
    const k = await crypto.deriveKey(password, salt, crypto.PBKDF2_ITERATIONS);
    const { iv, ciphertext } = await crypto.encryptData(k, encodePayload(payload));
    const rec = makeRecord(salt, iv, ciphertext, crypto.PBKDF2_ITERATIONS, null);
    writeRecord(rec);
    key = k;
    expectedCipher = rec.ciphertext;
    return rec;
  }

  async function unlockVault(password) {
    const rec = readRecord();
    if (!rec) return { ok: false, error: hasVault() ? '保险库记录已损坏，只能重置' : '还没有保险库' };
    try {
      const salt = crypto.base64ToBytes(rec.salt);
      const k = await crypto.deriveKey(password, salt, rec.iterations);
      const plain = await crypto.decryptData(k, crypto.base64ToBytes(rec.iv), crypto.base64ToBytes(rec.ciphertext));
      const payload = decodePayload(plain);
      key = k;
      expectedCipher = rec.ciphertext;
      frozenError = '';
      return { ok: true, payload };
    } catch (e) {
      return { ok: false, error: '密码不对，或这个保险库已损坏' };
    }
  }

  function assertWritable() {
    if (frozenError) throw new Error(frozenError);
    if (!key) throw new Error('尚未解锁，拒绝写入');
    const rec = readRecord();
    if (!rec) throw new Error('保险库不存在，请重新加载');
    if (expectedCipher && rec.ciphertext !== expectedCipher) {
      frozenError = '另一个窗口已经保存过。这次没有覆盖，请刷新后再改。';
      throw new Error(frozenError);

    return rec;

  async function persistNow(payload) {

    const { iv, ciphertext } = await crypto.encryptData(key, encodePayload(payload));
    const next = Object.assign({}, rec, {
      v: PAYLOAD_VERSION,
      iv: crypto.bytesToBase64(iv),
      ciphertext: crypto.bytesToBase64(ciphertext),
      updatedAt: isoNow(),

    expectedCipher = next.ciphertext;
    return next;
  }

  function save(payload) {
    const job = chain.then(() => persistNow(payload));
    chain = job.then(() => undefined, () => undefined);
    return job;
  }

  function flush() {
    return chain;
  }

  async function changePassword(oldPassword, newPassword, payload, hint) {
    const rec = readRecord();
    if (!rec) return { ok: false, error: '还没有保险库' };
    if (expectedCipher && rec.ciphertext !== expectedCipher) {
      return { ok: false, error: '另一个窗口已经保存过，请先刷新再改密码' };
    }
    if (!newPassword || String(newPassword).length < 4) return { ok: false, error: '新密码至少 4 位' };
    try {
      const oldSalt = crypto.base64ToBytes(rec.salt);
      const oldKey = await crypto.deriveKey(oldPassword, oldSalt, rec.iterations);
      await crypto.decryptData(oldKey, crypto.base64ToBytes(rec.iv), crypto.base64ToBytes(rec.ciphertext));
    } catch (e) {
      return { ok: false, error: '旧密码不对' };
    }
    const salt = crypto.randomBytes(crypto.SALT_BYTES);
    const newKey = await crypto.deriveKey(newPassword, salt, crypto.PBKDF2_ITERATIONS);
    const { iv, ciphertext } = await crypto.encryptData(newKey, encodePayload(payload));
    const next = makeRecord(salt, iv, ciphertext, crypto.PBKDF2_ITERATIONS, rec);
    writeRecord(next);
    if (hint !== undefined) saveHint(hint);
    key = newKey;
    expectedCipher = next.ciphertext;
    frozenError = '';
    return { ok: true };
  }

  /** 用当前内存密钥加密一段文本（导出密文文件时用）。 */
  async function encryptWithCurrent(plaintext) {
    if (!key) throw new Error('尚未解锁');
    const rec = readRecord();
    if (!rec) throw new Error('保险库不存在');
    const { iv, ciphertext } = await crypto.encryptData(key, plaintext);
    return {
      salt: rec.salt,
      iterations: rec.iterations,
      iv: crypto.bytesToBase64(iv),
      ciphertext: crypto.bytesToBase64(ciphertext),
    };
  }

  function destroy() {
    try {
      root.localStorage.removeItem(VAULT_KEY);
      root.localStorage.removeItem(HINT_KEY);
    } catch (e) { /* 忽略 */ }
    lock();
  }

  TV.store = {
    VAULT_KEY,
    HINT_KEY,
    PAYLOAD_VERSION,
    storageAvailable,
    hasVault,
    readRecord,
    readHint,
    saveHint,
    normalizePayload,
    isUnlocked,
    createVault,
    unlockVault,
    save,
    flush,
    changePassword,
    encryptWithCurrent,
    lock,
    destroy,
  };

<script>
/* js/browser/files.js */
/* TxtVein · 浏览器文件输入输出
 * 不联网、不上传；只做 Blob 下载、File 读取、剪贴板。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});

  function downloadText(filename, content, mime) {
    const blob = new Blob([String(content == null ? '' : content)], {
      type: mime || 'text/plain;charset=utf-8',
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function downloadAll(files) {
    const list = files || [];
    for (let i = 0; i < list.length; i += 1) {
      downloadText(list[i].name, list[i].text, list[i].mime);
      if (i < list.length - 1) await sleep(350);
    }
  }

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => reject(new Error('读取文件失败：' + (file && file.name)));
      fr.readAsText(file, 'utf-8');
    });
  }

  async function readFiles(fileList) {
    const files = Array.from(fileList || []);
    const out = [];
    for (const f of files) {
      out.push({ name: f.name || '未命名', size: f.size || 0, text: await readFile(f) });
    }
    return out;
  }

  function pickFiles(multiple) {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = multiple !== false;
      input.accept = '.txt,.json,.md,.shadow,.vault,.enc,.bak,text/plain,application/json';
      input.style.position = 'fixed';
      input.style.left = '-9999px';
      document.body.appendChild(input);
      input.addEventListener('change', () => {
        const files = Array.from(input.files || []);
        input.remove();
        resolve(files);
      }, { once: true });
      input.click();
    });
  }

  async function copyText(s) {
    const text = String(s == null ? '' : s);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }

  function classify(name, text) {
    if (TV.envelope && TV.envelope.isEncrypted(text)) return 'secure';
    if (TV.dictFile && TV.dictFile.isDict(text)) return 'dict';
    if (TV.ledgerFile && TV.ledgerFile.isLedger(text)) return 'ledger';
    if (TV.legacy && TV.legacy.detectLegacy(text)) return 'legacy';
    const n = String(name || '').toLowerCase();
    if (/\.json$/.test(n)) return 'dict';
    return 'unknown';
  }

  function ext(name) {
    const m = String(name || '').match(/\.([a-z0-9]+)$/i);
    return m ? m[1].toLowerCase() : '';
  }

  function bytes(n) {
    const v = Number(n) || 0;
    if (v < 1024) return v + ' B';
    if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB';
    return (v / 1024 / 1024).toFixed(2) + ' MB';
  }

  TV.files = {
    downloadText,
    downloadAll,
    readFiles,
    pickFiles,
    copyText,
    classify,
    ext,
    bytes,
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

/* js/ui/dom.js */
/* TxtVein · DOM 小工具（只服务 UI 层） */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});

  function $(sel, node) {
    return (node || document).querySelector(sel);
  }

  function $$(sel, node) {
    return Array.from((node || document).querySelectorAll(sel));
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    const a = attrs || {};
    Object.keys(a).forEach((k) => {
      const v = a[k];
      if (v == null || v === false) return;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k === 'dataset') Object.keys(v).forEach((dk) => { node.dataset[dk] = v[dk]; });
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    });
    (children || []).forEach((c) => {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function clear(node) {
    if (node) node.replaceChildren();
  }

  function show(node, on) {
    if (!node) return;
    node.hidden = !on;
  }

  function debounce(fn, ms) {
    let t = 0;
    return function debounced(...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function raf(fn) {
    return requestAnimationFrame(fn);
  }

    node.dispatchEvent(new CustomEvent(name, { detail, bubbles: true }));
  }

<script>
/* js/ui/gate.js */
/* TxtVein · 门禁（设密码 / 解锁 / 重置）
 * 只负责界面与表单校验；真正的密钥派生在 store 里。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const { el, clear } = TV.dom;

  function createGate(host, handlers) {
    const h = handlers || {};
    let mode = 'unlock';
    let busy = false;
    let resetArmed = false;

    function panel(head, body, foot) {
      clear(host);
      host.appendChild(el('div', { class: 'gate-panel' }, [
        el('div', { class: 'gate-brand' }, ['TXT', el('span', {}, ['VEIN'])]),
        el('div', { class: 'gate-tag' }, ['PURE TEXT · DUAL POLARITY · ZERO KNOWLEDGE']),
        head,
        body,
        foot,
      ]));
    }

    function errBox() {
      return el('div', { class: 'form-error', id: 'gate-error' });
    }

    function field(label, input) {
      return el('div', { class: 'field' }, [
        el('label', { for: input.id }, [label]),
        input,
      ]);
    }

    function passwordInput(id, placeholder) {
      return el('input', {
        class: 'input', id, type: 'password', placeholder: placeholder || '',
        autocomplete: id === 'gate-pw' ? 'current-password' : 'new-password',
        spellcheck: 'false',
      });
    }

    function foot() {
      return el('div', { class: 'gate-foot' }, [
        el('span', { id: 'gate-foot-note' }, ['本地加密 · 无网络 · 无找回']),
        el('span', { id: 'gate-foot-action' }),
      ]);
    }

    function showSetup() {
      mode = 'setup';
      resetArmed = false;
      const pw = passwordInput('gate-pw', '至少 4 位');
      const pw2 = passwordInput('gate-pw2', '再输一次');
      const hint = el('input', {
        class: 'input', id: 'gate-hint', type: 'text', placeholder: '可选：一句只有你懂的提示',
        autocomplete: 'off',
      });
      const err = errBox();
      const submit = el('button', { class: 'btn btn-primary', type: 'submit' }, ['建立保险库']);
      const form = el('form', {
        onsubmit: async (ev) => {
          ev.preventDefault();
          if (busy) return;
          const a = pw.value;
          const b = pw2.value;
          if (a.length < 4) return setError('主密码至少 4 位');
          if (a !== b) return setError('两次输入不一致');
          setBusy(true, submit, '正在派生密钥…');
          try {
            await h.onSetup(a, hint.value);
            setBusy(false, submit, '建立保险库');
          } catch (e) {
            setBusy(false, submit, '建立保险库');
            setError(e.message || '建立失败');
          }
        },
      }, [
        el('h2', {}, ['设置主密码']),
        el('p', {}, ['账本只在本机加密保存。忘记密码 = 数据永久销毁；没有服务器，也没有找回。']),
        field('主密码', pw),
        field('确认', pw2),
        field('提示（可选）', hint),
        err,
        submit,
      ]);
      const f = foot();
      const action = f.querySelector('#gate-foot-action');
      action.appendChild(el('span', {}, ['纯文本是本体 · 加密是外壳']));
      panel(null, form, f);
      setTimeout(() => pw.focus(), 30);
    }

    function showUnlock() {
      mode = 'unlock';
      resetArmed = false;
      const pw = passwordInput('gate-pw', '主密码');
      const err = errBox();
      const submit = el('button', { class: 'btn btn-primary', type: 'submit' }, ['解锁']);
      const hintText = (h.readHint && h.readHint()) || '';
      const hintEl = el('div', { class: 'gate-hint', id: 'gate-hint-text' }, [
        hintText ? '提示：' + hintText : '',
      ]);
      hintEl.hidden = !hintText;
      const form = el('form', {
        onsubmit: async (ev) => {
          ev.preventDefault();
          if (busy) return;
          if (!pw.value) return setError('输入主密码');
          setBusy(true, submit, '正在解锁…');
          try {
            const ok = await h.onUnlock(pw.value);
            if (ok) {
              setBusy(false, submit, '解锁');
              return;
            }
            setBusy(false, submit, '解锁');
            setError('密码不对');
            pw.select();
          } catch (e) {
            setBusy(false, submit, '解锁');
            setError(e.message || '解锁失败');
          }
        },
      }, [
        el('h2', {}, ['解锁账本']),

        field('主密码', pw),

      ]);
      const f = foot();
      const action = f.querySelector('#gate-foot-action');
      const resetBtn = el('button', { type: 'button' }, ['忘记密码？重置保险库']);
      resetBtn.addEventListener('click', () => {

    }

    function show() {
      host.hidden = false;
      if (h.hasVault && h.hasVault()) showUnlock();
      else showSetup();

    function hide() {

    function setError(msg) {

    function setBusy(on, button, label) {
      busy = !!on;
      if (button) {
        button.disabled = !!on;

    function note(msg) {
