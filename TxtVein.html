<script>
/* js/core/ledger-file.js */
/* TxtVein · 流水文本（ledger）
 * 纯文本唯一事实源。每行一笔原子转移，只写 ID：
 *
 *   # TxtVein ledger · 纯文本唯一事实源
 *   # FORMAT: 1
 *   # VAULT_ID: 8a2b1c3d
 *   # LINK: <字典 SHA-256>
 *   P 261110 N_001 > N_002 3500 T_01
 *   P 261110 N_001 > N_002 60m T_time
 *   [PLAN]
 *   R_001 active: 0 N_001 > N_002 100000 *m last_run=261110
 *   [RULES]
 *   R_001 active: keywords=(外卖)&amount<10000 -> N_001 > N_002 tags=T_01 name=外卖
 *
 * 哈希互锁：LINK 行本身不参与哈希，否则两边互为哈希会形成死循环。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);
  const date = TV.date || (typeof require === 'function' ? require('./date.js') : null);
  const amount = TV.amount || (typeof require === 'function' ? require('./amount.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);
  const rulesMod = TV.rules || (typeof require === 'function' ? require('./rules.js') : null);

  const HEADER = '# TxtVein ledger · 纯文本唯一事实源';
  const FORMAT = '1';
  const EVENT_RE = /^(?:\[([PFCH])\]|([PFCH]))\s+(\d{6})\s+(\S+)\s*>\s*(\S+)\s+(\S+)\s*(.*)$/;
  const TAG_RE = /^T_[A-Za-z0-9_]+$/;
  const CHAIN_RE = /^C_[A-Za-z0-9_]+$/;

  function eventLine(event) {
    const parts = [
      event.domain || 'P',
      event.date,
      event.from,
      '>',
      event.to,
      event.minutes > 0 ? amount.formatMinutes(event.minutes) : String(Math.round(Number(event.amountCents) || 0)),
    ];
    (event.tagIds || []).forEach((id) => parts.push(id));
    if (event.chainId) parts.push('^' + event.chainId);
    return parts.join(' ');
  }

  function serializeLedger(state) {
    const s = state || {};
    const lines = [
      HEADER,
      '# FORMAT: ' + FORMAT,
      '# VAULT_ID: ' + S(s.vaultId),
      '# LINK: ' + S(s.link),
      '# 域: P 个人 / F 家庭 / C 公司 / H 合伙',
      '# 金额: 整数分；60m 为时间代币；标签为 T_ID',
    ];
    (s.events || []).forEach((e) => lines.push(eventLine(e)));
    const blocks = rulesMod.serializeBlocks(s.plans || [], s.rules || []);
    if (blocks) {
      lines.push(blocks);
    }
    return lines.join('\n') + '\n';
  }

  function parseMeta(lines) {
    const meta = { format: '', vaultId: '', link: '' };
    lines.forEach((line) => {
      const m = S(line).match(/^#\s*([A-Za-z_]+)\s*:\s*(.*)$/);
      if (!m) return;
      const key = m[1].toUpperCase();
      if (key === 'FORMAT') meta.format = m[2].trim();
      if (key === 'VAULT_ID') meta.vaultId = m[2].trim();
      if (key === 'LINK') meta.link = m[2].trim();
    });
    return meta;
  }

  function parseLedger(src, opts) {
    const o = opts || {};
    const raw = text.normalize(src);
    const lines = raw.split('\n');
    const meta = parseMeta(lines);
    const events = [];
    const warnings = [];
    let section = '';
    let index = 0;

    lines.forEach((line, lineNo) => {
      const s = line.trim();
      if (!s) return;
      const sec = s.match(/^\[(PLAN|RULES?)\]$/i);
      if (sec) {
        section = sec[1].toUpperCase().startsWith('PLAN') ? 'plan' : 'rule';
        return;
      }
      if (s.startsWith('#')) return;
      if (section === 'plan' || section === 'rule') return; /* 交给 rules.parseBlocks */
      const m = s.match(EVENT_RE);
      if (!m) {
        warnings.push('第 ' + (lineNo + 1) + ' 行不是合法流水：' + s);
        return;
      }
      const tagIds = [];
      let chainId = '';
      const extras = (m[7] || '').split(/[\s\u3000]+/).filter(Boolean);
      extras.forEach((tok) => {
        if (TAG_RE.test(tok)) { tagIds.push(tok); return; }
        if (tok.startsWith('^') && CHAIN_RE.test(tok.slice(1))) { chainId = tok.slice(1); return; }
        warnings.push('第 ' + (lineNo + 1) + ' 行有未知标记：' + tok);
      });
      const isTime = amount.isTimeToken(m[6]);
      let cents = 0;
      let mins = 0;
      if (isTime) {
        const q = amount.parseTime(m[6]);
        if (!q.ok) {
          warnings.push('第 ' + (lineNo + 1) + ' 行时间无法解析：' + m[6]);
          return;
        }
        mins = q.minutes;
      } else {
        cents = Math.round(Number(m[6]) || 0);
        if (!Number.isSafeInteger(cents) || cents <= 0) {
          warnings.push('第 ' + (lineNo + 1) + ' 行金额（分）不合法：' + m[6]);
          return;
        }
      }
      events.push({
        id: 'E_' + String(index + 1).padStart(4, '0'),
        domain: m[1] || m[2],
        date: m[3],
        from: m[4],
        to: m[5],
        amountCents: cents,
        minutes: mins,
        tagIds,
        chainId,
        raw: s,
        line: lineNo + 1,
      });
      index += 1;
    });

    const blocks = rulesMod.parseBlocks(raw);
    warnings.push.apply(warnings, blocks.warnings || []);

    const issues = validateLedger(o.dict, events, blocks.plans);
    return {
      ok: true,
      meta,
      vaultId: meta.vaultId,
      link: meta.link,
      events,
      plans: blocks.plans,
      rules: blocks.rules,
      warnings,
      issues,
      raw,
    };
  }

  function validateLedger(dict, events, plans) {
    const issues = [];
    const add = (level, code, message, ref) => issues.push({ level, code, message, ref: ref || '' });
    (events || []).forEach((e, i) => {
      if (!/^\d{6}$/.test(e.date) || !date.parseDate(e.date).ok) add('error', 'EVENT_DATE', '第 ' + (i + 1) + ' 笔日期不合法：' + e.date);
      if (!(e.amountCents > 0) && !(e.minutes > 0)) add('error', 'EVENT_AMOUNT', '第 ' + (i + 1) + ' 笔金额/时间必须大于 0');
      if (!dict) return;
      if (!dict.nodes[e.from]) add('error', 'EVENT_FROM', '第 ' + (i + 1) + ' 笔转出节点不存在：' + e.from);
      if (!dict.nodes[e.to]) add('error', 'EVENT_TO', '第 ' + (i + 1) + ' 笔转入节点不存在：' + e.to);
      (e.tagIds || []).forEach((tid) => {
        if (!dict.tags[tid]) add('warn', 'EVENT_TAG', '第 ' + (i + 1) + ' 笔标签不存在：' + tid);
      });
    });
    (plans || []).forEach((p) => {
      if (!p.from || !p.to) add('error', 'PLAN_NODE', '计划缺少节点：' + p.id);
      if (!(p.amountCents > 0)) add('error', 'PLAN_AMOUNT', '计划金额必须大于 0：' + p.id);
      if (['d', 'm', 'y'].indexOf(p.period) < 0) add('error', 'PLAN_PERIOD', '计划周期不合法：' + p.id);
    });
    return issues;
  }

  /** LINK 行不参与哈希；其余逐字归一化（CRLF → LF，末尾补一个换行）。 */
  function bodyForHash(src) {
    const lines = text.normalize(src).split('\n')
      .filter((line) => !/^#\s*LINK\s*:/i.test(line.trim()));
    let out = lines.join('\n');
    out = out.replace(/\n+$/, '');
    return out + '\n';
  }

  function getLink(src) {
    return parseMeta(text.normalize(src).split('\n')).link;
  }

  function getVaultId(src) {
    return parseMeta(text.normalize(src).split('\n')).vaultId;
  }

  function setLink(src, hash) {
    const lines = text.normalize(src).split('\n');
    const next = lines.filter((line) => !/^#\s*LINK\s*:/i.test(line.trim()));
    let at = 0;

  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);

    return canonicalJson(copy) + '\n';

  function normalizeDict(dict) {
    const src = dict && typeof dict === 'object' ? dict : {};
    const out = {
      format: 'txtvein-dict',
      version: 1,
      vaultId: S(src.vaultId || src.vault_id || ''),
      link: S(src.link || ''),
      meta: Object.assign({}, src.meta || {}),
      nodes: {},
      tags: {},
      behaviors: {},
      aliases: {},

      out.tags[id] = normalizeTag(id, src.tags[id]);
    });
    Object.keys(src.behaviors || {}).forEach((id) => {

      en_name: S(n.en_name || n.name || n.zh_name || id),
      zh_code: S(n.zh_code || n.code || ''),
      en_code: S(n.en_code || ''),
      polarity: tt.ok ? tt.pole : (pole === 'A' ? 'A' : 'B'),

    const dict = {
      format: 'txtvein-dict',
      version: 1,
      vaultId: S(obj.vaultId || obj.vault_id || ''),
      link: S(obj.link || ''),
      meta: Object.assign({}, obj.meta || {}),
      nodes: {},
      tags: {},
      behaviors: {},

    Object.keys(tags).forEach((id) => {

      dict.tags[id] = normalizeTag(id, tags[id]);
    });
    const behaviors = obj.behaviors && typeof obj.behaviors === 'object' ? obj.behaviors : {};
    Object.keys(behaviors).forEach((id) => {

    canonicalJson,
    bodyForHash,
    normalizeDict,
    serializeDict,
    parseDict,
    normalizeNode,
    normalizeTag,
    normalizeBehavior,
    syncMeta,
    getLink,
    setLink,
    isDict,
    emptyText,
    sortValue,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.dictFile;
})(typeof globalThis !== 'undefined' ? globalThis : this);

 *
 *   # TxtVein ledger (encrypted)
 *   # FORMAT: 1
 *   # VAULT_ID: 8a2b1c3d
 *   # KIND: ledger
 *   # CIPHER: AES-GCM-256
 *   # ITER: 150000
 *   # SALT: ...
 *   # IV: ...
 *   # [SECURE_START: P, AES-GCM-256]
 *   U2FsdGVkX1+...
 *   # [SECURE_END]

  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});

<script>
/* js/core/legacy.js */
/* TxtVein · 旧版导入
 * 兼容 old1（TxtVein.html 七列/五列合订账本）与 old2（文脉 2 节点/流水）。
 *
 * 旧版流水存的是简码或名字；导入时一次性绑定到新的 N_xxx，之后改名不断链。
 * 旧版没有「期初」字段的新模型，这里把期初转成「期初权益 → 节点」的真实流水。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);
  const amount = TV.amount || (typeof require === 'function' ? require('./amount.js') : null);
  const date = TV.date || (typeof require === 'function' ? require('./date.js') : null);
  const dictMod = TV.dict || (typeof require === 'function' ? require('./dict.js') : null);

  const SEP_RE = /[，\t]/;

  function cutFields(line, n) {
    const all = S(line).split(SEP_RE).map((x) => x.trim());
    if (all.length <= n) {
      while (all.length < n) all.push('');
      return all;
    }
    const head = all.slice(0, n - 1);
    head.push(all.slice(n - 1).join('，'));
    return head;
  }

  function classify(line) {
    const s = S(line).trim();
    if (!s) return '';
    if (/^#{1,3}\s*(节点|流水|统计|报表)$/.test(s)) return 'section';
    if (/^\[(节点|流水|统计|报表)\]$/.test(s)) return 'section';
    if (/^\d{6}[，\t]/.test(s)) return 'flow';
    if (dictMod.normalizeType(cutFields(s, 5)[1]).ok) return 'node';
    return '';
  }

  function detectLegacy(src) {
    const s = text.normalize(src);
    if (/^#\s*TxtVein ledger/m.test(s)) return false;
    return /##\s*(节点|流水)/.test(s) || /#\s*文脉/.test(s) || /简码.*财务大类/.test(s);
  }

  function importLegacy(src, opts) {
    const o = opts || {};
    const raw = text.normalize(src);
    if (!detectLegacy(raw)) return { ok: false, error: '不是可识别的旧版明文账本' };
    const lines = raw.split('\n');
    const nodeLines = [];
    const flowLines = [];
    let section = '';
    const warnings = [];

    lines.forEach((line) => {
      const s = line.trim();
      if (!s) return;
      if (/^##\s*(节点|流水|统计|报表)/.test(s)) {
        section = /节点/.test(s) ? 'node' : /流水/.test(s) ? 'flow' : 'skip';
        return;
      }
      if (/^#/.test(s)) return;
      if (section === 'skip') return;
      if (section === 'node') { nodeLines.push(s); return; }
      if (section === 'flow') { flowLines.push(s); return; }
      const kind = classify(s);
      if (kind === 'node') nodeLines.push(s);
      else if (kind === 'flow') flowLines.push(s);
    });

    if (!nodeLines.length) return { ok: false, error: '旧账本里没有节点段，无法建立 ID 字典' };

    const dict = dictMod.emptyDict(o.vaultId || '');
    const byCode = new Map();
    const byName = new Map();
    const nodeIds = [];
    let importedNodes = 0;
    let skippedNodes = 0;

    nodeLines.forEach((line) => {
      const f = cutFields(line, 5);
      const code = dictMod.normalizeCode(f[0]);
      const t = dictMod.normalizeType(f[1]);
      const name = f[3] || code;
      if (!code || !t.ok || !name) { skippedNodes += 1; return; }
      const made = dictMod.addNode(dict, {
        zh_name: name,
        en_name: name,
        zh_code: code,
        en_code: code,
        type: t.type,
        domain: 'P',
        weight: 50,
      });
      if (!made.ok) { skippedNodes += 1; return; }
      const id = made.id;
      const opening = amount.parseAmount(f[4] || '0');
      made.node.legacy_opening = opening.ok ? opening.cents : 0;
      byCode.set(code.toLowerCase(), id);
      byName.set(name, id);
      nodeIds.push({ id, node: made.node, opening: opening.ok ? opening.cents : 0 });
      importedNodes += 1;
    });
    if (!importedNodes) return { ok: false, error: '旧账本节点全部无法识别' };

    /* 期初权益：把旧版 opening 变成一笔真实流水 */
    const openingNode = dictMod.addNode(dict, {
      zh_name: '期初权益', en_name: 'Opening Equity', zh_code: 'legacy_open', en_code: 'legacy_open',
      type: '权益', domain: 'P', weight: 0, system: true,
    });
    const openingId = openingNode.ok ? openingNode.id : '';
    const events = [];
    let seq = 0;
    const push = (d, from, to, cents, tagIds) => {
      seq += 1;
      events.push({
        id: 'E_' + String(seq).padStart(4, '0'),
        domain: 'P',
        date: d,
        from,
        to,
        amountCents: cents,
        minutes: 0,
        tagIds: tagIds || [],
        chainId: '',
        crossDomain: false,
        raw: '',
      });
    };
    if (openingId) {
      nodeIds.forEach((x) => {
        if (!x.opening) return;
        if (x.node.polarity === 'A') push('000101', openingId, x.id, Math.abs(x.opening), []);
        else push('000101', x.id, openingId, Math.abs(x.opening), []);
      });
    }

    const find = (token) => {
      const t = S(token).trim();
      if (!t) return '';
      return byCode.get(t.toLowerCase()) || byName.get(t) || '';
    };

    let importedFlows = 0;
    let skippedFlows = 0;
    flowLines.forEach((line) => {
      const f = cutFields(line, 7);
      const d = date.parseDate(f[0]);
      if (!d.ok) { skippedFlows += 1; return; }
      const from = find(f[1]);
      const to = find(f[2]);
      const q = amount.parseAmount(f[3]);
      if (!from || !to || !q.ok || q.cents <= 0) { skippedFlows += 1; return; }

      const tagIds = [];
      const cat = S(f[4]).trim();
      const key = S(f[5]).trim();
      const memo = S(f[6]).trim();
      const addTag = (name, parentId) => {
        if (!name || name === '-') return '';
        const r = dictMod.ensureTag(dict, name, { domain: 'P', parentId: parentId || '' });
        if (!r.ok) return '';
        if (!tagIds.includes(r.id)) tagIds.push(r.id);
        return r.id;
      };
      const catId = addTag(cat, '');
      const keyId = addTag(key, catId);
      addTag(memo, keyId || catId);
      push(d.stamp, from, to, q.cents, tagIds);
      importedFlows += 1;
    });

    dict.meta.nextEvent = Math.max(Number(dict.meta.nextEvent) || 1, events.length + 1);
    dict.meta.updatedAt = new Date().toISOString();
    if (skippedNodes) warnings.push(skippedNodes + ' 个节点无法识别，已跳过');
    if (skippedFlows) warnings.push(skippedFlows + ' 笔流水无法映射，已跳过');

    return {
      ok: true,
      dict,
      events,
      plans: [],
      rules: [],
      stats: {
        nodes: importedNodes,
        flows: importedFlows,
        skippedNodes,
        skippedFlows,
        openingEvents: events.filter((e) => e.date === '000101').length,
      },
      warnings,
    };
  }

  TV.legacy = { detectLegacy, importLegacy, cutFields };

  if (typeof module === 'object' && module.exports) module.exports = TV.legacy;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/browser/store.js */
/* TxtVein · 浏览器本地保险库
 * localStorage 里只有 { v, iterations, salt, iv, ciphertext, updatedAt }。
 * 明文 payload 只有解锁后存在于内存；密钥不可导出，刷新/锁定即消失。
 * 保存用「读-比对-写」：另一个窗口先写过就拒绝覆盖，不悄悄吞数据。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const crypto = TV.crypto;
  const envelope = TV.envelope;

  const VAULT_KEY = 'txtvein:v2:vault';
  const HINT_KEY = 'txtvein:v2:hint';
  const PAYLOAD_VERSION = 2;

  let key = null;
  let expectedCipher = '';
  let frozenError = '';
  let chain = Promise.resolve();

  function isoNow() {
    return new Date().toISOString();
  }

  function storageAvailable() {
    try {
      const k = '__tv_probe__';
      root.localStorage.setItem(k, '1');
      root.localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }

  function hasVault() {
    try {
      return !!root.localStorage.getItem(VAULT_KEY);
    } catch (e) {
      return false;
    }
  }

  function readRecord() {
    try {
      const raw = root.localStorage.getItem(VAULT_KEY);
      if (!raw) return null;
      const rec = JSON.parse(raw);
      return rec && rec.ciphertext && rec.salt && rec.iv ? rec : null;
    } catch (e) {
      return null;
    }
  }

  function writeRecord(rec) {
    try {
      root.localStorage.setItem(VAULT_KEY, JSON.stringify(rec));
    } catch (e) {
      throw new Error('本地存储写入失败（可能空间不足或被浏览器禁用）');
    }
  }

  function normalizePayload(p) {
    const o = p && typeof p === 'object' ? p : {};
    return {
      format: 'txtvein-vault',
      version: PAYLOAD_VERSION,
      ledger: String(o.ledger == null ? '' : o.ledger),
      dict: String(o.dict == null ? '' : o.dict),
      ledgerSource: String(o.ledgerSource == null ? '' : o.ledgerSource),
      dictSource: String(o.dictSource == null ? '' : o.dictSource),
      updatedAt: String(o.updatedAt || ''),
    };
  }

  function encodePayload(p) {
    return JSON.stringify(Object.assign(normalizePayload(p), { updatedAt: isoNow() }));
  }

<script>
/* js/browser/files.js */
/* TxtVein · 浏览器文件输入输出
 * 不联网、不上传；只做 Blob 下载、File 读取、剪贴板。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});

  function downloadText(filename, content, mime) {
    const blob = new Blob([String(content == null ? '' : content)], {
      type: mime || 'text/plain;charset=utf-8',
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  async function downloadAll(files) {
    const list = files || [];
    for (let i = 0; i < list.length; i += 1) {
      downloadText(list[i].name, list[i].text, list[i].mime);
      if (i < list.length - 1) await sleep(350);
    }
  }

  function readFile(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => reject(new Error('读取文件失败：' + (file && file.name)));
      fr.readAsText(file, 'utf-8');
    });
  }

  async function readFiles(fileList) {
    const files = Array.from(fileList || []);
    const out = [];
    for (const f of files) {
      out.push({ name: f.name || '未命名', size: f.size || 0, text: await readFile(f) });
    }
    return out;
  }

  function pickFiles(multiple) {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.multiple = multiple !== false;
      input.accept = '.txt,.json,.md,.shadow,.vault,.enc,.bak,text/plain,application/json';
      input.style.position = 'fixed';
      input.style.left = '-9999px';
      document.body.appendChild(input);
      input.addEventListener('change', () => {
        const files = Array.from(input.files || []);
        input.remove();
        resolve(files);
      }, { once: true });
      input.click();
    });
  }

  async function copyText(s) {
    const text = String(s == null ? '' : s);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }

  function classify(name, text) {
    if (TV.envelope && TV.envelope.isEncrypted(text)) return 'secure';
    if (TV.dictFile && TV.dictFile.isDict(text)) return 'dict';
    if (TV.ledgerFile && TV.ledgerFile.isLedger(text)) return 'ledger';
    if (TV.legacy && TV.legacy.detectLegacy(text)) return 'legacy';
    const n = String(name || '').toLowerCase();
    if (/\.json$/.test(n)) return 'dict';
    return 'unknown';
  }

  function ext(name) {
    const m = String(name || '').match(/\.([a-z0-9]+)$/i);
    return m ? m[1].toLowerCase() : '';
  }

  function bytes(n) {
    const v = Number(n) || 0;
    if (v < 1024) return v + ' B';
    if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB';
    return (v / 1024 / 1024).toFixed(2) + ' MB';
  }

  TV.files = {
    downloadText,
    downloadAll,
    readFiles,
    pickFiles,
    copyText,
    classify,
    ext,
    bytes,
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

/* TxtVein · DOM 小工具（只服务 UI 层） */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});

  function $(sel, node) {
    return (node || document).querySelector(sel);
  }

  function $$(sel, node) {
    return Array.from((node || document).querySelectorAll(sel));
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    const a = attrs || {};
    Object.keys(a).forEach((k) => {
      const v = a[k];
      if (v == null || v === false) return;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k === 'dataset') Object.keys(v).forEach((dk) => { node.dataset[dk] = v[dk]; });
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);

      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);

    return node;
  }

  function clear(node) {
    if (node) node.replaceChildren();
  }

  function show(node, on) {

    node.hidden = !on;
  }

    let t = 0;
    return function debounced(...args) {

      t = setTimeout(() => fn.apply(this, args), ms);

<script>
/* js/ui/gate.js */
/* TxtVein · 门禁（设密码 / 解锁 / 重置）
 * 只负责界面与表单校验；真正的密钥派生在 store 里。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const { el, clear } = TV.dom;

  function createGate(host, handlers) {
    const h = handlers || {};
    let mode = 'unlock';
    let busy = false;
    let resetArmed = false;

    function panel(head, body, foot) {
      clear(host);
      host.appendChild(el('div', { class: 'gate-panel' }, [
        el('div', { class: 'gate-brand' }, ['TXT', el('span', {}, ['VEIN'])]),
        el('div', { class: 'gate-tag' }, ['PURE TEXT · DUAL POLARITY · ZERO KNOWLEDGE']),
        head,
        body,
        foot,
      ]));
    }

    function errBox() {
      return el('div', { class: 'form-error', id: 'gate-error' });
    }

    function field(label, input) {
      return el('div', { class: 'field' }, [
        el('label', { for: input.id }, [label]),
        input,
      ]);
    }

    function passwordInput(id, placeholder) {
      return el('input', {
        class: 'input', id, type: 'password', placeholder: placeholder || '',
        autocomplete: id === 'gate-pw' ? 'current-password' : 'new-password',
        spellcheck: 'false',
      });
    }

    function foot() {
      return el('div', { class: 'gate-foot' }, [
        el('span', { id: 'gate-foot-note' }, ['本地加密 · 无网络 · 无找回']),
        el('span', { id: 'gate-foot-action' }),
      ]);
    }

    function showSetup() {
      mode = 'setup';
      resetArmed = false;
      const pw = passwordInput('gate-pw', '至少 4 位');
      const pw2 = passwordInput('gate-pw2', '再输一次');
      const hint = el('input', {
        class: 'input', id: 'gate-hint', type: 'text', placeholder: '可选：一句只有你懂的提示',
        autocomplete: 'off',
      });
      const err = errBox();
      const submit = el('button', { class: 'btn btn-primary', type: 'submit' }, ['建立保险库']);
      const form = el('form', {
        onsubmit: async (ev) => {
          ev.preventDefault();
          if (busy) return;
          const a = pw.value;
          const b = pw2.value;
          if (a.length < 4) return setError('主密码至少 4 位');
          if (a !== b) return setError('两次输入不一致');
          setBusy(true, submit, '正在派生密钥…');
          try {
            await h.onSetup(a, hint.value);
            setBusy(false, submit, '建立保险库');
          } catch (e) {
            setBusy(false, submit, '建立保险库');
            setError(e.message || '建立失败');
          }
        },
      }, [
        el('h2', {}, ['设置主密码']),
        el('p', {}, ['账本只在本机加密保存。忘记密码 = 数据永久销毁；没有服务器，也没有找回。']),
        field('主密码', pw),
        field('确认', pw2),
        field('提示（可选）', hint),
        err,
        submit,
      ]);
      const f = foot();
      const action = f.querySelector('#gate-foot-action');
      action.appendChild(el('span', {}, ['纯文本是本体 · 加密是外壳']));
      panel(null, form, f);
      setTimeout(() => pw.focus(), 30);
    }

    function showUnlock() {
      mode = 'unlock';
      resetArmed = false;
      const pw = passwordInput('gate-pw', '主密码');
      const err = errBox();
      const submit = el('button', { class: 'btn btn-primary', type: 'submit' }, ['解锁']);
      const hintText = (h.readHint && h.readHint()) || '';
      const hintEl = el('div', { class: 'gate-hint', id: 'gate-hint-text' }, [
        hintText ? '提示：' + hintText : '',
      ]);
      hintEl.hidden = !hintText;
      const form = el('form', {
        onsubmit: async (ev) => {
          ev.preventDefault();
          if (busy) return;
          if (!pw.value) return setError('输入主密码');
          setBusy(true, submit, '正在解锁…');
          try {
            const ok = await h.onUnlock(pw.value);
            if (ok) {
              setBusy(false, submit, '解锁');
              return;
            }
            setBusy(false, submit, '解锁');
            setError('密码不对');
            pw.select();
          } catch (e) {
            setBusy(false, submit, '解锁');
            setError(e.message || '解锁失败');
          }
        },
      }, [
        el('h2', {}, ['解锁账本']),
        el('p', {}, ['密钥只在内存里。刷新或锁定后需要重新输入。']),
        field('主密码', pw),
        hintEl,
        err,
        submit,
      ]);
      const f = foot();
      const action = f.querySelector('#gate-foot-action');
      const resetBtn = el('button', { type: 'button' }, ['忘记密码？重置保险库']);
      resetBtn.addEventListener('click', () => {
        if (!resetArmed) {
          resetArmed = true;
          resetBtn.textContent = '确认销毁？再点一次';
          resetBtn.style.color = '#D98A8A';
          setError('重置会删除本地保险库，且无法恢复。');
          return;
        }
        h.onReset && h.onReset();
      });
      action.appendChild(resetBtn);
      panel(null, form, f);
      setTimeout(() => pw.focus(), 30);
    }

    function show() {
      host.hidden = false;
      if (h.hasVault && h.hasVault()) showUnlock();
      else showSetup();
    }

    function hide() {
      host.hidden = true;
      clear(host);
    }

    function setError(msg) {
      const box = host.querySelector('#gate-error');
      if (box) box.textContent = msg || '';
    }

    function setBusy(on, button, label) {
      busy = !!on;
      if (button) {
        button.disabled = !!on;
        button.textContent = label || button.textContent;
      }
    }

    function note(msg) {
      const box = host.querySelector('#gate-foot-note');

<script>
/* js/ui/editor.js */
/* TxtVein · VS Code 式源码编辑器
 * ledger.tv / dict.tv 两个文件；行号、语法高亮、lint、补全、运算符工具条。
 * 编辑器只产出文本；编译与数据更新由 app 负责。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const { el, clear } = TV.dom;
  const CM = root.CodeMirror;
  const Pos = CM ? CM.Pos : function (l, c) { return { line: l, ch: c }; };

  function defineModes() {
    if (!CM || CM.modes && CM.modes['txtvein-ledger'] && CM.modes['txtvein-dict']) return;
    CM.defineMode('txtvein-ledger', function () {
      return {
        token(stream) {
          if (stream.match(/^\/\//)) { stream.skipToEnd(); return 'comment'; }
          if (stream.match(/^\[[PFCH]\]/i)) return 'atom';
          if (stream.sol() && stream.match(/^[PFCH](?=\s)/i)) return 'atom';
          if (stream.match(/^\d{6}/)) return 'number';
          if (stream.match(/^[+-]?\d{1,3}(?=\s)/)) return 'number';
          if (stream.match(/^(?:>|<)/)) return 'operator';
          if (stream.match(/^\*[dmy]\b/i)) return 'keyword';
          if (stream.match(/^\d+(?:\.\d+)?(?:k|min|[dhm′])+/i)) return 'number';
          if (stream.match(/^#[^\s<>]+/)) return 'tag';
          if (stream.match(/^[A-Za-z0-9_\u4e00-\u9fff.:-]+/)) return 'variable';
          stream.next();
          return null;
        },
      };
    });
    CM.defineMode('txtvein-dict', function () {
      return {
        token(stream) {
          if (stream.match(/^\/\//)) { stream.skipToEnd(); return 'comment'; }
          if (stream.match(/^(?:node|tag|item|alias)\b/i)) return 'keyword';
          if (stream.match(/^\[(?:ACCOUNT|NOTE|BEHAVIOR|会计|备注|行为)\]$/i)) return 'atom';
          if (stream.match(/^\[[PFCH]\]/i)) return 'atom';
          if (stream.sol() && stream.match(/^[PFCH](?=\s)/i)) return 'atom';
          if (stream.match(/^(?:资产|费用|成本|负债|收入|权益)\b/)) return 'type';
          if (stream.match(/^(?:fluid|ice|steam|outside|plain|gain|suppress|time)\b/i)) return 'atom';
          if (stream.match(/^(?:N:|T:)/)) return 'meta';
          if (stream.match(/^->/)) return 'operator';
          if (stream.match(/^\|/)) return 'operator';
          if (stream.match(/^\d+(?:\.\d+)?/)) return 'number';
          if (stream.match(/^[A-Za-z0-9_\u4e00-\u9fff-]+/)) return 'variable';
          stream.next();
          return null;
        },
      };
    });
    if (CM.registerHelper) {
      CM.defineMIME && CM.defineMIME('text/x-txtvein-ledger', 'txtvein-ledger');
      CM.defineMIME && CM.defineMIME('text/x-txtvein-dict', 'txtvein-dict');
    }
  }

  function create(host, handlers) {
    const h = handlers || {};
    defineModes();
    clear(host);

    const tabs = el('div', { class: 'editor-tabs' });
    const toolbar = el('div', { class: 'editor-toolbar' });
    const main = el('div', { class: 'editor-main' });
    const status = el('div', { class: 'editor-status' });
    host.appendChild(el('div', { class: 'editor-shell' }, [tabs, toolbar, main, status]));

    const panes = {};
    const editors = {};
    const annotations = { ledger: [], dict: [] };
    const rawDiags = { ledger: [], dict: [] };
    const invalidLines = { ledger: [], dict: [] };
    const dirty = { ledger: false, dict: false };
    const errorCount = { ledger: 0, dict: 0 };
    let active = 'ledger';
    let suspended = false;

    function tab(file, label, icon) {
      const errors = el('span', { class: 'file-errors', hidden: true });
      const dot = el('span', { class: 'file-dirty', hidden: true }, ['●']);
      const b = el('button', { class: 'file-tab', type: 'button' }, [
        el('span', { class: 'file-icon' }, [icon]),
        el('span', {}, [label]),
        errors,
        dot,
        el('span', { class: 'file-close', hidden: true }),
      ]);
      b.addEventListener('click', () => setActive(file));
      b._errors = errors;
      b._dot = dot;
      return b;
    }
    const tabLedger = tab('ledger', 'ledger.tv', '<>');
    const tabDict = tab('dict', 'dict.tv', '{}');
    tabs.appendChild(tabLedger);
    tabs.appendChild(tabDict);

    function op(label, text, cls, file) {
      const b = el('button', { class: 'op-btn ' + (cls || ''), type: 'button' }, [label]);
      b.addEventListener('click', () => {
        const cm = editors[active];
        if (!cm) return;
        cm.replaceSelection(text);
        cm.focus();
      });
      if (file) b.dataset.file = file;
      return b;
    }
    const ledgerOps = el('span', { class: 'op-group', dataset: { file: 'ledger' } }, [
      op('>', ' > '), op('<', ' < '), op('*m', '*m'), op('*d', '*d'), op('*y', '*y'),
      op('d', 'd'), op('h', 'h'), op('m', 'm'), op('P', 'P '), op('F', 'F '), op('C', 'C '), op('H', 'H '),
      el('span', { class: 'sep' }),
      op('新建日期', '261115 '),
    ]);
    const dictOps = el('span', { class: 'op-group', dataset: { file: 'dict' } }, [
      op('node', 'node '), op('tag', 'tag '), op('alias', 'alias '),
      el('span', { class: 'sep' }),
      op('N:', 'N:'), op('T:', 'T:'), op('→', ' -> '), op('|', ' | '),
    ]);
    const runBtn = el('button', { class: 'op-btn is-run', type: 'button' }, ['编译 ▸']);
    runBtn.addEventListener('click', () => { if (h.onRun) h.onRun(active); });
    const note = el('span', { class: 'editor-note' }, ['Ctrl+Space 补全 · Ctrl+Enter 编译 · 语法错误行不参与计算']);
    toolbar.appendChild(ledgerOps);
    toolbar.appendChild(dictOps);
    toolbar.appendChild(el('span', { class: 'grow' }));
    toolbar.appendChild(note);
    toolbar.appendChild(runBtn);

    function insertEditorSpaceOp(cm, op) {
      const cur = cm.getCursor();
      const before = cm.getLine(cur.line).slice(0, cur.ch);
      const next = op === '>' ? before.replace(/\s*$/, '') + ' > '
        : before.replace(/\s*[<>]\s*$/, '') + ' < ';
      cm.replaceRange(next, { line: cur.line, ch: 0 }, { line: cur.line, ch: cur.ch });
      cm.setCursor({ line: cur.line, ch: next.length });
    }

    function handleEditorSpace(cm) {
      const now = Date.now();
      cm._spaceRun = (cm._lastSpace && now - cm._lastSpace < 360) ? (cm._spaceRun || 0) + 1 : 1;
      cm._lastSpace = now;
      if (cm._spaceRun >= 2) {
        insertEditorSpaceOp(cm, cm._spaceRun === 2 ? '>' : '<');
        cm._spaceRun = cm._spaceRun === 2 ? 2 : 0;
        return;
      }
      cm.replaceSelection(' ');
    }

    function makePane(file, mode) {
      const pane = el('div', { class: 'editor-pane' + (file === active ? ' is-active' : ''), dataset: { file } });
      main.appendChild(pane);
      const cm = CM(pane, {
        value: '',
        mode,
        theme: 'txtvein',
        lineNumbers: true,
        lineWrapping: false,
        styleActiveLine: true,
        matchBrackets: true,
        autoCloseBrackets: false,
        indentUnit: 2,
        tabSize: 2,
        smartIndent: false,
        viewportMargin: 12,
        gutters: ['CodeMirror-lint-markers'],
        lint: {
          delay: 350,
          getAnnotations: () => annotations[file] || [],
        },
        extraKeys: {
          'Ctrl-Space': (cmx) => cmx.showHint({ hint: makeHint(active), completeSingle: false }),
          'Ctrl-Enter': () => { if (h.onRun) h.onRun(file); },
          Space: (cmx) => handleEditorSpace(cmx),
          Tab: (cmx) => {
            if (cmx.state.completionActive) cmx.execCommand('autocomplete');
            else cmx.replaceSelection('  ');
          },
        },
      });
      cm.on('keydown', (cmx, ev) => {
        if (ev.key !== ' ') cm._spaceRun = 0;
      });
      const syncWrap = () => cm.setOption('lineWrapping', window.matchMedia('(max-width: 760px)').matches);
      syncWrap();
      window.addEventListener('resize', syncWrap);
      cm.on('change', () => {
        if (suspended) return;
        dirty[file] = true;
        updateTab(file);
        if (h.onChange) h.onChange(file, cm.getValue());
      });
      cm.on('cursorActivity', () => {
        if (file === active) renderStatus();
        if (file === active && (rawDiags[file] || []).length) syncAnnotations(file);
        if (h.onCursor) h.onCursor(file, cm.getCursor().line + 1);
      });
      cm.on('blur', () => {
        setTimeout(() => {
          const hint = document.querySelector('.CodeMirror-hints');
          if (!hint || !hint.matches(':hover')) { if (cm.closeHint) cm.closeHint(); }
        }, 220);
      });
      cm.on('inputRead', (cmx, change) => {
        if (file !== active) return;
        const t = change.text.join('');
        if (!t || /^\s+$/.test(t)) return;
        clearTimeout(cm._hintTimer);
        cm._hintTimer = setTimeout(() => {
          if (!cm.state.completionActive) cm.showHint({ hint: makeHint(file), completeSingle: false });
        }, 180);
      });
      editors[file] = cm;
      panes[file] = pane;
      return cm;
    }

    function makeHint(file) {
      return function (cm) {
        if (!h.hint) return null;
        const cur = cm.getCursor();
        const line = cm.getLine(cur.line) || '';
        const before = line.slice(0, cur.ch);
        if (before.trim().startsWith('//')) return null;
        const m = before.match(/([^\s<>]*)$/);
        const token = m ? m[1] : '';
        const start = cur.ch - token.length;
        const res = h.hint(file, token, before, line);
        if (!res || !res.list || !res.list.length) return null;
        return { list: res.list, from: Pos(cur.line, start), to: Pos(cur.line, cur.ch) };
      };
    }

    function updateTab(file) {
      const t = file === 'ledger' ? tabLedger : tabDict;
      t.classList.toggle('is-active', file === active);
      t._dot.hidden = !dirty[file];
      t._errors.hidden = !errorCount[file];
      t._errors.textContent = errorCount[file] ? String(errorCount[file]) : '';
    }

    function renderStatus() {
      const cm = editors[active];
      const cur = cm ? cm.getCursor() : { line: 0, ch: 0 };
      const fileErrors = errorCount[active] || 0;
      clear(status);
      status.appendChild(el('span', {}, [active === 'ledger' ? 'ledger.tv' : 'dict.tv']));
      status.appendChild(el('span', {}, ['Ln ' + (cur.line + 1) + ', Col ' + (cur.ch + 1)]));
      status.appendChild(el('span', { class: fileErrors ? 'st-errors' : 'st-ok' }, [
        fileErrors ? fileErrors + ' 个错误' : '语法 OK',
      ]));
      status.appendChild(el('span', {}, ['TxtVein-Lang']));
      status.appendChild(el('span', { class: 'grow' }));
      status.appendChild(el('span', {}, ['Ctrl+Enter 编译 · 对话框录入同步追加']));
      if (h.onStatus) h.onStatus({ file: active, line: cur.line + 1, col: cur.ch + 1, errors: fileErrors });
    }

    function setActive(file) {
      active = file === 'dict' ? 'dict' : 'ledger';
      Object.keys(panes).forEach((k) => panes[k].classList.toggle('is-active', k === active));
      updateTab('ledger');
      updateTab('dict');
      toolbar.querySelectorAll('.op-group').forEach((g) => {
        g.style.display = g.dataset.file === active ? 'inline-flex' : 'none';
      });
      renderStatus();
      if (editors[active]) setTimeout(() => editors[active].refresh(), 0);
      if (h.onActive) h.onActive(active);
    }

    makePane('ledger', 'txtvein-ledger');
    makePane('dict', 'txtvein-dict');
    setActive('ledger');

    function tokenAt(text, ch) {
      let a = Math.max(0, Math.min(ch, text.length));
      let b = a;
      const sep = /[\s<>]/;
      while (a > 0 && !sep.test(text.charAt(a - 1))) a -= 1;
      while (b < text.length && !sep.test(text.charAt(b))) b += 1;
      return a === b ? null : { from: a, to: b };
    }

    function diagToken(d, text) {
      if (Number.isFinite(Number(d.col)) && Number(d.col) > 0) {
        const at = Math.max(0, Math.min(Number(d.col), text.length));
        const len = Number(d.length) || 0;
        if (len > 0) return { from: at, to: Math.min(text.length, at + len) };
        const tok = tokenAt(text, at);
        if (tok) return tok;
      }
      const m = String(d.message || '').match(/[：:]\s*([^\s，。；;、]+)/);
      if (m) {
        const needle = m[1].replace(/[「」“”"'()（）]/g, '');
        const at = needle ? text.indexOf(needle) : -1;
        if (at >= 0) return { from: at, to: at + needle.length };
      }
      return { from: 0, to: Math.max(1, text.length) };
    }

    function syncAnnotations(file) {
      const cm = editors[file];
      if (!cm) return;
      (invalidLines[file] || []).forEach((n) => cm.removeLineClass(n, 'text', 'cm-invalid-line'));
      invalidLines[file] = [];
      const cursor = file === active ? cm.getCursor() : null;
      annotations[file] = (rawDiags[file] || []).map((d) => {
        const line = Math.max(0, (Number(d.line) || 1) - 1);
        const text = cm.getLine(line) || '';
        let range;
        if (cursor && cursor.line === line) {
          const tok = tokenAt(text, cursor.ch);
          const word = tok ? text.slice(tok.from, tok.to) : '';
          if (tok && !/^[PFCH]$/i.test(word) && !/^\d{6}$/.test(word)) range = tok;
        }
        if (!range) range = diagToken(d, text);
        if (d.severity !== 'warning' && !invalidLines[file].includes(line)) {
          invalidLines[file].push(line);
          cm.addLineClass(line, 'text', 'cm-invalid-line');
        }
        return {
          from: Pos(line, range.from),
          to: Pos(line, Math.max(range.to, range.from + 1)),
          message: d.message,
          severity: d.severity === 'warning' ? 'warning' : 'error',
        };
      });
      if (cm.performLint) cm.performLint();
    }

    function setDiagnostics(diags) {
      rawDiags.ledger = [];
      rawDiags.dict = [];
      errorCount.ledger = 0;
      errorCount.dict = 0;
      (diags || []).forEach((d) => {
        const file = d.file === 'dict' ? 'dict' : 'ledger';
        rawDiags[file].push(d);
        if (d.severity !== 'warning') errorCount[file] += 1;
      });
      syncAnnotations('ledger');
      syncAnnotations('dict');
      updateTab('ledger');
      updateTab('dict');
      renderStatus();
    }

    function setTexts(ledgerText, dictText) {
      suspended = true;
      const a = editors.ledger;
      const b = editors.dict;
      if (a && a.getValue() !== String(ledgerText == null ? '' : ledgerText)) {
        a.setValue(String(ledgerText == null ? '' : ledgerText));
        a.clearHistory();
      }
      if (b && b.getValue() !== String(dictText == null ? '' : dictText)) {
        b.setValue(String(dictText == null ? '' : dictText));
        b.clearHistory();
      }
      suspended = false;
      dirty.ledger = false;
      dirty.dict = false;
      updateTab('ledger');
      updateTab('dict');
      renderStatus();
    }

    function getTexts() {
      return {
        ledger: editors.ledger ? editors.ledger.getValue() : '',
        dict: editors.dict ? editors.dict.getValue() : '',
      };
    }

    function setDirty(file, on) {
      if (file === 'both') {
        dirty.ledger = !!on;
        dirty.dict = !!on;
      } else {
        dirty[file] = !!on;
      }
      updateTab('ledger');
      updateTab('dict');
    }

    function gotoLine(file, line) {
      setActive(file);
      const cm = editors[active];
      if (!cm) return;
      const l = Math.max(0, Math.min((cm.lineCount() || 1) - 1, (Number(line) || 1) - 1));
      cm.setCursor({ line: l, ch: 0 });
      cm.scrollIntoView({ line: l, ch: 0 }, 120);
      cm.focus();
    }

    function focus() {
      if (editors[active]) editors[active].focus();
    }

    function refresh() {
      if (editors[active]) editors[active].refresh();
    }

    setActive('ledger');
    return {
      setTexts,
      getTexts,
      setActive,
      getActive: () => active,
      setDiagnostics,
      setDirty,
      gotoLine,
      focus,
      refresh,
      editors,
    };
  }

  TV.editor = { create, defineModes };
})(typeof globalThis !== 'undefined' ? globalThis : this);
