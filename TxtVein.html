<style>
/* css/base.css */
/* TxtVein · 基础皮肤
 * 单色高对比 + 工业图纸风。颜色只承担语义：
 *   青 = A 极（里面），橙 = B 极（外面），灰 = 运算符/日期，极光绿 = 焦点与选中。
 */
:root {
  --bg: #06070A;
  --bg-1: #0A0C11;
  --bg-2: #0E1117;
  --bg-3: #12161E;
  --line: rgba(148, 163, 184, 0.13);
  --line-strong: rgba(148, 163, 184, 0.26);
  --text: #F8FAFC;
  --text-2: #CBD5E1;
  --text-3: #94A3B8;
  --dim: #64748B;
  --date: #4B5563;
  --a: #22D3EE;
  --b: #FB923C;
  --op: #6B7280;
  --tag: #9CA3AF;
  --accent: #4ADE80;
  --accent-dim: rgba(74, 222, 128, 0.14);
  --err: #B45454;
  --err-dim: rgba(180, 84, 84, 0.12);
  --mono: "Cascadia Code Web", "Cascadia Code", "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
  --sans: "Cascadia Code Web", "Cascadia Code", "Cascadia Mono", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --row: 33px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(rgba(148, 163, 184, 0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.028) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(circle at 50% 20%, #000 0%, transparent 78%);
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--a); text-decoration: none; }
::selection { background: rgba(74, 222, 128, 0.24); color: #fff; }

[hidden] { display: none !important; }

/* ---------------- 外壳 ---------------- */

.app {
  position: relative;
  z-index: 1;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 16px;
  height: 54px;
  border-bottom: 1px solid var(--line);
  background: rgba(6, 7, 10, 0.82);
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: max-content;
}

.brand-mark {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--text);
}

.brand-mark::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 8px;
  background: var(--accent);
  box-shadow: 0 0 12px rgba(74, 222, 128, 0.75);
  vertical-align: 1px;
}

.brand-sub {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--date);
  white-space: nowrap;
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.top-actions::-webkit-scrollbar { display: none; }

.chip {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-3);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.05em;
  padding: 6px 8px;
  white-space: nowrap;
  transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
}
.chip:hover { color: var(--text); border-color: var(--line); background: rgba(148, 163, 184, 0.04); }
.chip.is-active { color: var(--accent); border-color: rgba(74, 222, 128, 0.35); }
.chip.icon { min-width: 28px; text-align: center; font-size: 12px; }
.chip.tab { letter-spacing: 0.08em; }

.hud {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  height: 34px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--dim);
  background: rgba(10, 12, 17, 0.35);
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}
.hud::-webkit-scrollbar { display: none; }
.hud b { color: var(--text-2); font-weight: 500; }
.hud .hud-a { color: var(--a); }
.hud .hud-b { color: var(--b); }
.hud .hud-ok { color: var(--accent); }
.hud .hud-bad { color: var(--err); }
.hud .hud-sep { color: rgba(148, 163, 184, 0.25); }
.hud .hud-right { margin-left: auto; display: flex; gap: 16px; align-items: center; }

.main { flex: 1 1 auto; min-height: 0; position: relative; }
.ledger-view { height: 100%; }
.report-view { height: 100%; overflow: auto; }

/* ---------------- 通用按钮 / 表单 ---------------- */

.btn {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: rgba(10, 12, 17, 0.7);
  color: var(--text-2);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  padding: 8px 12px;
  transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
}
.btn:hover { color: var(--text); border-color: var(--text-3); background: rgba(148, 163, 184, 0.06); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  border-color: rgba(74, 222, 128, 0.5);
  color: var(--accent);
  background: rgba(74, 222, 128, 0.07);
}
.btn-primary:hover { border-color: var(--accent); background: rgba(74, 222, 128, 0.12); }
.btn-danger { border-color: rgba(180, 84, 84, 0.5); color: #D98A8A; }
.btn-danger:hover { border-color: var(--err); background: var(--err-dim); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--dim); }
.btn-ghost:hover { border-color: var(--line); color: var(--text-2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--dim);
  text-transform: uppercase;
}
.input, .select, .textarea {
  appearance: none;
  width: 100%;
  border: 1px solid var(--line-strong);
  background: rgba(6, 7, 10, 0.7);
  color: var(--text);
  padding: 9px 10px;
  font-family: var(--mono);
  font-size: 12px;
  outline: 0;
  border-radius: 0;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.1);
}
.textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.select { cursor: pointer; }
.help-text { font-size: 11px; color: var(--dim); line-height: 1.6; }
.form-error { font-family: var(--mono); font-size: 11px; color: #D98A8A; min-height: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ---------------- 门禁 ---------------- */

.gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(34, 211, 238, 0.07), transparent 65%),
    radial-gradient(700px 500px at 80% 110%, rgba(251, 146, 60, 0.05), transparent 65%),
    var(--bg);
}

.gate::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
  pointer-events: none;
}

.gate-panel {
  position: relative;
  width: min(430px, 94vw);
  border: 1px solid var(--line-strong);
  background: rgba(8, 10, 14, 0.94);
  box-shadow: var(--shadow);
  padding: 30px 30px 22px;
}

.gate-brand {
  font-family: var(--mono);
  font-size: 22px;
  letter-spacing: 0.22em;
  font-weight: 500;
  margin: 0 0 4px;
}
.gate-brand span { color: var(--accent); }
.gate-tag {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--dim);
  margin-bottom: 26px;
}
.gate h2 {
  margin: 0 0 6px;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.05em;
}
.gate p { margin: 0 0 20px; color: var(--dim); font-size: 11.5px; line-height: 1.7; }
.gate .field { margin-bottom: 12px; }
.gate .btn-primary { width: 100%; padding: 11px; margin-top: 4px; }
.gate-foot {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--date);
}
.gate-foot button {
  appearance: none; border: 0; background: transparent; padding: 0;
  color: var(--dim); font-family: var(--mono); font-size: 9px;
  border-bottom: 1px solid transparent;
}
.gate-foot button:hover { color: var(--text-2); border-bottom-color: var(--line-strong); }
.gate-hint {
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.5;
  color: var(--tag);
  margin-top: -4px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
}

/* ---------------- 模态 ---------------- */

.modal {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(3px);
}
.modal-panel {
  position: relative;
  width: min(980px, 94vw);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line-strong);
  background: #080A0E;
  box-shadow: var(--shadow);
}
.modal-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}
.modal-head h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;

.report-card {
  border: 1px solid var(--line);
  background: rgba(9, 11, 15, 0.62);
  min-width: 0;
}
.card-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 11px 13px;
  border-bottom: 1px solid var(--line);
}
.card-head h3 {
  margin: 0;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--text-2);
}
.card-head .pole {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.08em;
  border: 1px solid currentColor;
  padding: 1px 4px;
  opacity: 0.75;
}
.card-head .pole.a { color: var(--a); }
.card-head .pole.b { color: var(--b); }
.card-head .hint {
  color: var(--date);
  font-size: 9px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-head .total {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.rtable { padding-bottom: 4px; }
.rtable-row {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) 86px 86px 86px 86px;
  gap: 8px;
  align-items: center;
  padding: 6px 13px;
  font-family: var(--mono);
  font-size: 10.5px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.05);
}
.rtable-row:last-child { border-bottom: 0; }
.rtable-row.is-head {
  color: var(--date);
  font-size: 8.5px;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--line);
  padding-top: 7px;
  padding-bottom: 6px;
}
.rtable-row.is-total {
  color: var(--text-2);
  border-top: 1px solid var(--line);
  border-bottom: 0;
  background: rgba(148, 163, 184, 0.025);
}
.rtable-row:hover:not(.is-head):not(.is-total) { background: rgba(148, 163, 184, 0.035); }
.rtable-name {
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rtable-name .code { color: var(--date); font-size: 9px; margin-left: 6px; }
.rtable-name .sys { color: var(--dim); font-size: 8px; margin-left: 5px; }
.rtable-num {
  text-align: right;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.rtable-num.is-sub { color: var(--text-3); }
.rtable-num.is-neg { color: #D98A8A; }
.rtable-row.is-head .rtable-num { color: var(--date); }
.rtable-empty { padding: 14px 13px; color: var(--date); font-family: var(--mono); font-size: 9.5px; }

.energy-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border-bottom: 1px solid var(--line);
}
.energy-cell { background: rgba(9, 11, 15, 0.95); padding: 10px 12px; }
.energy-cell .l { font-family: var(--mono); font-size: 8.5px; color: var(--date); letter-spacing: 0.07em; }
.energy-cell .v { font-family: var(--mono); font-size: 15px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.energy-cell .v.gain { color: var(--accent); }
.energy-cell .v.drain { color: #D98A8A; }
.energy-cell .v.dark { color: var(--text-3); }
.energy-list { padding: 8px 13px 10px; }
.energy-line {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 4px 0;
  font-family: var(--mono);
  font-size: 10px;
}
.energy-line .n { color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.energy-line .v { color: var(--text-2); font-variant-numeric: tabular-nums; }
.energy-line .bar {
  grid-column: 1 / -1;
  height: 2px;
  background: rgba(148, 163, 184, 0.08);
  margin-top: -2px;
}
.energy-line .bar i { display: block; height: 100%; background: var(--accent); opacity: 0.55; }
.energy-line.is-drain .bar i { background: var(--err); }

.time-big {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 12px 13px 8px;
}
.time-big b { font-family: var(--mono); font-size: 24px; font-weight: 400; color: var(--accent); font-variant-numeric: tabular-nums; }
.time-big span { font-family: var(--mono); font-size: 9px; color: var(--date); }

.chain-list { padding: 6px 13px 10px; }
.chain-item {
  border-left: 1px solid rgba(74, 222, 128, 0.35);
  padding: 6px 0 6px 10px;
  margin: 6px 0;
}
.chain-head {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-2);
}
.chain-head .id { color: var(--accent); font-size: 8.5px; }
.chain-head .sum { margin-left: auto; color: var(--text-3); }
.chain-events {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  margin-top: 4px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--date);
}
.chain-events .amt { color: var(--text-3); }

.domain-list { padding: 4px 13px 10px; }
.domain-line {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) 92px 92px;
  gap: 8px;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid rgba(148, 163, 184, 0.05);
  font-family: var(--mono);
  font-size: 10px;
}
.domain-line:last-child { border-bottom: 0; }
.domain-line .d { color: var(--text-2); }
.domain-line .d i { font-style: normal; color: var(--date); font-size: 8.5px; margin-left: 4px; }
.domain-line .n { color: var(--text-3); }
.domain-line .v { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
.domain-line .v.cross { color: var(--b); }
.consolidate-note {
  padding: 9px 13px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 9px;
  color: var(--date);
  line-height: 1.7;
}
.consolidate-note b { color: var(--text-3); font-weight: 400; }

.report-issues {
  margin-top: 14px;
  border: 1px solid rgba(180, 84, 84, 0.35);
  background: var(--err-dim);
  padding: 10px 13px;
  font-family: var(--mono);
  font-size: 9.5px;
  color: #DDA0A0;
  line-height: 1.7;
}

@media (max-width: 1020px) {
  .kpi-row { grid-template-columns: repeat(3, 1fr); }
  .kpi:nth-child(3) { border-right: 0; }
  .kpi:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
  .report-grid { grid-template-columns: 1fr; }
}

@media (max-width: 620px) {
  .report-inner { padding: 12px 10px 40px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .kpi { border-right: 0; border-bottom: 1px solid var(--line); }
  .kpi:nth-child(odd) { border-right: 1px solid var(--line); }
  .rtable-row { grid-template-columns: minmax(0, 1.2fr) 68px 68px 68px 68px; gap: 4px; padding-left: 9px; padding-right: 9px; font-size: 9.5px; }
  .energy-grid { grid-template-columns: 1fr; }
  .domain-line { grid-template-columns: 50px minmax(0, 1fr) 74px; }
  .domain-line .v.cross { display: none; }
  .range-bar { margin-left: 0; }
}

/* TxtVein · VS Code 式源码编辑器（流水 / 字典） */

.editor-view {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #1e1e1e;
  color: #d4d4d4;
}

.editor-shell {
  height: 100%;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.editor-tabs {
  flex: 0 0 36px;
  display: flex;
  align-items: stretch;
  background: #252526;
  border-bottom: 1px solid #333;
  overflow-x: auto;
  scrollbar-width: none;
}
.editor-tabs::-webkit-scrollbar { display: none; }

.file-tab {
  appearance: none;
  border: 0;
  border-right: 1px solid #333;
  background: #2d2d2d;
  color: #969696;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.02em;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  position: relative;
}
.file-tab:hover { color: #d4d4d4; }
.file-tab.is-active {

  color: #ffffff;
}

}
.file-tab .file-icon {
  color: #519aba;
  font-size: 10px;

}
.file-tab .file-dirty {

  font-size: 12px;
  line-height: 1;
}
.file-tab .file-errors {
  color: #F48771;
  font-size: 9px;
  border: 1px solid rgba(244, 135, 113, 0.5);

}

.editor-toolbar {
  flex: 0 0 35px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
  background: #1e1e1e;
  border-bottom: 1px solid #2b2b2b;
  overflow-x: auto;
  scrollbar-width: none;
}
.editor-toolbar::-webkit-scrollbar { display: none; }

.op-btn {
  appearance: none;
  border: 1px solid #3c3c3c;
  background: #2d2d2d;
  color: #cccccc;
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 3px 7px;
  white-space: nowrap;
}
.op-btn:hover { border-color: #5a5a5a; background: #37373d; color: #fff; }
.op-btn.is-accent { color: var(--accent); border-color: rgba(74, 222, 128, 0.35); }
.op-btn.is-run { margin-left: 6px; color: #fff; background: #0e639c; border-color: #0e639c; }
.op-btn.is-run:hover { background: #1177bb; }
.editor-toolbar .sep { width: 1px; height: 16px; background: #333; margin: 0 4px; flex: 0 0 auto; }
.editor-toolbar .grow { flex: 1 1 auto; }
.editor-toolbar .editor-note {
  font-family: var(--mono); font-size: 9px; color: #6e7681; white-space: nowrap;
}

.editor-main {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
}
.editor-pane {
  position: absolute;
  inset: 0;
  display: none;
}
.editor-pane.is-active { display: block; }

/* CodeMirror 5 主题 */
.editor-pane .CodeMirror {
  height: 100%;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 20px;
  background: #1e1e1e;
  color: #d4d4d4;
}
.editor-pane .CodeMirror-scroll { padding-bottom: 20px; }
.editor-pane .CodeMirror-gutters {
  background: #1e1e1e;
  border-right: 1px solid #2b2b2b;
  min-width: 44px;
}
.editor-pane .CodeMirror-linenumber { color: #858585; padding-right: 10px; }
.editor-pane .CodeMirror-lines { padding: 8px 0 20px; }
.editor-pane .CodeMirror pre.CodeMirror-line { padding-left: 10px; }
.editor-pane .CodeMirror-activeline-background { background: #2a2d2e; }
.editor-pane .CodeMirror-cursor { border-left: 2px solid var(--accent); }
.editor-pane .CodeMirror-selected { background: #264f78 !important; }
.editor-pane .CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
.editor-pane .CodeMirror-lint-marker-error {
  background-image: none !important;
  color: #7E8794;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}
.editor-pane .CodeMirror-lint-marker-error::before { content: "✖"; }
.editor-pane .CodeMirror-lint-mark-error {
  background-image: none !important;
  border-bottom: 0 !important;
  text-decoration: underline wavy #C9857C;
  text-underline-offset: 2px;
}
.editor-pane .CodeMirror-lint-line-error { background: transparent !important; }
.cm-s-txtvein .cm-invalid-line,
.cm-s-txtvein .cm-invalid-line span {
  color: #B9C2CE !important; /* 整行失效文字灰白 */
}

/* token 颜色（VS Code dark 近似） */
.cm-s-txtvein .cm-comment { color: #6A9955; }
.cm-s-txtvein .cm-keyword { color: #C586C0; }
.cm-s-txtvein .cm-atom { color: #4FC1FF; }
.cm-s-txtvein .cm-number { color: #B5CEA8; }
.cm-s-txtvein .cm-operator { color: #D4D4D4; }
.cm-s-txtvein .cm-variable { color: #9CDCFE; }
.cm-s-txtvein .cm-variable-2 { color: #4EC9B0; }
.cm-s-txtvein .cm-tag { color: #4EC9B0; }
.cm-s-txtvein .cm-string { color: #CE9178; }
.cm-s-txtvein .cm-type { color: #4EC9B0; }
.cm-s-txtvein .cm-meta { color: #D7BA7D; }
.cm-s-txtvein .cm-def { color: #DCDCAA; }
.cm-s-txtvein .cm-error { color: #F44747; }

/* 状态栏 */
.editor-status {
  flex: 0 0 23px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 10px;
  background: #0e639c;
  color: #ffffff;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.02em;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}
.editor-status::-webkit-scrollbar { display: none; }
.editor-status .st-errors { color: #ffd7d1; }
.editor-status .st-ok { color: #b5f5c8; }
.editor-status .grow { flex: 1 1 auto; }

/* 补全 / lint */
.CodeMirror-hints {
  background: #252526 !important;
  border: 1px solid #454545 !important;
  box-shadow: 0 6px 18px rgba(0,0,0,.5) !important;
  font-family: var(--mono) !important;
  font-size: 11.5px !important;
  z-index: 120 !important;
}
.CodeMirror-hint {
  color: #d4d4d4 !important;
  padding: 4px 9px !important;
}
li.CodeMirror-hint-active {
  background: #094771 !important;
  color: #fff !important;
}
.CodeMirror-hint .hint-meta { color: #858585; font-size: 9.5px; margin-left: 8px; }
.CodeMirror-lint-tooltip {
  background: #252526 !important;
  border: 1px solid #454545 !important;
  color: #d4d4d4 !important;
  font-family: var(--mono) !important;
  font-size: 11px !important;
  z-index: 130 !important;
}

@media (max-width: 820px) {
  .editor-toolbar { padding: 0 6px; gap: 3px; }
  .op-btn { padding: 2px 5px; font-size: 9.5px; }
  .editor-toolbar .editor-note { display: none; }
  .editor-pane .CodeMirror { font-size: 12px; line-height: 19px; }
  .file-tab { padding: 0 10px; font-size: 10.5px; }
}

/* 行为 / 备注报表 */
.behavior-report {
  margin: 18px 22px 40px;
  border: 1px solid var(--line);
  background: var(--bg-1);
  padding: 12px 14px;
}
.behavior-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
  margin-bottom: 8px;
}
.behavior-head b {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .14em;
  color: var(--accent);
}
.behavior-head span {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
}
.behavior-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-3);
  padding: 6px 0;
}
.behavior-stats b { color: var(--text); }
.behavior-subhead {
  margin-top: 8px; padding: 6px 0 4px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
  color: var(--dim); border-bottom: 1px dashed var(--line);
}
.behavior-tree { padding: 4px 0 6px; }
.bt-row {

}

}
.tree-edit-head b { color: var(--accent); font-family: var(--mono); font-size: 13px; }
.tree-edit-head code { color: var(--text-3); font-family: var(--mono); font-size: 10px; }
.tree-edit-head span { color: var(--dim); font-family: var(--mono); font-size: 9px; }
.candidate-list { display: flex; flex-direction: column; gap: 8px; min-width: 420px; }
.candidate-row {
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  border: 1px solid var(--line); padding: 8px 10px; background: var(--bg-1);
}
.candidate-token { display: flex; flex-direction: column; gap: 3px; font-family: var(--mono); }
.candidate-token b { color: var(--text); font-size: 12px; }
.candidate-token span { color: var(--dim); font-size: 9.5px; }
.candidate-actions { display: flex; gap: 5px; flex-wrap: wrap; }
.bt-name { color: #4EC9B0; }
.bt-count { color: var(--dim); white-space: nowrap; }
.bt-empty { color: var(--dim); font-family: var(--mono); font-size: 10px; padding: 4px 0; }
.behavior-notes { border-top: 1px dashed var(--line); margin-top: 6px; }
.behavior-list { border-top: 1px dashed var(--line); }
.behavior-row {
  display: grid;
  grid-template-columns: 72px 1fr 18px 1fr 44px;
  gap: 6px;

}
.behavior-row .b-date { color: var(--dim); }
.behavior-row .b-from { color: #4EC9B0; text-align: right; }
.behavior-row .b-to { color: #C586C0; }
.behavior-row .b-arrow { color: var(--dim); text-align: center; }
.behavior-row .b-weight { color: var(--accent); text-align: right; }

/* 错误行修复向导 */
.repair-drawer {
  position: fixed;
  left: 50%;
  bottom: 84px;
  transform: translateX(-50%);
  width: min(760px, calc(100vw - 24px));
  max-height: min(70vh, 520px);
  overflow: auto;
  z-index: 90;
  background: #15181f;
  border: 1px solid var(--line-strong);
  box-shadow: 0 18px 60px rgba(0,0,0,.55);

  color: var(--text-2);
}
.repair-drawer[hidden] { display: none; }
.repair-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.repair-head b { color: var(--accent); font-size: 11px; letter-spacing: .08em; white-space: nowrap; }
.repair-raw {

  color: var(--dim);
  font-size: 10.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.repair-restored { color: var(--accent); font-size: 9px; white-space: nowrap; }
.repair-close {

  font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px;
}
.repair-close:hover { color: var(--text); }
.repair-steps {
  display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px dashed var(--line);
  overflow-x: auto; scrollbar-width: none;
}
.repair-steps::-webkit-scrollbar { display: none; }
.repair-step {
  appearance: none; background: transparent; cursor: pointer;
  font-family: var(--mono);
  font-size: 9.5px; color: var(--dim); border: 1px solid var(--line);
  padding: 2px 6px; white-space: nowrap;
}
.repair-step.is-active { color: #0b0d12; background: var(--accent); border-color: var(--accent); }
.repair-step.is-done { color: var(--accent); border-color: rgba(74,222,128,.35); }
.repair-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.repair-field { display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: var(--dim); }
.repair-input {
  width: 100%;
  background: #0d0f14;
  border: 1px solid var(--line-strong);

}

.repair-foot { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.repair-foot .grow { flex: 1; }
.repair-btn {
  appearance: none; border: 1px solid var(--line-strong); background: #1b1f27;
  color: var(--text-2); font-family: var(--mono); font-size: 10.5px; padding: 5px 9px; cursor: pointer;
}
.repair-btn:hover { border-color: var(--accent); color: var(--text); }
.repair-btn.is-primary { background: var(--accent); border-color: var(--accent); color: #071008; }
.repair-btn.is-primary:hover { background: #6ee7a0; }
@media (max-width: 820px) {
  .repair-drawer { bottom: 76px; width: calc(100vw - 12px); }
  .repair-head b { font-size: 10px; }
}

/* ================= VS Code Dark+ 主题覆盖 =================
 * 统一深灰底、Segoe UI / Cascadia Mono、较大字号；去掉网格与光晕。
 */
:root {
  --bg: #050505;
  --bg-1: #0d0d0d;
  --bg-2: #151515;
  --bg-3: #1c1c1c;
  --line: #2a2a2a;
  --line-strong: #454545;
  --text: #f5f5f5;
  --text-2: #e6e6e6;
  --text-3: #b8b8b8;
  --dim: #9a9a9a;
  --date: #7f7f7f;
  --a: #4ec9b0;
  --b: #ce9178;
  --op: #d4d4d4;
  --tag: #79c0ff;
  --accent: #4daafc;
  --accent-dim: rgba(77, 170, 252, 0.18);
  --err: #f14c4c;
  --err-dim: rgba(241, 76, 76, 0.12);
  --sans: "Cascadia Code Web", "Cascadia Code", "Cascadia Mono", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Code Web", "Cascadia Code", "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
}

html, body { font-size: 15px; }
body { background: var(--bg); color: var(--text); }
body::before { display: none !important; }
.app, .main, .report-view { background: var(--bg); }
.topbar {
  height: 44px;
  gap: 12px;
  padding: 0 12px;
  background: #252526;
  border-bottom: 1px solid #2b2b2b;
  backdrop-filter: none;
}
.brand-mark { font-size: 12px; letter-spacing: 0.12em; }
.brand-mark::before { content: none; display: none; }
.brand-sub { display: none; }
.top-actions { gap: 2px; overflow: visible; }
.chip {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0;
  color: #b8b8b8;
  padding: 6px 9px;
  border-radius: 2px;
}
.chip:hover { color: #fff; background: #2a2d2e; border-color: #3c3c3c; }
.chip.is-active { color: #fff; background: #37373d; border-color: #007acc; box-shadow: inset 0 -2px 0 #007acc; }
.chip.icon { min-width: 30px; font-size: 15px; }
.hud {
  height: 31px;
  gap: 14px;
  padding: 0 13px;
  font-size: 10.5px;
  background: #1f1f1f;
  color: #9a9a9a;
}
.hud b { color: #d4d4d4; }

.more-wrap { position: relative; }
.more-menu {
  position: absolute;
  top: calc(100% + 5px);
  right: 0;
  z-index: 240;
  min-width: 170px;
  padding: 4px;
  background: #252526;
  border: 1px solid #454545;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
}
.more-menu button {
  display: block;
  width: 100%;
  appearance: none;
  border: 0;
  background: transparent;
  color: #cccccc;
  text-align: left;
  font-size: 13px;
  padding: 7px 10px;
}
.more-menu button:hover { background: #094771; color: #fff; }

.editor-pane .CodeMirror { font-size: 14px; line-height: 22px; }
.file-tab { font-size: 12px; height: 32px; }
.editor-toolbar { flex-basis: 34px; }
.op-btn { font-size: 12px; padding: 3px 7px; }
.editor-toolbar .editor-note { font-size: 10.5px; }
.editor-status { flex-basis: 24px; font-size: 11px; }
.editor-pane .CodeMirror-linenumber { font-size: 11px; }
.CodeMirror-hint { font-size: 12px !important; }
.CodeMirror-lint-tooltip { font-size: 12px !important; background: #252526 !important; border-color: #454545 !important; color: #d4d4d4 !important; }

.report-inner { max-width: 1600px; padding: 16px 18px 44px; }
.report-head { margin-bottom: 12px; gap: 14px; }
.report-title { font-size: 15px; letter-spacing: 0.08em; }
.report-title span { font-size: 10px; }
.report-sub { font-size: 11px; }
.range-chip { font-size: 11px; padding: 5px 9px; }
.range-input { font-size: 11.5px; padding: 6px 8px; background: #1e1e1e; }
.kpi-row { background: #252526; }
.kpi { padding: 13px 14px; }
.kpi-label { font-size: 10px; letter-spacing: 0.06em; }
.kpi-value { font-size: 20px; }
.kpi-note { font-size: 10px; }
.report-card { background: #202020; }
.card-head { padding: 10px 13px; }
.card-head h3 { font-size: 13px; }
.card-head .pole { font-size: 10px; }
.card-head .hint { font-size: 10.5px; }
.card-head .total { font-size: 12px; }
.rtable-row { font-size: 12px; padding: 7px 13px; }
.rtable-row.is-head { font-size: 10px; }
.rtable-name .code { font-size: 10px; }
.rtable-name .sys { font-size: 9px; }
.rtable-empty { font-size: 11.5px; }
.energy-cell .l { font-size: 10px; }
.energy-cell .v { font-size: 17px; }
.time-big b { font-size: 26px; }
.time-big span { font-size: 10px; }
.chain-head { font-size: 11px; }
.domain-line { font-size: 11px; }

.modal-panel { background: #252526; border-color: #454545; }
.modal-head h2 { font-size: 15px; }
.modal-body { font-size: 13.5px; }
.field label { font-size: 12px; }
.help-text { font-size: 12px; }
.btn { font-size: 12.5px; }

@media (max-width: 760px) {
  .topbar { height: auto; min-height: 48px; flex-wrap: wrap; padding: 7px 10px; gap: 6px; }
  .top-actions { width: 100%; margin-left: 0; overflow-x: auto; }
  .report-inner { padding: 12px 10px 36px; }
  .kpi-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .report-grid { grid-template-columns: 1fr; }
  .rtable-row { font-size: 11px; }
  .editor-pane .CodeMirror { font-size: 13px; line-height: 20px; }
}

/* ================= 顶栏 / 页签 / 反馈栏 ================= */
.topbar { gap: 18px; overflow: visible; }
.top-menu { display: flex; align-items: center; gap: 1px; min-width: 0; }
.menu-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: #b8b8b8;
  font-family: var(--sans);
  font-size: 13px;
  padding: 6px 9px;
  border-radius: 4px;
  white-space: nowrap;
}

.top-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }

.page-tabs {

  align-items: flex-end;
  gap: 2px;
  height: 39px;
  padding: 5px 12px 0;

  border-bottom: 1px solid #2b2b2b;
}
.page-tab {

  border: 1px solid transparent;

  color: #9d9d9d;

  padding: 7px 17px 8px;

/* 去掉旧的操作按钮条与蓝色状态条 */
.editor-toolbar, .editor-status, .editor-tabs, .file-tabs { display: none !important; }

.feedback {
  flex: 0 0 26px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 13px;
  background: #181818;
  border-top: 1px solid #2b2b2b;
  color: #9d9d9d;
  font-family: var(--mono);
  font-size: 11px;
  min-width: 0;
}
.feedback-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feedback.is-error { color: #f48771; background: #241d1d; }
.feedback.is-ok { color: #89d185; }
.feedback-action {
  margin-left: auto;
  appearance: none;
  border: 1px solid #454545;
  background: transparent;
  color: #4daafc;
  font-family: var(--sans);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
  white-space: nowrap;
}

/* ================= 查询页 ================= */

/* ================= 固定页 ================= */
.fixed-inner { max-width: 1200px; margin: 0 auto; padding: 16px 20px 40px; }

<script>
/* js/core/text.js */
/* TxtVein · 基础文本层
 * 零依赖，浏览器与 Node 通用。
 * 这一层只做「字符」的事：归一化、切行、宽度、全角转半角。
 * 不认钱、不认日期、不认节点。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});

  const FULLWIDTH_DIGIT = /[０-９]/g;
  const ZERO_WIDTH = /[\u200b\u200c\u200d\u2060\ufeff]/g;

  function normalize(src) {
    return String(src == null ? '' : src)
      .replace(/^\uFEFF/, '')
      .replace(ZERO_WIDTH, '')
      .replace(/\r\n?/g, '\n')
      .replace(/\u2028|\u2029/g, '\n');
  }

  function splitLines(src) {
    return normalize(src).split('\n');
  }

  function isBlank(s) {
    return !String(s == null ? '' : s).trim();
  }

  function isComment(s) {
    return /^\s*#/.test(String(s == null ? '' : s));
  }

  function trim(s) {
    return String(s == null ? '' : s).replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
  }

  function tokens(s) {
    return trim(s).split(/[\s\u3000]+/).filter(Boolean);
  }

  function toHalfWidthDigits(s) {
    return String(s == null ? '' : s).replace(FULLWIDTH_DIGIT, (ch) =>
      String.fromCharCode(ch.charCodeAt(0) - 0xfee0));
  }

  /* 全角运算符/标点 → 半角。只用于「输入层」，不用于展示层。 */
  function normalizeOperators(s) {
    return String(s == null ? '' : s)
      .replace(/[＞›]/g, '>')
      .replace(/[＜‹]/g, '<')
      .replace(/[：]/g, ':')
      .replace(/[［【]/g, '[')
      .replace(/[］】]/g, ']')
      .replace(/＃/g, '#')
      .replace(/，/g, ',');
  }

  /* 终端/报表列宽：CJK 与全角标点算 2 格，其余 1 格。 */
  function charWidth(ch) {
    if (!ch) return 0;
    const c = ch.codePointAt(0);
    if (c < 0x1100) return 1;
    if (
      c <= 0x115f ||
      c === 0x2329 || c === 0x232a ||
      (c >= 0x2e80 && c <= 0xa4cf && c !== 0x303f) ||
      (c >= 0xac00 && c <= 0xd7a3) ||
      (c >= 0xf900 && c <= 0xfaff) ||
      (c >= 0xfe10 && c <= 0xfe19) ||
      (c >= 0xfe30 && c <= 0xfe6f) ||
      (c >= 0xff00 && c <= 0xff60) ||
      (c >= 0xffe0 && c <= 0xffe6) ||
      (c >= 0x20000 && c <= 0x3fffd)
    ) return 2;
    return 1;
  }

  function textWidth(s) {
    let w = 0;
    const str = String(s == null ? '' : s);
    for (let i = 0; i < str.length; i += 1) {
      const cp = str.codePointAt(i);
      if (cp > 0xffff) i += 1;
      w += charWidth(String.fromCodePoint(cp));
    }
    return w;
  }

  function padEndWidth(s, width) {
    const str = String(s == null ? '' : s);
    const gap = width - textWidth(str);
    return gap > 0 ? str + ' '.repeat(gap) : str;
  }

  function padStartWidth(s, width) {
    const str = String(s == null ? '' : s);
    const gap = width - textWidth(str);
    return gap > 0 ? ' '.repeat(gap) + str : str;
  }

  function truncateWidth(s, width) {
    const str = String(s == null ? '' : s);
    if (textWidth(str) <= width) return str;
    let out = '';
    let w = 0;
    for (const ch of str) {
      const cw = charWidth(ch);
      if (w + cw > width - 1) break;
      out += ch;
      w += cw;
    }
    return out + '…';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isoNow(now) {
    return (now instanceof Date ? now : new Date()).toISOString();
  }

  TV.text = {
    normalize,
    splitLines,
    isBlank,
    isComment,
    trim,
    tokens,
    toHalfWidthDigits,
    normalizeOperators,
    charWidth,
    textWidth,
    padEndWidth,
    padStartWidth,
    truncateWidth,
    escapeHtml,
    isoNow,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.text;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/core/amount.js */
/* TxtVein · 金额层
 * 铁律：底层只存整数分。本模块是唯一允许出现「元 → 分」转换的地方。
 *
 * 输入：35 / 35.5 / 3.5k / ¥1,000.00 / 60min
 * 输出：{ ok, cents, minutes, unit, error }
 * 展示：centsToDisplay 折叠为 35 / 3.5k；formatPlain 还原 ¥3,512.34。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);

  const MAX_CENTS = 9e15; /* Number.MAX_SAFE_INTEGER 以内 */
  const MONEY_RE = /^\d+(?:\.\d{1,2})?$/;
  const K_RE = /^(\d+(?:\.\d{1,4})?)k$/i;
  /* d/h/m 是时间单位；min 与 ′ 是兼容写法。后台一律整数分钟。 */
  const TIME_UNITS = { d: 1440, h: 60, m: 1 };
  const TIME_RE = /^(\d+(?:\.\d{1,4})?)(d|h|m|min|′)$/i;
  const TIME_COMPOSITE_RE = /^(?:\d+(?:\.\d{1,4})?[dhm])+$/i;
  const MAX_MINUTES = 100 * 366 * 1440;

  function clean(raw) {
    let s = String(raw == null ? '' : raw).trim();
    if (!s) return '';
    if (text) s = text.toHalfWidthDigits(s);
    return s
      .replace(/[¥￥$]/g, '')
      .replace(/[,，\s]/g, '')
      .replace(/^\+/, '');
  }

  /**
   * 元（或 k 缩写）→ 整数分。
   * 3.5k = 3500 元 = 350000 分。
   */
  function parseAmount(raw) {
    const s = clean(raw);
    if (!s) return { ok: false, cents: 0, minutes: 0, unit: 'money', error: '金额为空' };

    let yuan;
    let m;
    if ((m = s.match(K_RE))) {
      yuan = Number(m[1]) * 1000;
    } else if (MONEY_RE.test(s)) {
      yuan = Number(s);
    } else {
      return { ok: false, cents: 0, minutes: 0, unit: 'money', error: '金额格式不对：' + raw };
    }
    if (!Number.isFinite(yuan)) {
      return { ok: false, cents: 0, minutes: 0, unit: 'money', error: '金额超出范围' };
    }
    const cents = Math.round(yuan * 100);
    if (!Number.isSafeInteger(cents) || Math.abs(cents) > MAX_CENTS) {
      return { ok: false, cents: 0, minutes: 0, unit: 'money', error: '金额超出范围' };
    }
    return { ok: true, cents, minutes: 0, unit: 'money', error: '' };
  }

  function unitMinutes(unit) {
    const u = String(unit || '').toLowerCase();
    if (u === 'min' || u === '′') return 1;
    return TIME_UNITS[u] || 0;
  }

  function isTimeToken(raw) {
    const s = clean(raw);
    return TIME_RE.test(s) || TIME_COMPOSITE_RE.test(s);
  }

  /** 60m / 1.5h / 1d2h30m → 分钟整数。时间代币不进入金额余额。 */
  function parseTime(raw) {
    const s = clean(raw);
    let minutes = 0;
    const single = s.match(TIME_RE);
    if (single) {
      minutes = Number(single[1]) * unitMinutes(single[2]);
    } else if (TIME_COMPOSITE_RE.test(s)) {
      const re = /(\d+(?:\.\d{1,4})?)(d|h|m)/gi;
      let m;
      while ((m = re.exec(s))) minutes += Number(m[1]) * unitMinutes(m[2]);
    } else {
      return { ok: false, cents: 0, minutes: 0, unit: 'time', error: '时间格式不对：' + raw };
    }
    const total = Math.round(minutes);
    if (!Number.isFinite(total) || total <= 0) {
      return { ok: false, cents: 0, minutes: 0, unit: 'time', error: '时间必须大于 0' };
    }
    if (total > MAX_MINUTES) {
      return { ok: false, cents: 0, minutes: 0, unit: 'time', error: '时间超出范围' };
    }
    return { ok: true, cents: 0, minutes: total, unit: 'time', error: '' };
  }

  /** 统一入口：金额或时间。 */
  function parseQuantity(raw) {
    const s = clean(raw);
    if (isTimeToken(s)) return parseTime(s);
    return parseAmount(s);
  }

  function splitPeriod(token) {
    const s = String(token == null ? '' : token).trim();
    const m = s.match(/^(.*?)\*([dmy])$/i);
    if (!m) return { token: s, period: '', ok: true };
    return { token: m[1], period: m[2].toLowerCase(), ok: true };
  }

  function abs(n) {
    return Math.abs(Math.round(Number(n) || 0));
  }

  /** 整数分 → 展示缩写：<1000 元不缩写；≥1000 用 k。 */
  function centsToDisplay(cents) {
    const n = Math.round(Number(cents) || 0);
    if (n === 0) return '0';
    const neg = n < 0;
    const a = Math.abs(n);
    let out;
    if (a < 100000) {
      const yuan = Math.floor(a / 100);
      const rest = a % 100;
      if (rest === 0) out = String(yuan);
      else {
        const frac = String(rest).padStart(2, '0').replace(/0+$/, '');
        out = yuan + '.' + frac;
      }
    } else {
      const k = a / 100000;
      const rounded = Math.round(k * 100) / 100;
      out = String(rounded).replace(/\.0+$/, '') + 'k';
    }
    return (neg ? '-' : '') + out;
  }

  /** 详情态：¥3,512.34（固定两位小数，千分位）。 */
  function formatPlain(cents) {
    const n = Math.round(Number(cents) || 0);
    const neg = n < 0;
    const a = Math.abs(n);
    const yuan = String(Math.floor(a / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const frac = String(a % 100).padStart(2, '0');
    return (neg ? '-¥' : '¥') + yuan + '.' + frac;
  }

  function formatYuan(cents) {
    return formatPlain(cents);
  }

  /** 存储层：只输出总分钟数 + m，不分解 d/h；例如 1590 -> 1590m。 */
  function formatMinutes(minutes) {
    const n = Math.round(Number(minutes) || 0);
    return n > 0 ? n + 'm' : '0';
  }

  function formatTime(minutes) {
    let n = Math.round(Number(minutes) || 0);
    if (n <= 0) return '0';
    const d = Math.floor(n / 1440);
    n -= d * 1440;
    const h = Math.floor(n / 60);
    const m = n - h * 60;
    return (d ? d + 'd' : '') + (h ? h + 'h' : '') + (m ? m + 'm' : '') || '0';
  }

  function formatQuantity(item) {
    if (!item) return '0';
    if (item.minutes > 0) return formatTime(item.minutes);
    return centsToDisplay(item.amountCents);
  }

  function sum(list, key) {
    const k = key || 'amountCents';
    return (list || []).reduce((acc, x) => acc + Math.round(Number(x && x[k]) || 0), 0);
  }

  TV.amount = {
    MAX_CENTS,
    MAX_MINUTES,
    TIME_UNITS,
    clean,
    parseAmount,
    parseTime,
    parseQuantity,
    isTimeToken,
    splitPeriod,
    centsToDisplay,
    formatPlain,
    formatYuan,
    formatTime,
    formatMinutes,
    formatQuantity,
    sum,
    abs,
    /* 规范文档里的名字 */
    displayToCents(raw) {
      const r = parseAmount(raw);
      return r.ok ? r.cents : NaN;
    },
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.amount;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/* js/core/date.js */
/* TxtVein · 日期层
 * 账本内部唯一写法：YYMMDD（如 261110）。
 * 输入层允许：261110 / 20261110 / 2026-11-10 / 26-11-10 / 0 / -1 / +1。
 * 铁律：相对日期只活在输入层，落盘前必须固化为绝对日期。
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const text = TV.text || (typeof require === 'function' ? require('./text.js') : null);

  const YEAR_MIN = 1900;
  const YEAR_MAX = 2199;

  function pad2(n) {
    return String(n).padStart(2, '0');
  }

  function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
  }

  function fail(error, extra) {
    return Object.assign({ ok: false, error }, extra || {});
  }

  function mk(year, month, day) {
    return {
      ok: true,
      year,
      month,
      day,
      key: year * 10000 + month * 100 + day,
      stamp: pad2(year % 100) + pad2(month) + pad2(day),
      iso: year + '-' + pad2(month) + '-' + pad2(day),
      error: '',
    };
  }

  function parseParts(y, m, d) {
    let ys = String(y == null ? '' : y).trim();
    const ms = String(m == null ? '' : m).trim();
    const ds = String(d == null ? '' : d).trim();
    if (text) {
      ys = text.toHalfWidthDigits(ys);
    }
    if (!/^\d{2}(\d{2})?$/.test(ys) || !/^\d{1,2}$/.test(ms) || !/^\d{1,2}$/.test(ds)) {
      return fail('日期应写成 261110 或 2026-11-10');
    }
    let year = Number(ys);
    if (ys.length === 2) year += 2000;
    const month = Number(ms);
    const day = Number(ds);
    if (year < YEAR_MIN || year > YEAR_MAX) return fail('年份超出 ' + YEAR_MIN + '–' + YEAR_MAX);
    if (month < 1 || month > 12) return fail('月份必须在 1–12 之间');
    const maxDay = daysInMonth(year, month);
    if (day < 1 || day > maxDay) return fail('这个月没有 ' + day + ' 号');
    return mk(year, month, day);
  }

  function parseDate(raw) {
    let s = String(raw == null ? '' : raw).trim();
    if (!s) return fail('日期不能为空');
    if (text) s = text.toHalfWidthDigits(s);
    let m;
    if (/^\d{8}$/.test(s)) return parseParts(s.slice(0, 4), s.slice(4, 6), s.slice(6, 8));
    if (/^\d{6}$/.test(s)) return parseParts(s.slice(0, 2), s.slice(2, 4), s.slice(4, 6));
    if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) {
      return parseParts(m[1], m[2], m[3]);
    }
    if ((m = s.match(/^(\d{2})[-/.](\d{1,2})[-/.](\d{1,2})$/))) {
      return parseParts(m[1], m[2], m[3]);
    }
    return fail('日期应写成 261110 或 2026-11-10');
  }

  /** 相对日期语法糖。offset 单位：天。 */
  function resolveDateToken(raw, now) {
    let s = String(raw == null ? '' : raw).trim();
    if (text) s = text.toHalfWidthDigits(s);
    if (/^[+-]?\d{1,3}$/.test(s)) {
      const offset = parseInt(s, 10);
      if (Math.abs(offset) > 366) return fail('相对日期最多前后 366 天');
      const base = now instanceof Date ? new Date(now.getTime()) : new Date();
      base.setDate(base.getDate() + offset);
      const d = mk(base.getFullYear(), base.getMonth() + 1, base.getDate());
      d.relative = true;
      d.offset = offset;
      return d;
    }
    const d = parseDate(s);
    if (d.ok) {
      d.relative = false;
      d.offset = 0;
    }
    return d;
  }

  function stampOf(dateObj) {
    const d = dateObj instanceof Date ? dateObj : new Date();
    return pad2(d.getFullYear() % 100) + pad2(d.getMonth() + 1) + pad2(d.getDate());
  }

  function todayStamp(now) {
    return stampOf(now || new Date());
  }

  function toDate(stamp) {
    const p = String(stamp || '');
    if (!/^\d{6}$/.test(p)) return null;
    return new Date(2000 + Number(p.slice(0, 2)), Number(p.slice(2, 4)) - 1, Number(p.slice(4, 6)));
  }

  function addDays(stamp, n) {
    const d = toDate(stamp);
    if (!d) return '';
    d.setDate(d.getDate() + Number(n || 0));
    return stampOf(d);
  }

  function addMonths(stamp, n) {
    const p = parseDate(stamp);
    if (!p.ok) return '';
    const target = new Date(p.year, p.month - 1 + Number(n || 0), 1);
    const y = target.getFullYear();
    const m = target.getMonth() + 1;
    const d = Math.min(p.day, daysInMonth(y, m));
    return mk(y, m, d).stamp;
  }

  function addYears(stamp, n) {
    const p = parseDate(stamp);
    if (!p.ok) return '';
    const y = p.year + Number(n || 0);
    const m = p.month;
    const d = Math.min(p.day, daysInMonth(y, m));
    return mk(y, m, d).stamp;
  }

  function addPeriod(stamp, period, n) {
    const k = String(period || '').toLowerCase();
    if (k === 'd') return addDays(stamp, n == null ? 1 : n);
    if (k === 'm') return addMonths(stamp, n == null ? 1 : n);
    if (k === 'y') return addYears(stamp, n == null ? 1 : n);
    return '';
  }

  function compare(a, b) {
    return String(a || '').localeCompare(String(b || ''));
  }

  function inRange(stamp, range) {
    if (!range || !range.start) return true;
    return stamp >= range.start && stamp <= range.end;
  }

  function mkRange(start, end, label) {
    const a = parseDate(start);
    const b = parseDate(end);
    if (!a.ok) return fail(a.error);
    if (!b.ok) return fail(b.error);
    if (a.key > b.key) return fail('区间起点晚于终点');
    return {
      ok: true,
      start: a.stamp,
      end: b.stamp,
      startISO: a.iso,
      endISO: b.iso,
      text: a.stamp + '~' + b.stamp,
      label: label || (a.iso + ' ~ ' + b.iso),
      error: '',
    };
  }

  function monthRange(base, offset) {
    const d = base instanceof Date ? base : new Date();
    const first = new Date(d.getFullYear(), d.getMonth() + (offset || 0), 1);
    const y = first.getFullYear();
    const m = first.getMonth() + 1;
    const last = daysInMonth(y, m);
    return mkRange(
      pad2(y % 100) + pad2(m) + '01',
      pad2(y % 100) + pad2(m) + pad2(last),
      (offset === -1 ? '上月 ' : offset === 0 ? '本月 ' : '') + y + '-' + pad2(m)
    );
  }

  function yearRange(base, offset) {
    const d = base instanceof Date ? base : new Date();
    const y = d.getFullYear() + (offset || 0);
    return mkRange(String(y) + '0101', String(y) + '1231', (offset === -1 ? '去年 ' : '今年 ') + y);
  }

  function allRange() {
    return mkRange('000101', '991231', '全期');
  }

  function ymdToken(y, m, d) {
    const ys = String(y || '').replace(/[^\d]/g, '');
    const mm = pad2(String(m || '').replace(/[^\d]/g, ''));
    const dd = pad2(String(d || '').replace(/[^\d]/g, ''));
    return ys.length === 4 ? ys + '-' + mm + '-' + dd : pad2(ys) + mm + dd;
  }

  /**
   * 区间解析。空输入默认「本月」，与报表页一致。
   * 支持：全部 / 本月 / 上月 / 今年 / 261101~261130 / 2026-11 /
   *       26，11，01，>，26，11，30 / 2026-11-01 ~ 2026-11-30 / 单日。
   */
  function parseRange(raw, now) {
    const s = String(raw == null ? '' : raw).trim();
    if (!s || s === '本月' || /^month$/i.test(s)) return monthRange(now, 0);
    if (s === '上月') return monthRange(now, -1);
    if (s === '今年' || s === '本年' || /^year$/i.test(s)) return yearRange(now, 0);
    if (s === '去年') return yearRange(now, -1);
    if (s === '全部' || s === '全期' || /^all$/i.test(s)) return allRange();

    let m = s.match(/^(\d{4})[-/.](\d{1,2})$/);
    if (m) {
      const y = Number(m[1]);
      const mm = Number(m[2]);
      if (mm < 1 || mm > 12) return fail('月份不对：' + s);
      return mkRange(
        String(y) + pad2(mm) + '01',
        String(y) + pad2(mm) + pad2(daysInMonth(y, mm)),
        y + '-' + pad2(mm)
      );
    }

    m = s.match(/^(\d{4}[-/.]\d{1,2}[-/.]\d{1,2})\s*[~～至]\s*(\d{4}[-/.]\d{1,2}[-/.]\d{1,2})$/);
    if (m) return mkRange(m[1], m[2]);

    m = s.match(/^(\d{6})\s*[~～至>]\s*(\d{6})$/);
    if (m) return mkRange(m[1], m[2]);

    const f = s.split(/[，,\t]/).map((x) => x.trim()).filter(Boolean);
    if (f.length === 7 && /^[>＞]$/.test(f[3])) {
      return mkRange(ymdToken(f[0], f[1], f[2]), ymdToken(f[4], f[5], f[6]));
    }
    if (f.length === 6) {
      return mkRange(ymdToken(f[0], f[1], f[2]), ymdToken(f[3], f[4], f[5]));
    }

    const one = parseDate(s);
    if (one.ok) return mkRange(one.stamp, one.stamp, one.iso);
    return fail(one.error || '认不出区间：' + s);
  }

  TV.date = {
    YEAR_MIN,
    YEAR_MAX,
    pad2,
    daysInMonth,
    parseParts,
    parseDate,
    resolveDateToken,
    stampOf,
    todayStamp,
    toDate,
    addDays,
    addMonths,
    addYears,
    addPeriod,
    compare,
    inRange,
    mkRange,
    monthRange,
    yearRange,
    allRange,
    parseRange,
  };

  if (typeof module === 'object' && module.exports) module.exports = TV.date;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* js/core/dict.js */
/* TxtVein · 字典层
 * 流水只存 ID；这一层负责 ID ⇄ 名字/简码/极性/域/树关系。
 * 改名只改这里，历史流水一行不动。
 *
 * 四维一体：zh_name / en_name / zh_code / en_code
 * 双极：A（资产/费用/成本）与 B（负债/收入/权益）
 * 多域：P 个人 / F 家庭 / C 公司 / H 合伙
 */
(function (root) {
  'use strict';

  const TV = (root.TxtVein = root.TxtVein || {});
  const S = (x) => String(x == null ? '' : x);

  const DOMAINS = {
    P: { code: 'P', zh: '个人', en: 'Personal' },
    F: { code: 'F', zh: '家庭', en: 'Family' },
    C: { code: 'C', zh: '公司', en: 'Company' },
    H: { code: 'H', zh: '合伙', en: 'Partnership' },
  };
  const DOMAIN_ORDER = ['P', 'F', 'C', 'H'];

  const TYPES = {
    资产: { type: '资产', pole: 'A', form: 'fluid', en: 'Asset', hint: '流体：现金/流动资产' },
    费用: { type: '费用', pole: 'A', form: 'steam', en: 'Expense', hint: '蒸汽：花掉就离开池子' },
    成本: { type: '成本', pole: 'A', form: 'ice', en: 'Cost', hint: '冰块：实物/固定资产' },
    负债: { type: '负债', pole: 'B', form: 'outside', en: 'Liability', hint: '外面：欠别人的' },
    收入: { type: '收入', pole: 'B', form: 'outside', en: 'Income', hint: '外面：流进来的' },
    权益: { type: '权益', pole: 'B', form: 'outside', en: 'Equity', hint: '外面：属于你的权益' },
  };
  const TYPE_ALL = ['资产', '费用', '成本', '负债', '收入', '权益'];
  const TYPE_ORDER = ['费用', '收入', '资产', '负债', '成本', '权益'];

  const TYPE_ALIAS = {
    资产类: '资产', 费用类: '费用', 成本类: '成本',
    负债类: '负债', 收入类: '收入', 权益类: '权益',
    所有者权益: '权益', 净资产: '权益',
    asset: '资产', assets: '资产',
    expense: '费用', expenses: '费用',
    cost: '成本', costs: '成本',
    liability: '负债', liabilities: '负债',
    income: '收入', revenue: '收入',
    equity: '权益',
  };

  const FORMS = { fluid: '流体', ice: '冰块', steam: '蒸汽', outside: '外部' };
  const KIND_TAG = { gain: '增益', suppress: '阻抑', time: '时间', plain: '普通' };

  function isDomain(d) {
    return !!DOMAINS[S(d).toUpperCase()];
  }

  function domainInfo(code) {
    return DOMAINS[S(code || 'P').toUpperCase()] || DOMAINS.P;
  }

  function domainLabel(code, lang) {
    const d = domainInfo(code);
    return lang === 'en' ? d.en : d.zh;
  }

  function normalizeDomain(raw, fallback) {
    const s = S(raw).trim().toUpperCase();
    if (DOMAINS[s]) return { ok: true, domain: s, error: '' };
    if (!s) return { ok: true, domain: fallback || 'P', error: '' };
    return { ok: false, domain: fallback || 'P', error: '域只认 P/F/C/H：' + raw };
  }

  function normalizeType(raw) {
    const s = S(raw).trim();
    if (!s) return { ok: false, type: '', pole: '', form: '', error: '财务大类不能为空' };
    const t = TYPES[s] ? s : TYPE_ALIAS[s.toLowerCase()] || TYPE_ALIAS[s];
    if (!t) {
      return { ok: false, type: '', pole: '', form: '', error: '大类只认：资产/费用/成本/负债/收入/权益' };
    }
    const info = TYPES[t];
    return { ok: true, type: t, pole: info.pole, form: info.form, en: info.en, error: '' };
  }

  function normalizeForm(type, raw) {
    const t = normalizeType(type);
    if (!t.ok) return { ok: false, form: '', error: t.error };
    const s = S(raw).trim().toLowerCase();
    if (!s) return { ok: true, form: t.form, error: '' };
    if (t.pole === 'B') return { ok: true, form: 'outside', error: '' };
    const zhMap = { 流体: 'fluid', 冰块: 'ice', 蒸汽: 'steam' };
    const f = FORMS[s] ? s : zhMap[s];
    if (!f || f === 'outside') return { ok: false, form: t.form, error: 'A 极形态只认 fluid/ice/steam' };
    return { ok: true, form: f, error: '' };
  }

  function normalizeCode(raw) {
    return S(raw).replace(/[\s\u3000]+/g, '').trim();
  }

  function normalizeWeight(raw, fallback) {
    const n = Number(raw);
    if (!Number.isFinite(n)) return fallback == null ? 100 : fallback;
    return Math.max(0, Math.min(1000, Math.round(n)));
  }

  function slug(raw) {
    return S(raw).trim().toLowerCase()
      .replace(/\s+/g, '_')
      .replace(/[^a-z0-9_\u4e00-\u9fff-]/g, '');
  }

  function emptyDict(vaultId, now) {
    const ts = (now instanceof Date ? now : new Date()).toISOString();
    return {
      format: 'txtvein-dict',
      version: 1,
      vaultId: vaultId || '',
      link: '',
      meta: {
        nextNode: 1, nextTag: 1, nextEvent: 1, nextChain: 1,
        nextRule: 1, nextPlan: 1, createdAt: ts, updatedAt: ts,
      },
      nodes: {}, tags: {}, behaviors: {}, aliases: {},
    };
  }

  function ensureMeta(dict) {
    if (!dict.meta || typeof dict.meta !== 'object') dict.meta = {};
    const m = dict.meta;
    ['nextNode', 'nextTag', 'nextEvent', 'nextChain', 'nextRule', 'nextPlan'].forEach((k) => {
      if (!Number.isFinite(Number(m[k])) || Number(m[k]) < 1) m[k] = 1;
      m[k] = Math.floor(Number(m[k]));
    });
    if (!m.createdAt) m.createdAt = new Date().toISOString();
    if (!m.updatedAt) m.updatedAt = m.createdAt;
    return dict;
  }

  function maxSeq(map, prefix) {
    let max = 0;
    Object.keys(map || {}).forEach((id) => {
      const m = S(id).match(new RegExp('^' + prefix + '_(\\d+)$'));
      if (m) max = Math.max(max, Number(m[1]));
    });
    return max;
  }

  function bumpMeta(dict) {
    ensureMeta(dict);
    dict.meta.nextNode = Math.max(dict.meta.nextNode, maxSeq(dict.nodes, 'N') + 1);
    dict.meta.nextTag = Math.max(dict.meta.nextTag, maxSeq(dict.tags, 'T') + 1);
    return dict;
  }

  function nextId(dict, kind) {
    ensureMeta(dict);
    const m = dict.meta;
    if (kind === 'node') {
      let n = m.nextNode;
      while (dict.nodes['N_' + String(n).padStart(3, '0')]) n += 1;
      m.nextNode = n + 1;
      return 'N_' + String(n).padStart(3, '0');
    }
    if (kind === 'tag') {
      let n = m.nextTag;
      while (dict.tags['T_' + String(n).padStart(2, '0')]) n += 1;
      m.nextTag = n + 1;
      return 'T_' + String(n).padStart(2, '0');
    }
    if (kind === 'event') {
      const id = 'E_' + String(m.nextEvent).padStart(4, '0');
      m.nextEvent += 1;
      return id;
    }
    if (kind === 'chain') {
      const id = 'C_' + String(m.nextChain).padStart(3, '0');
      m.nextChain += 1;
      return id;
    }
    if (kind === 'rule') {
      const id = 'R_' + String(m.nextRule).padStart(3, '0');
      m.nextRule += 1;
      return id;
    }
    if (kind === 'plan') {
      const id = 'R_' + String(m.nextPlan).padStart(3, '0');
      m.nextPlan += 1;
      return id;
    }
    throw new Error('unknown id kind: ' + kind);
  }

  function aliasesFor(dict, id) {
    const out = [];
    Object.keys(dict.aliases || {}).forEach((k) => {
      if ((dict.aliases[k] || []).includes(id)) out.push(k);
    });
    return out;
  }

  function addAlias(dict, alias, id) {
    const key = S(alias).trim();
    if (!key || !id) return { created: false, previous: [] };
    if (!dict.aliases) dict.aliases = {};
    let oldKey = key;
    if (!Object.prototype.hasOwnProperty.call(dict.aliases, key)) {
      const hit = Object.keys(dict.aliases).find((k) => k.toLowerCase() === key.toLowerCase());
      if (hit) oldKey = hit;
    }
    const prev = Array.isArray(dict.aliases[oldKey]) ? dict.aliases[oldKey].slice() : [];
    if (prev.includes(id)) return { created: false, previous: prev, key: oldKey };
    dict.aliases[oldKey] = Array.from(new Set(prev.concat(id)));
    return { created: true, previous: prev, key: oldKey };
  }

  function removeAlias(dict, alias, id) {
    const key = S(alias).trim();
    if (!key || !dict.aliases || !dict.aliases[key]) return false;
    dict.aliases[key] = dict.aliases[key].filter((x) => x !== id);
    if (!dict.aliases[key].length) delete dict.aliases[key];
    return true;
  }

  /* 基础别名：名字与简码。显式数字后缀别名（wx1/wx2）保留。 */
  function rebuildAliases(dict) {
    const old = dict.aliases || {};
    const keep = {};
    Object.keys(old).forEach((k) => {
      if (/^.+\d{1,2}$/.test(k) && Array.isArray(old[k])) keep[k] = old[k].slice();
    });
    dict.aliases = {};
    const put = (alias, id) => {
      const a = S(alias).trim();
      if (!a) return;
      const hit = Object.keys(dict.aliases).find((k) => k.toLowerCase() === a.toLowerCase());
      const key = hit || a;
      const arr = dict.aliases[key] || [];
      if (!arr.includes(id)) arr.push(id);
      dict.aliases[key] = arr;
    };
    Object.keys(dict.nodes || {}).forEach((id) => {
      const n = dict.nodes[id];
      [n.zh_name, n.en_name, n.zh_code, n.en_code].forEach((a) => put(a, id));
    });
    Object.keys(dict.tags || {}).forEach((id) => {
      const t = dict.tags[id];
      [t.zh_name, t.en_name, t.zh_code, t.en_code].forEach((a) => put(a, id));
    });
    Object.keys(keep).forEach((k) => {
      const ids = keep[k].filter((id) => dict.nodes[id] || dict.tags[id]);
      if (ids.length) dict.aliases[k] = ids;
    });
    return dict;
  }

  function addNode(dict, input) {
    const p = input || {};
    const t = normalizeType(p.type || p.zh_type || p.en_type);
    let type = t.type;
    let pole = t.pole;
    let form = t.form;
    if (!t.ok) {
      const pol = S(p.polarity).toUpperCase();
      if (pol === 'A' || pol === 'B') {
        type = pol === 'A' ? '资产' : '权益';
        pole = pol;
        form = pol === 'A' ? 'fluid' : 'outside';
      } else {
        return { ok: false, error: t.error };
      }
    }
    const formCheck = normalizeForm(type, p.form);
    if (!formCheck.ok) return { ok: false, error: formCheck.error };
    form = formCheck.form;

    const zhName = S(p.zh_name || p.name).trim();
    const enName = S(p.en_name).trim() || zhName;
    if (!zhName && !enName) return { ok: false, error: '节点要有名字' };
    const zhCode = normalizeCode(p.zh_code || p.code || zhName);
    const enCode = normalizeCode(p.en_code || slug(enName));
    if (!zhCode && !enCode) return { ok: false, error: '节点要有至少一个简码' };

    const dm = normalizeDomain(p.domain, 'P');
    if (!dm.ok) return { ok: false, error: dm.error };
    if (p.parent_id && !dict.nodes[p.parent_id]) return { ok: false, error: '父节点不存在：' + p.parent_id };
    if (p.polarity && S(p.polarity).toUpperCase() !== pole) {
      return { ok: false, error: '极性与大类不一致：' + type + ' 是 ' + pole + ' 极' };
    }

    const id = nextId(dict, 'node');
    dict.nodes[id] = {
      zh_name: zhName || enName,
      en_name: enName || zhName,
      zh_code: zhCode,
      en_code: enCode,
      polarity: pole,
      type,
      form,
      domain: dm.domain,
      parent_id: S(p.parent_id),
      weight: normalizeWeight(p.weight, 100),
      system: !!p.system,
      created_at: new Date().toISOString(),
    };
    addAlias(dict, zhCode, id);
    addAlias(dict, enCode, id);
    addAlias(dict, dict.nodes[id].zh_name, id);
    addAlias(dict, dict.nodes[id].en_name, id);
    ensureMeta(dict);
    dict.meta.updatedAt = new Date().toISOString();
    return { ok: true, id, node: dict.nodes[id] };
  }

  function updateNode(dict, id, patch) {
    const node = dict.nodes[id];
    if (!node) return { ok: false, error: '节点不存在：' + id };
    const p = patch || {};
    if (p.type != null) {
      const t = normalizeType(p.type);
      if (!t.ok) return { ok: false, error: t.error };
      node.type = t.type;
      node.polarity = t.pole;
      node.form = normalizeForm(t.type, p.form).form;
    } else if (p.polarity && S(p.polarity).toUpperCase() !== node.polarity) {
      return { ok: false, error: '极性由大类决定，不能单独改' };
    }
    ['zh_name', 'en_name', 'zh_code', 'en_code', 'parent_id'].forEach((k) => {
      if (p[k] != null) node[k] = S(p[k]).trim();
    });
    if (p.domain != null) {
      const d = normalizeDomain(p.domain, node.domain);
      if (!d.ok) return { ok: false, error: d.error };
      node.domain = d.domain;
    }
    if (p.weight != null) node.weight = normalizeWeight(p.weight, node.weight);
    if (p.parent_id && !dict.nodes[p.parent_id]) return { ok: false, error: '父节点不存在' };
    if (!node.zh_name && !node.en_name) return { ok: false, error: '节点要有名字' };
    rebuildAliases(dict);
    ensureMeta(dict);
    dict.meta.updatedAt = new Date().toISOString();
    return { ok: true, node };
  }

  function removeNode(dict, id) {
    if (!dict.nodes[id]) return { ok: false, error: '节点不存在' };
    delete dict.nodes[id];
    Object.keys(dict.aliases || {}).forEach((k) => {
      dict.aliases[k] = (dict.aliases[k] || []).filter((x) => x !== id);
      if (!dict.aliases[k].length) delete dict.aliases[k];
    });
    Object.keys(dict.nodes).forEach((k) => {
      if (dict.nodes[k].parent_id === id) dict.nodes[k].parent_id = '';
    });
    return { ok: true };
  }

  function tagKindOf(name) {
    const s = S(name);
    if (/增益|回血|滋养|高光|gain/i.test(s)) return 'gain';
    if (/阻抑|内耗|流失|暗域|suppress|drain/i.test(s)) return 'suppress';
    if (/时间|time|min/i.test(s)) return 'time';
    return 'plain';
  }

  function addTag(dict, input) {
    const p = input || {};
    const name = S(p.zh_name || p.name).trim();
    if (!name) return { ok: false, error: '标签要有名字' };
    const dm = normalizeDomain(p.domain, 'P');
    if (!dm.ok) return { ok: false, error: dm.error };
    if (p.parent_id && !dict.tags[p.parent_id]) return { ok: false, error: '父标签不存在' };
    const id = nextId(dict, 'tag');
    const enName = S(p.en_name).trim() || name;
    dict.tags[id] = {
      zh_name: name,
      en_name: enName,
      zh_code: normalizeCode(p.zh_code || name),
      en_code: normalizeCode(p.en_code || slug(enName)),
      domain: dm.domain,
      parent_id: S(p.parent_id),
      weight: normalizeWeight(p.weight, 10),
      kind: p.kind || tagKindOf(name),
      created_at: new Date().toISOString(),
    };

    addAlias(dict, dict.tags[id].zh_name, id);
    ensureMeta(dict);
    dict.meta.updatedAt = new Date().toISOString();
    return { ok: true, id, tag: dict.tags[id] };
  }

  function updateTag(dict, id, patch) {
    const tag = dict.tags[id];
    if (!tag) return { ok: false, error: '标签不存在' };
    const p = patch || {};
    ['zh_name', 'en_name', 'zh_code', 'en_code', 'parent_id'].forEach((k) => {
      if (p[k] != null) tag[k] = S(p[k]).trim();
    });
    if (p.domain != null) {
      const d = normalizeDomain(p.domain, tag.domain);
      if (!d.ok) return { ok: false, error: d.error };
      tag.domain = d.domain;
    }
    if (p.weight != null) tag.weight = normalizeWeight(p.weight, tag.weight);
    if (p.kind) tag.kind = p.kind;
    if (!tag.zh_name && !tag.en_name) return { ok: false, error: '标签要有名字' };
    rebuildAliases(dict);
    ensureMeta(dict);
    dict.meta.updatedAt = new Date().toISOString();
    return { ok: true, tag };
  }

  function removeTag(dict, id) {
    if (!dict.tags[id]) return { ok: false, error: '标签不存在' };
    delete dict.tags[id];
    Object.keys(dict.aliases || {}).forEach((k) => {
      dict.aliases[k] = (dict.aliases[k] || []).filter((x) => x !== id);
      if (!dict.aliases[k].length) delete dict.aliases[k];
    });
    Object.keys(dict.tags).forEach((k) => {
      if (dict.tags[k].parent_id === id) dict.tags[k].parent_id = '';
    });
    return { ok: true };
  }

  function aliasIds(dict, token) {
    const t = S(token).trim();
    if (!t || !dict.aliases) return [];
    if (dict.aliases[t]) return dict.aliases[t].slice();
    const hit = Object.keys(dict.aliases).find((k) => k.toLowerCase() === t.toLowerCase());
    return hit ? dict.aliases[hit].slice() : [];
  }

  function candidateInfo(dict, id, ctx) {
    const node = dict.nodes[id];
    const tag = dict.tags[id];
    const x = node || tag;
    if (!x) return null;
    const lang = (ctx && ctx.lang) || 'zh';
    return {
      id,
      kind: node ? 'node' : 'tag',
      name: x.zh_name,
      en_name: x.en_name,
      code: x.zh_code,
      en_code: x.en_code,
      label: lang === 'en' ? (x.en_name || x.zh_name) : (x.zh_name || x.en_name),
      codeLabel: lang === 'en' ? (x.en_code || x.zh_code) : (x.zh_code || x.en_code),
      type: x.type || '',
      pole: x.polarity || '',
      form: x.form || '',
      domain: x.domain || 'P',
      weight: Number(x.weight) || 0,
      system: !!x.system,
      kindTag: tag ? tag.kind : '',
    };
  }

  function rankCandidates(dict, ids, ctx) {
    const c = ctx || {};
    return ids.map((id) => candidateInfo(dict, id, c)).filter(Boolean).sort((a, b) => {
      const da = c.domain && a.domain === c.domain ? 1 : 0;
      const db = c.domain && b.domain === c.domain ? 1 : 0;
      if (da !== db) return db - da;
      if (c.polarity) {
        const pa = a.pole === c.polarity ? 1 : 0;
        const pb = b.pole === c.polarity ? 1 : 0;
        if (pa !== pb) return pb - pa;
      }
      if (b.weight !== a.weight) return b.weight - a.weight;
      if (a.domain !== b.domain) return DOMAIN_ORDER.indexOf(a.domain) - DOMAIN_ORDER.indexOf(b.domain);
      return a.id.localeCompare(b.id);
    });
  }

  function collectMatches(dict, token) {
    const t = S(token).trim();
    const low = t.toLowerCase();
    const ids = [];
    Object.keys(dict.nodes || {}).forEach((id) => {
      const n = dict.nodes[id];
      if (n.system) return;
      if (S(n.zh_code).toLowerCase() === low || S(n.en_code).toLowerCase() === low
        || n.zh_name === t || n.en_name === t) ids.push(id);
    });
    return ids;
  }

  function collectPrefix(dict, token) {
    const t = S(token).trim();
    if (!t) return [];
    const low = t.toLowerCase();
    const ids = [];
    Object.keys(dict.nodes || {}).forEach((id) => {
      const n = dict.nodes[id];
      if (n.system) return;
      if (S(n.zh_code).toLowerCase().startsWith(low) || S(n.en_code).toLowerCase().startsWith(low)
        || S(n.zh_name).startsWith(t) || S(n.en_name).toLowerCase().startsWith(low)) ids.push(id);
    });
    return ids;
  }

  function ambiguous(token, ranked) {
    return { ok: false, code: 'AMBIGUOUS', token, candidates: ranked, error: token + ' 有 ' + ranked.length + ' 个候选' };
  }

  function resolveAlias(dict, rawToken, ctx) {
    const c = ctx || {};
    let token = S(rawToken).trim();
    const forced = token.startsWith('!');
    if (forced) token = token.slice(1).trim();
    if (!token) return { ok: false, code: 'EMPTY', error: '缺节点' };

    let ids = aliasIds(dict, token).filter((id) => dict.nodes[id]);
    if (ids.length === 1) return { ok: true, id: ids[0], node: dict.nodes[ids[0]], via: 'alias', forced };
    if (ids.length > 1) {
      const ranked = rankCandidates(dict, ids, c);
      if (forced) return { ok: true, id: ranked[0].id, node: dict.nodes[ranked[0].id], via: 'forced', forced, candidates: ranked };

    }

    ids = collectMatches(dict, token);
    if (ids.length === 1) return { ok: true, id: ids[0], node: dict.nodes[ids[0]], via: 'code', forced };
    if (ids.length > 1) {
      const ranked = rankCandidates(dict, ids, c);
      if (forced) return { ok: true, id: ranked[0].id, node: dict.nodes[ranked[0].id], via: 'forced', forced, candidates: ranked };

    }

    const m = token.match(/^(.+?)(\d{1,2})$/);
    if (m) {
      const base = m[1];
      const idx = Number(m[2]);
      let pool = aliasIds(dict, base).filter((id) => dict.nodes[id]);
      if (!pool.length) pool = collectMatches(dict, base);
      if (!pool.length) pool = collectPrefix(dict, base);
      const ranked = rankCandidates(dict, pool, c);
      if (idx >= 1 && idx <= ranked.length) {
        const pick = ranked[idx - 1];
        const added = addAlias(dict, token, pick.id);

    if (ids.length === 1) return { ok: true, id: ids[0], node: dict.nodes[ids[0]], via: 'prefix', forced };

  }

  function tagMatches(dict, name, domain) {
    const t = S(name).trim();
    const low = t.toLowerCase();
    const ids = [];
    Object.keys(dict.tags || {}).forEach((id) => {
      const x = dict.tags[id];
      if (x.zh_name === t || x.en_name === t
        || S(x.zh_code).toLowerCase() === low || S(x.en_code).toLowerCase() === low) ids.push(id);
    });

      const inDomain = ids.filter((id) => dict.tags[id].domain === domain);
      if (inDomain.length) return inDomain;
    }
    return ids;
  }

  function resolveTag(dict, name, ctx) {
    const c = ctx || {};
    const t = S(name).trim().replace(/^#/, '');
    if (!t) return { ok: false, code: 'EMPTY', error: '标签为空' };
    const aliasKey = Object.keys(dict.aliases || {}).find((k) => k.toLowerCase() === t.toLowerCase());
    if (aliasKey) {
      const aliasIds = (dict.aliases[aliasKey] || []).filter((id) => dict.tags[id]);
      if (aliasIds.length === 1) return { ok: true, id: aliasIds[0], tag: dict.tags[aliasIds[0]], via: 'alias' };
      if (aliasIds.length > 1) return ambiguous(t, rankCandidates(dict, aliasIds, c));

    if (ids.length === 1) return { ok: true, id: ids[0], tag: dict.tags[ids[0]], via: 'exact' };

      zh_name: r.token,
      en_name: r.token,
      domain: c.domain || 'P',
      parent_id: c.parentId || '',

    });

  function getAncestorPath(dict, id) {
    const out = [];

  }

    return getAncestorPath(dict, id).reverse()
      .map((x) => (lang === 'en' ? x.item.en_name || x.item.zh_name : x.item.zh_name || x.item.en_name))

  function getSiblingNodes(dict, id) {

      .filter((k) => k !== id && (dict.nodes[k].parent_id || '') === parent && dict.nodes[k].domain === node.domain)

    return Object.keys(dict.nodes)
      .filter((k) => dict.nodes[k].parent_id === id)
      .map((k) => Object.assign({ id: k }, dict.nodes[k]))
      .sort((a, b) => (b.weight || 0) - (a.weight || 0));

  function listNodes(dict, opts) {
    const o = opts || {};
    return Object.keys(dict.nodes)
      .filter((id) => (o.includeSystem ? true : !dict.nodes[id].system))
      .filter((id) => (!o.domain || dict.nodes[id].domain === o.domain))
      .filter((id) => (!o.type || dict.nodes[id].type === o.type))
      .map((id) => Object.assign({ id }, dict.nodes[id]))

  function searchNodes(dict, query, opts) {

      const n = dict.nodes[id];

      if (!q) { ids.push(id); return; }
      if (S(n.zh_code).toLowerCase().includes(low) || S(n.en_code).toLowerCase().includes(low)

  function searchTags(dict, query, opts) {
    const o = opts || {};
    const q = S(query).trim();
    const low = q.toLowerCase();
    const ids = Object.keys(dict.tags || {}).filter((id) => {
      const t = dict.tags[id];
      if (!q) return true;
      return S(t.zh_code).toLowerCase().includes(low) || S(t.en_code).toLowerCase().includes(low)

  function bumpWeight(dict, id, n) {
    const x = dict.nodes[id] || dict.tags[id];

  function uniqueAliases(dict, id) {
    const out = [];
    Object.keys(dict.aliases || {}).forEach((k) => {

   * 展示用简码：优先 zh_code/en_code；若该码是多义（wx），

   */
  function displayCode(dict, id, lang) {
    const x = dict.nodes[id] || dict.tags[id];
    if (!x) return id;

      .filter((a) => primary && new RegExp('^' + esc + '\\d+$').test(a))
      .sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));

    if (primary && arr.length > 1 && arr.includes(id)) return primary + (arr.indexOf(id) + 1);

  }

  function renderNode(dict, id, mode, lang) {
    const n = dict.nodes[id];
    if (!n) return id;
    if (mode === 'CODE') return displayCode(dict, id, lang);
    return lang === 'en' ? (n.en_name || n.zh_name) : (n.zh_name || n.en_name);
  }

  function renderTag(dict, id, mode, lang) {
    const t = dict.tags[id];
    if (!t) return id;
    if (mode === 'CODE') return displayCode(dict, id, lang);
    return lang === 'en' ? (t.en_name || t.zh_name) : (t.zh_name || t.en_name);
  }

  function renderBehavior(dict, id, mode, lang) {
    const h = dict.behaviors && dict.behaviors[id];
    if (!h) return id;
    if (mode === 'CODE') {
      const primary = lang === 'en' ? (h.en_code || h.zh_code) : (h.zh_code || h.en_code);
      return primary || id;
    }
    return lang === 'en' ? (h.en_name || h.zh_name) : (h.zh_name || h.en_name);
  }

  function nodeLabel(dict, id, lang) {
    return renderNode(dict, id, 'PLAIN', lang || 'zh');
  }

  function validateDict(dict) {
    const issues = [];
    const add = (level, code, message, id) => {
      issues.push({ level, code, message, id: id || '' });
    };
    if (!dict || typeof dict !== 'object') {
      add('fatal', 'NOT_OBJECT', '字典不是对象');
      return { ok: false, issues };
    }
    if (dict.format && dict.format !== 'txtvein-dict') add('warn', 'FORMAT', 'format 不是 txtvein-dict');
    Object.keys(dict.nodes || {}).forEach((id) => {
      const n = dict.nodes[id];
      if (!/^N_[A-Za-z0-9_]+$/.test(id)) add('error', 'NODE_ID', '节点 ID 不合规：' + id, id);
      if (!n.zh_name && !n.en_name) add('error', 'NODE_NAME', '节点缺名字：' + id, id);
      const t = normalizeType(n.type);
      if (!t.ok) add('error', 'NODE_TYPE', '节点大类不合法：' + id, id);
      else if (t.pole !== n.polarity) add('error', 'NODE_POLARITY', '极性与大类不一致：' + id, id);
      if (!DOMAINS[n.domain]) add('error', 'NODE_DOMAIN', '节点域不合法：' + id, id);
      if (n.parent_id && !dict.nodes[n.parent_id]) add('warn', 'NODE_PARENT', '父节点不存在：' + id, id);
    });
    Object.keys(dict.tags || {}).forEach((id) => {
      const t = dict.tags[id];
      if (!/^T_[A-Za-z0-9_]+$/.test(id)) add('error', 'TAG_ID', '标签 ID 不合规：' + id, id);
      if (!t.zh_name && !t.en_name) add('error', 'TAG_NAME', '标签缺名字：' + id, id);
      if (!DOMAINS[t.domain]) add('error', 'TAG_DOMAIN', '标签域不合法：' + id, id);
      if (t.parent_id && !dict.tags[t.parent_id]) add('warn', 'TAG_PARENT', '父标签不存在：' + id, id);
    });
    Object.keys(dict.behaviors || {}).forEach((id) => {
      const h = dict.behaviors[id];
      if (!/^H_[A-Za-z0-9_]+$/.test(id)) add('error', 'BEHAVIOR_ID', '行为项 ID 不合规：' + id, id);
      if (!h.zh_name && !h.en_name) add('error', 'BEHAVIOR_NAME', '行为项缺名字：' + id, id);
      if (!DOMAINS[h.domain]) add('error', 'BEHAVIOR_DOMAIN', '行为项域不合法：' + id, id);
      if (h.parent_id && !dict.behaviors[h.parent_id]) add('warn', 'BEHAVIOR_PARENT', '父行为项不存在：' + id, id);
    });
    const seen = new Map();
    Object.keys(dict.aliases || {}).forEach((k) => {
      const arr = dict.aliases[k];
      if (!Array.isArray(arr) || !arr.length) add('warn', 'ALIAS_EMPTY', '空别名：' + k);
      (arr || []).forEach((id) => {
        if (!dict.nodes[id] && !dict.tags[id] && !(dict.behaviors && dict.behaviors[id])) {
          add('warn', 'ALIAS_TARGET', '别名指向不存在的 ID：' + k + ' → ' + id);
        }
      });
      const low = k.toLowerCase();
      if (seen.has(low)) add('warn', 'ALIAS_DUP', '别名大小写重复：' + k + ' / ' + seen.get(low));
      else seen.set(low, k);
    });
    Object.keys(dict.nodes || {}).forEach((id) => {
      let cur = dict.nodes[id] && dict.nodes[id].parent_id;
      let guard = 0;
      while (cur && guard < 64) {
        if (cur === id) { add('error', 'NODE_CYCLE', '节点父链成环：' + id, id); break; }
        cur = dict.nodes[cur] && dict.nodes[cur].parent_id;
        guard += 1;
      }
    });
    return { ok: issues.filter((x) => x.level !== 'warn').length === 0, issues };
  }

  TV.dict = {
    DOMAINS, DOMAIN_ORDER, TYPES, TYPE_ALL, TYPE_ORDER, TYPE_ALIAS, FORMS, KIND_TAG,
    isDomain, domainInfo, domainLabel, normalizeDomain, normalizeType, normalizeForm,
    normalizeCode, normalizeWeight, slug, emptyDict, ensureMeta, bumpMeta, nextId,
    aliasesFor, addAlias, removeAlias, rebuildAliases,
    addNode, updateNode, removeNode, addTag, updateTag, removeTag, tagKindOf,
    aliasIds, candidateInfo, rankCandidates, resolveAlias, resolveTag, ensureTag,
    getAncestorPath, pathLabel, getSiblingNodes, getChildren, listNodes, searchNodes,
    searchTags, bumpWeight, renderNode, renderTag, renderBehavior, nodeLabel, validateDict,

/* TxtVein · 后台 ID（两层）

 * 用户永远看不到 ID。ID 只存在于编译后的图里：
 *   字典条目：N_ + 8 hex / T_ + 8 hex / C_ + 8 / R_ + 8
 *   流水记录：E_ + 12 hex
 *
 * 8 hex = 32 bit；字典条目通常几百到几千，配合插入查重足够。
 * 12 hex = 48 bit；流水可能上万到十万，留更大余量。

(function (root) {

  const TV = (root.TxtVein = root.TxtVein || {});

  function randomHex(bytes) {
    const n = Math.max(1, Number(bytes) || 4);
    const c = root.crypto;
    if (c && c.getRandomValues) {
      const arr = new Uint8Array(n);
      c.getRandomValues(arr);
      return Array.from(arr).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    let s = '';
    for (let i = 0; i < n; i += 1) s += Math.floor(Math.random() * 256).toString(16).padStart(2, '0');

  function newId(prefix, bytes) {

  /** 带查重：exists(id) 返回 true 就重抽；最多 100 次。 */
  function newUnique(prefix, bytes, exists) {

      const id = newId(prefix, bytes);
